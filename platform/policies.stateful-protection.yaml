---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: stateful-protection
  labels:
    app.kubernetes.io/name: stateful-protection
    app.kubernetes.io/part-of: kyverno
    app.kubernetes.io/component: policy
    entity: cluster
    capability: governance
  annotations:
    policies.kyverno.io/title: Protect stateful objects
    policies.kyverno.io/category: Resiliency
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: All kinds
    policies.kyverno.io/description: >-
      Denies deleting any object labelled stateful=true, deleting a Namespace, Kustomization or HelmRelease that holds one, and changing or removing that label, unless the request comes from Flux, the CNPG operator, Crossplane, Kyverno or the Kubernetes garbage and namespace controllers. Pods and Services are skipped while older CNPG labels on them are cleared. projects#913.
spec:
  background: false
  webhookConfiguration:
    failurePolicy: Ignore
  rules:
    - name: deny-delete-stateful
      match:
        any:
          - resources:
              kinds:
                - "*"
              operations:
                - DELETE
      exclude:
        any:
          - resources:
              kinds:
                - Pod
                - Service
          - subjects:
              - kind: ServiceAccount
                name: kustomize-controller
                namespace: flux-system
              - kind: ServiceAccount
                name: helm-controller
                namespace: flux-system
              - kind: ServiceAccount
                name: cnpg-cloudnative-pg
                namespace: cnpg-system
              - kind: ServiceAccount
                name: crossplane
                namespace: crossplane-system
              - kind: ServiceAccount
                name: kyverno-admission-controller
                namespace: kyverno
              - kind: ServiceAccount
                name: kyverno-cleanup-controller
                namespace: kyverno
              - kind: ServiceAccount
                name: kyverno-background-controller
                namespace: kyverno
              - kind: ServiceAccount
                name: kyverno-reports-controller
                namespace: kyverno
              - kind: ServiceAccount
                name: generic-garbage-collector
                namespace: kube-system
              - kind: ServiceAccount
                name: namespace-controller
                namespace: kube-system
              - kind: User
                name: system:kube-controller-manager
      preconditions:
        all:
          - key: "{{ request.oldObject.metadata.labels.stateful || '' }}"
            operator: Equals
            value: "true"
        any: []
      validate:
        failureAction: Enforce
        message: >-
          A policy blocks this delete because deleting it would delete a stateful resource: {{ request.oldObject.kind }}/{{ request.oldObject.metadata.name }}. To delete it, remove it from Git and let Flux prune it.
        deny: {}
    - name: deny-stateful-label-change
      match:
        any:
          - resources:
              kinds:
                - "*"
              operations:
                - UPDATE
      exclude:
        any:
          - resources:
              kinds:
                - Pod
                - Service
                - Lease
                - Endpoints
                - EndpointSlice
          - subjects:
              - kind: ServiceAccount
                name: kustomize-controller
                namespace: flux-system
              - kind: ServiceAccount
                name: helm-controller
                namespace: flux-system
              - kind: ServiceAccount
                name: cnpg-cloudnative-pg
                namespace: cnpg-system
              - kind: ServiceAccount
                name: crossplane
                namespace: crossplane-system
              - kind: ServiceAccount
                name: kyverno-admission-controller
                namespace: kyverno
              - kind: ServiceAccount
                name: kyverno-cleanup-controller
                namespace: kyverno
              - kind: ServiceAccount
                name: kyverno-background-controller
                namespace: kyverno
              - kind: ServiceAccount
                name: kyverno-reports-controller
                namespace: kyverno
              - kind: ServiceAccount
                name: generic-garbage-collector
                namespace: kube-system
              - kind: ServiceAccount
                name: namespace-controller
                namespace: kube-system
              - kind: User
                name: system:kube-controller-manager
      preconditions:
        all:
          - key: "{{ request.oldObject.metadata.labels.stateful || '' }}"
            operator: NotEquals
            value: "{{ request.object.metadata.labels.stateful || '' }}"
        any: []
      validate:
        failureAction: Enforce
        message: >-
          A policy blocks this change because only Kyverno sets the stateful label: {{ request.object.kind }}/{{ request.object.metadata.name }}.
        deny: {}
    - name: deny-delete-namespace-holding-stateful
      match:
        any:
          - resources:
              kinds:
                - Namespace
              operations:
                - DELETE
      exclude:
        any:
          - subjects:
              - kind: ServiceAccount
                name: kustomize-controller
                namespace: flux-system
              - kind: ServiceAccount
                name: helm-controller
                namespace: flux-system
              - kind: ServiceAccount
                name: cnpg-cloudnative-pg
                namespace: cnpg-system
              - kind: ServiceAccount
                name: crossplane
                namespace: crossplane-system
              - kind: ServiceAccount
                name: kyverno-admission-controller
                namespace: kyverno
              - kind: ServiceAccount
                name: kyverno-cleanup-controller
                namespace: kyverno
              - kind: ServiceAccount
                name: kyverno-background-controller
                namespace: kyverno
              - kind: ServiceAccount
                name: kyverno-reports-controller
                namespace: kyverno
              - kind: ServiceAccount
                name: generic-garbage-collector
                namespace: kube-system
              - kind: ServiceAccount
                name: namespace-controller
                namespace: kube-system
              - kind: User
                name: system:kube-controller-manager
      context:
        - name: pvcCount
          apiCall:
            urlPath: "/api/v1/namespaces/{{ request.oldObject.metadata.name }}/persistentvolumeclaims?labelSelector=stateful%3Dtrue"
            jmesPath: "items | length(@)"
        - name: clusterCount
          apiCall:
            urlPath: "/apis/postgresql.cnpg.io/v1/namespaces/{{ request.oldObject.metadata.name }}/clusters?labelSelector=stateful%3Dtrue"
            jmesPath: "items | length(@)"
      preconditions:
        any:
          - key: "{{ pvcCount }}"
            operator: GreaterThan
            value: 0
          - key: "{{ clusterCount }}"
            operator: GreaterThan
            value: 0
      validate:
        failureAction: Enforce
        message: >-
          A policy blocks this delete because deleting it would delete a stateful resource inside Namespace/{{ request.oldObject.metadata.name }}. To delete it, remove it from Git and let Flux prune it.
        deny: {}
    - name: deny-delete-kustomization-holding-stateful
      match:
        any:
          - resources:
              kinds:
                - kustomize.toolkit.fluxcd.io/v1/Kustomization
              operations:
                - DELETE
      exclude:
        any:
          - subjects:
              - kind: ServiceAccount
                name: kustomize-controller
                namespace: flux-system
              - kind: ServiceAccount
                name: helm-controller
                namespace: flux-system
              - kind: ServiceAccount
                name: cnpg-cloudnative-pg
                namespace: cnpg-system
              - kind: ServiceAccount
                name: crossplane
                namespace: crossplane-system
              - kind: ServiceAccount
                name: kyverno-admission-controller
                namespace: kyverno
              - kind: ServiceAccount
                name: kyverno-cleanup-controller
                namespace: kyverno
              - kind: ServiceAccount
                name: kyverno-background-controller
                namespace: kyverno
              - kind: ServiceAccount
                name: kyverno-reports-controller
                namespace: kyverno
              - kind: ServiceAccount
                name: generic-garbage-collector
                namespace: kube-system
              - kind: ServiceAccount
                name: namespace-controller
                namespace: kube-system
              - kind: User
                name: system:kube-controller-manager
      context:
        - name: owner
          variable:
            value: "kustomize.toolkit.fluxcd.io%2Fname%3D{{ request.oldObject.metadata.name }}%2Ckustomize.toolkit.fluxcd.io%2Fnamespace%3D{{ request.oldObject.metadata.namespace }}"
        - name: pvcCount
          apiCall:
            urlPath: "/api/v1/persistentvolumeclaims?labelSelector=stateful%3Dtrue%2C{{ owner }}"
            jmesPath: "items | length(@)"
        - name: clusterCount
          apiCall:
            urlPath: "/apis/postgresql.cnpg.io/v1/clusters?labelSelector=stateful%3Dtrue%2C{{ owner }}"
            jmesPath: "items | length(@)"
      preconditions:
        any:
          - key: "{{ pvcCount }}"
            operator: GreaterThan
            value: 0
          - key: "{{ clusterCount }}"
            operator: GreaterThan
            value: 0
      validate:
        failureAction: Enforce
        message: >-
          A policy blocks this delete because deleting it would delete a stateful resource managed by Kustomization/{{ request.oldObject.metadata.name }}. To delete it, remove it from Git and let Flux prune it.
        deny: {}
    - name: deny-delete-kustomization-owning-namespace-holding-stateful
      match:
        any:
          - resources:
              kinds:
                - kustomize.toolkit.fluxcd.io/v1/Kustomization
              operations:
                - DELETE
      exclude:
        any:
          - subjects:
              - kind: ServiceAccount
                name: kustomize-controller
                namespace: flux-system
              - kind: ServiceAccount
                name: helm-controller
                namespace: flux-system
              - kind: ServiceAccount
                name: cnpg-cloudnative-pg
                namespace: cnpg-system
              - kind: ServiceAccount
                name: crossplane
                namespace: crossplane-system
              - kind: ServiceAccount
                name: kyverno-admission-controller
                namespace: kyverno
              - kind: ServiceAccount
                name: kyverno-cleanup-controller
                namespace: kyverno
              - kind: ServiceAccount
                name: kyverno-background-controller
                namespace: kyverno
              - kind: ServiceAccount
                name: kyverno-reports-controller
                namespace: kyverno
              - kind: ServiceAccount
                name: generic-garbage-collector
                namespace: kube-system
              - kind: ServiceAccount
                name: namespace-controller
                namespace: kube-system
              - kind: User
                name: system:kube-controller-manager
      context:
        - name: ownedNamespaces
          apiCall:
            urlPath: "/api/v1/namespaces?labelSelector=kustomize.toolkit.fluxcd.io%2Fname%3D{{ request.oldObject.metadata.name }}%2Ckustomize.toolkit.fluxcd.io%2Fnamespace%3D{{ request.oldObject.metadata.namespace }}"
            jmesPath: "items[].metadata.name"
      validate:
        failureAction: Enforce
        message: >-
          A policy blocks this delete because deleting it would delete a stateful resource inside a Namespace managed by Kustomization/{{ request.oldObject.metadata.name }}. To delete it, remove it from Git and let Flux prune it.
        foreach:
          - list: "ownedNamespaces"
            context:
              - name: pvcCount
                apiCall:
                  urlPath: "/api/v1/namespaces/{{ element }}/persistentvolumeclaims?labelSelector=stateful%3Dtrue"
                  jmesPath: "items | length(@)"
              - name: clusterCount
                apiCall:
                  urlPath: "/apis/postgresql.cnpg.io/v1/namespaces/{{ element }}/clusters?labelSelector=stateful%3Dtrue"
                  jmesPath: "items | length(@)"
            deny:
              conditions:
                any:
                  - key: "{{ pvcCount }}"
                    operator: GreaterThan
                    value: 0
                  - key: "{{ clusterCount }}"
                    operator: GreaterThan
                    value: 0
    - name: deny-delete-kustomization-owning-kustomization-holding-stateful
      match:
        any:
          - resources:
              kinds:
                - kustomize.toolkit.fluxcd.io/v1/Kustomization
              operations:
                - DELETE
      exclude:
        any:
          - subjects:
              - kind: ServiceAccount
                name: kustomize-controller
                namespace: flux-system
              - kind: ServiceAccount
                name: helm-controller
                namespace: flux-system
              - kind: ServiceAccount
                name: cnpg-cloudnative-pg
                namespace: cnpg-system
              - kind: ServiceAccount
                name: crossplane
                namespace: crossplane-system
              - kind: ServiceAccount
                name: kyverno-admission-controller
                namespace: kyverno
              - kind: ServiceAccount
                name: kyverno-cleanup-controller
                namespace: kyverno
              - kind: ServiceAccount
                name: kyverno-background-controller
                namespace: kyverno
              - kind: ServiceAccount
                name: kyverno-reports-controller
                namespace: kyverno
              - kind: ServiceAccount
                name: generic-garbage-collector
                namespace: kube-system
              - kind: ServiceAccount
                name: namespace-controller
                namespace: kube-system
              - kind: User
                name: system:kube-controller-manager
      context:
        - name: children
          apiCall:
            urlPath: "/apis/kustomize.toolkit.fluxcd.io/v1/kustomizations?labelSelector=kustomize.toolkit.fluxcd.io%2Fname%3D{{ request.oldObject.metadata.name }}%2Ckustomize.toolkit.fluxcd.io%2Fnamespace%3D{{ request.oldObject.metadata.namespace }}"
            jmesPath: "items[].{name: metadata.name, namespace: metadata.namespace}"
      validate:
        failureAction: Enforce
        message: >-
          A policy blocks this delete because deleting it would delete a stateful resource managed by a Kustomization under Kustomization/{{ request.oldObject.metadata.name }}. To delete it, remove it from Git and let Flux prune it.
        foreach:
          - list: "children"
            context:
              - name: pvcCount
                apiCall:
                  urlPath: "/api/v1/persistentvolumeclaims?labelSelector=stateful%3Dtrue%2Ckustomize.toolkit.fluxcd.io%2Fname%3D{{ element.name }}%2Ckustomize.toolkit.fluxcd.io%2Fnamespace%3D{{ element.namespace }}"
                  jmesPath: "items | length(@)"
              - name: clusterCount
                apiCall:
                  urlPath: "/apis/postgresql.cnpg.io/v1/clusters?labelSelector=stateful%3Dtrue%2Ckustomize.toolkit.fluxcd.io%2Fname%3D{{ element.name }}%2Ckustomize.toolkit.fluxcd.io%2Fnamespace%3D{{ element.namespace }}"
                  jmesPath: "items | length(@)"
            deny:
              conditions:
                any:
                  - key: "{{ pvcCount }}"
                    operator: GreaterThan
                    value: 0
                  - key: "{{ clusterCount }}"
                    operator: GreaterThan
                    value: 0
    - name: deny-delete-helmrelease-holding-stateful
      match:
        any:
          - resources:
              kinds:
                - helm.toolkit.fluxcd.io/v2/HelmRelease
              operations:
                - DELETE
      exclude:
        any:
          - subjects:
              - kind: ServiceAccount
                name: kustomize-controller
                namespace: flux-system
              - kind: ServiceAccount
                name: helm-controller
                namespace: flux-system
              - kind: ServiceAccount
                name: cnpg-cloudnative-pg
                namespace: cnpg-system
              - kind: ServiceAccount
                name: crossplane
                namespace: crossplane-system
              - kind: ServiceAccount
                name: kyverno-admission-controller
                namespace: kyverno
              - kind: ServiceAccount
                name: kyverno-cleanup-controller
                namespace: kyverno
              - kind: ServiceAccount
                name: kyverno-background-controller
                namespace: kyverno
              - kind: ServiceAccount
                name: kyverno-reports-controller
                namespace: kyverno
              - kind: ServiceAccount
                name: generic-garbage-collector
                namespace: kube-system
              - kind: ServiceAccount
                name: namespace-controller
                namespace: kube-system
              - kind: User
                name: system:kube-controller-manager
      context:
        - name: owner
          variable:
            value: "helm.toolkit.fluxcd.io%2Fname%3D{{ request.oldObject.metadata.name }}%2Chelm.toolkit.fluxcd.io%2Fnamespace%3D{{ request.oldObject.metadata.namespace }}"
        - name: pvcCount
          apiCall:
            urlPath: "/api/v1/persistentvolumeclaims?labelSelector=stateful%3Dtrue%2C{{ owner }}"
            jmesPath: "items | length(@)"
        - name: clusterCount
          apiCall:
            urlPath: "/apis/postgresql.cnpg.io/v1/clusters?labelSelector=stateful%3Dtrue%2C{{ owner }}"
            jmesPath: "items | length(@)"
      preconditions:
        any:
          - key: "{{ pvcCount }}"
            operator: GreaterThan
            value: 0
          - key: "{{ clusterCount }}"
            operator: GreaterThan
            value: 0
      validate:
        failureAction: Enforce
        message: >-
          A policy blocks this delete because deleting it would delete a stateful resource managed by HelmRelease/{{ request.oldObject.metadata.name }}. To delete it, remove it from Git and let Flux prune it.
        deny: {}
