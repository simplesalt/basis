apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: flux-governance
  labels:
    app.kubernetes.io/name: flux-governance
    app.kubernetes.io/part-of: kyverno
    app.kubernetes.io/component: policy
    entity: cluster
    capability: governance
  annotations:
    policies.kyverno.io/title: Flux governance
    policies.kyverno.io/category: GitOps
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: HelmRelease, Kustomization
    policies.kyverno.io/description: >-
      Defaults spec.driftDetection.mode to enabled on every HelmRelease so that helm-controller re-checks chart-applied objects against the stored release manifest each interval. The dry-run in that check passes through Kyverno's admission webhook, so a changed admission mutation reaches Helm-shipped objects without a mutate-existing pass. Also defaults an ignore entry that excludes coordination.k8s.io Leases entirely, since their holders rewrite them by design. Both patches are add-if-absent, so a HelmRelease that states a mode or an ignore list keeps it, and one that states its own ignore list must carry the Lease entry itself.
spec:
  background: false
  webhookConfiguration:
    failurePolicy: Ignore
  rules:
    - name: helmrelease-drift-detection
      match:
        any:
          - resources:
              kinds:
                - helm.toolkit.fluxcd.io/v2/HelmRelease
              operations:
                - CREATE
                - UPDATE
      mutate:
        patchStrategicMerge:
          spec:
            driftDetection:
              +(mode): enabled
              +(ignore):
                - paths:
                    - ""
                  target:
                    group: coordination.k8s.io
                    kind: Lease
    - name: kustomization-self-heal
      match:
        any:
          - resources:
              kinds:
                - kustomize.toolkit.fluxcd.io/v1/Kustomization
              operations:
                - CREATE
                - UPDATE
      mutate:
        patchStrategicMerge:
          spec:
            force: false
            +(timeout): 10m
            +(retryInterval): 1m
    - name: helmrelease-remediation
      match:
        any:
          - resources:
              kinds:
                - helm.toolkit.fluxcd.io/v2/HelmRelease
              operations:
                - CREATE
                - UPDATE
      mutate:
        patchStrategicMerge:
          spec:
            install:
              +(strategy):
                name: RemediateOnFailure
              remediation:
                +(retries): 3
                +(remediateLastFailure): true
            upgrade:
              +(strategy):
                name: RemediateOnFailure
              remediation:
                +(retries): 3
                +(remediateLastFailure): true
                +(strategy): rollback
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: flux-force-opt-in
  labels:
    app.kubernetes.io/name: flux-force-opt-in
    app.kubernetes.io/part-of: kyverno
    app.kubernetes.io/component: policy
    entity: cluster
    capability: governance
  annotations:
    policies.kyverno.io/title: Flux force opt-in
    policies.kyverno.io/category: GitOps
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: All kinds
    policies.kyverno.io/description: >-
      Adds kustomize.toolkit.fluxcd.io/force=Enabled, if absent, to every object kustomize-controller applies, so an immutable-field or invalid apply is recreated. Stateful objects are left to stateful-labelling, which sets force=Disabled on them, and anything labelled stateful=true is skipped. Namespaces, CRDs, Kustomizations and HelmReleases are never forced because recreating one deletes everything inside it. projects#913.
spec:
  background: false
  webhookConfiguration:
    failurePolicy: Ignore
    matchConditions:
      - name: kustomize-controller
        expression: request.userInfo.username == "system:serviceaccount:flux-system:kustomize-controller"
  rules:
    - name: force-non-stateful
      match:
        any:
          - resources:
              kinds:
                - "*"
              operations:
                - CREATE
                - UPDATE
      exclude:
        any:
          - resources:
              kinds:
                - v1/Namespace
                - apiextensions.k8s.io/v1/CustomResourceDefinition
                - kustomize.toolkit.fluxcd.io/v1/Kustomization
                - helm.toolkit.fluxcd.io/v2/HelmRelease
      preconditions:
        all:
          - key: "{{ request.object.metadata.labels.stateful || '' }}"
            operator: NotEquals
            value: "true"
      mutate:
        patchStrategicMerge:
          metadata:
            annotations:
              +(kustomize.toolkit.fluxcd.io/force): Enabled
