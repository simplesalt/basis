---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: logs-pg
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: logs-pg
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: database
    entity: cluster
    env: main
    capability: observability
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:17

  minSyncReplicas: 0
  maxSyncReplicas: 0
  replicationSlots:
    highAvailability:
      enabled: true

  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: restart
  enablePDB: true

  storage:
    size: 20Gi
    resizeInUseVolumes: true

  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 6Gi

  postgresql:
    parameters:
      synchronous_commit: "off"
      enable_partitionwise_aggregate: "on"
      max_connections: "100"
      wal_compression: "zstd"
      max_wal_size: "2GB"
      checkpoint_timeout: "15min"

  bootstrap:
    initdb:
      database: logs
      owner: logs
      postInitApplicationSQL:
        - CREATE ROLE logs_read NOLOGIN
        - GRANT logs_read TO logs
        - ALTER ROLE logs_read SET statement_timeout = '30s'
---
apiVersion: batch/v1
kind: Job
metadata:
  name: logs-schema
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: logs-schema
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: database
    entity: cluster
    env: main
    capability: observability
  annotations:
    kustomize.toolkit.fluxcd.io/force: "enabled"
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logs-schema
        entity: cluster
        env: main
        capability: observability
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: ghcr.io/cloudnative-pg/postgresql:17
          command:
            - sh
            - -c
            - |
              until pg_isready -d "$DATABASE_URL"; do
                echo "waiting for logs-pg"
                sleep 3
              done
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: logs-pg-app
                  key: uri
      containers:
        - name: psql
          image: ghcr.io/cloudnative-pg/postgresql:17
          command:
            - psql
            - -v
            - ON_ERROR_STOP=1
            - -f
            - /sql/schema.sql
            - $(DATABASE_URL)
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: logs-pg-app
                  key: uri
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: sql
              mountPath: /sql
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: sql
          configMap:
            name: logs-schema
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logs-pg-rotate
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: logs-pg-rotate
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: database
    entity: cluster
    env: main
    capability: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: logs-pg-rotate-pvc-reader
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: logs-pg-rotate
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: database
    entity: cluster
    env: main
    capability: observability
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    resourceNames: ["logs-pg-1"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: logs-pg-rotate-pvc-reader
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: logs-pg-rotate
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: database
    entity: cluster
    env: main
    capability: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: logs-pg-rotate-pvc-reader
subjects:
  - kind: ServiceAccount
    name: logs-pg-rotate
    namespace: cluster-main-observability
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: logs-pg-rotate
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: logs-pg-rotate
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: database
    entity: cluster
    env: main
    capability: observability
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: logs-pg-rotate
            entity: cluster
            env: main
            capability: observability
        spec:
          restartPolicy: OnFailure
          serviceAccountName: logs-pg-rotate
          initContainers:
            - name: pvc-capacity
              image: ghcr.io/cloudnative-pg/postgresql:17
              command:
                - sh
                - -c
                - |
                  python3 - <<'PYEOF' >/tmp/pvc_bytes 2>/tmp/pvc_bytes.err || true
                  # Reads this Cluster's own PVC capacity via the in-cluster
                  # Kubernetes API, using the ServiceAccount token every pod
                  # has auto-mounted -- the same access pattern mcp-flux.yaml
                  # uses to reach the API from inside the cluster. python3 is
                  # present in this image because the bare `:17` tag used
                  # throughout this file resolves to the deprecated `system`
                  # build (see cloudnative-pg/postgres-containers), which
                  # installs python3-pip/python3-psycopg2 to support
                  # barman-cloud; the newer minimal/standard image types would
                  # not carry it, so switching imageName later would need
                  # revisiting this too.
                  import json, pathlib, ssl, urllib.request

                  NAMESPACE = "cluster-main-observability"
                  PVC_NAME = "logs-pg-1"

                  # Binary (Ki/Mi/Gi/...) suffixes only: that is what CNPG
                  # writes into storage.size and what status.capacity.storage
                  # echoes back, so decimal (K/M/G) suffixes are deliberately
                  # not handled.
                  UNITS = {
                      "Ki": 1024, "Mi": 1024 ** 2, "Gi": 1024 ** 3,
                      "Ti": 1024 ** 4, "Pi": 1024 ** 5, "Ei": 1024 ** 6,
                  }

                  def to_bytes(quantity):
                      for suffix, mult in UNITS.items():
                          if quantity.endswith(suffix):
                              return int(float(quantity[:-len(suffix)]) * mult)
                      return int(quantity)

                  token = pathlib.Path(
                      "/var/run/secrets/kubernetes.io/serviceaccount/token"
                  ).read_text().strip()
                  ctx = ssl.create_default_context(
                      cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
                  )
                  url = (
                      "https://kubernetes.default.svc/api/v1/namespaces/"
                      f"{NAMESPACE}/persistentvolumeclaims/{PVC_NAME}"
                  )
                  req = urllib.request.Request(
                      url, headers={"Authorization": f"Bearer {token}"}
                  )
                  with urllib.request.urlopen(req, context=ctx, timeout=10) as resp:
                      pvc = json.load(resp)
                  quantity = pvc["status"]["capacity"]["storage"]
                  print(to_bytes(quantity), end="")
                  PYEOF
                  if [ -s /tmp/pvc_bytes.err ]; then
                    echo "pvc-capacity: lookup failed, rotate() will skip the size cap this run:" >&2
                    cat /tmp/pvc_bytes.err >&2
                  fi
                  exit 0
              env:
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
          containers:
            - name: psql
              image: ghcr.io/cloudnative-pg/postgresql:17
              command:
                - sh
                - -c
                - |
                  PVC_BYTES=""
                  if [ -s /tmp/pvc_bytes ]; then
                    PVC_BYTES=$(cat /tmp/pvc_bytes)
                  fi
                  case "$PVC_BYTES" in
                    ''|*[!0-9]*) PVC_BYTES="" ;;
                  esac
                  if [ -n "$PVC_BYTES" ]; then
                    exec psql -v ON_ERROR_STOP=1 \
                      -c "SELECT * FROM logs_maint.rotate(pvc_bytes => $PVC_BYTES)" \
                      "$DATABASE_URL"
                  else
                    exec psql -v ON_ERROR_STOP=1 \
                      -c "SELECT * FROM logs_maint.rotate()" \
                      "$DATABASE_URL"
                  fi
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: logs-pg-app
                      key: uri
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
          volumes:
            - name: tmp
              emptyDir: {}
