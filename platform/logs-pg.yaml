---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: logs-pg
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: logs-pg
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: database
    entity: cluster
    env: main
    capability: observability
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-202609210816-standard-trixie

  minSyncReplicas: 0
  maxSyncReplicas: 0
  replicationSlots:
    highAvailability:
      enabled: true

  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: restart
  enablePDB: true

  storage:
    size: 20Gi
    resizeInUseVolumes: true

  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 6Gi

  monitoring:
    customQueriesConfigMap:
      - name: cnpg-default-monitoring
        key: queries
      - name: logs-pg-monitoring
        key: queries

  postgresql:
    parameters:
      synchronous_commit: "off"
      enable_partitionwise_aggregate: "on"
      max_connections: "100"
      wal_compression: "zstd"
      max_wal_size: "2GB"
      checkpoint_timeout: "15min"
      archive_timeout: "0"
      track_io_timing: "on"
      track_wal_io_timing: "on"

  bootstrap:
    initdb:
      database: logs
      owner: logs
      postInitApplicationSQL:
        - CREATE ROLE logs_read NOLOGIN
        - GRANT logs_read TO logs
        - ALTER ROLE logs_read SET statement_timeout = '30s'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logs-pg-monitoring
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: logs-pg
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: monitoring
    entity: cluster
    env: main
    capability: observability
    cnpg.io/reload: "true"
data:
  queries: |
    pg_stat_io:
      runonserver: ">=16.0.0"
      query: |
        SELECT backend_type
          , object
          , context
          , COALESCE(reads, 0) AS reads
          , COALESCE(writes, 0) AS writes
          , COALESCE(writebacks, 0) AS writebacks
          , COALESCE(extends, 0) AS extends
          , COALESCE(hits, 0) AS hits
          , COALESCE(evictions, 0) AS evictions
          , COALESCE(reuses, 0) AS reuses
          , COALESCE(fsyncs, 0) AS fsyncs
          , COALESCE(read_time, 0) AS read_time
          , COALESCE(write_time, 0) AS write_time
          , COALESCE(writeback_time, 0) AS writeback_time
          , COALESCE(extend_time, 0) AS extend_time
          , COALESCE(fsync_time, 0) AS fsync_time
        FROM pg_catalog.pg_stat_io
        WHERE COALESCE(reads, writes, writebacks, extends, hits, evictions, reuses, fsyncs) IS NOT NULL
      metrics:
        - backend_type:
            usage: "LABEL"
            description: "Type of backend (e.g. background worker, autovacuum worker)"
        - object:
            usage: "LABEL"
            description: "Target object of an I/O operation (relation or temp relation)"
        - context:
            usage: "LABEL"
            description: "Context of an I/O operation (normal, vacuum, bulkread or bulkwrite)"
        - reads:
            usage: "COUNTER"
            description: "Number of read operations"
        - writes:
            usage: "COUNTER"
            description: "Number of write operations"
        - writebacks:
            usage: "COUNTER"
            description: "Number of units of size block_size which the process requested the kernel write out to permanent storage"
        - extends:
            usage: "COUNTER"
            description: "Number of relation extend operations"
        - hits:
            usage: "COUNTER"
            description: "Number of times a desired block was found in a shared buffer"
        - evictions:
            usage: "COUNTER"
            description: "Number of times a block has been written out from a shared or local buffer in order to make it available for another use"
        - reuses:
            usage: "COUNTER"
            description: "Number of times an existing buffer in a size-limited ring buffer outside of shared buffers was reused as part of an I/O operation in the bulkread, bulkwrite, or vacuum contexts"
        - fsyncs:
            usage: "COUNTER"
            description: "Number of fsync calls"
        - read_time:
            usage: "COUNTER"
            description: "Time spent in read operations in milliseconds (zero unless track_io_timing is enabled)"
        - write_time:
            usage: "COUNTER"
            description: "Time spent in write operations in milliseconds (zero unless track_io_timing is enabled)"
        - writeback_time:
            usage: "COUNTER"
            description: "Time spent in writeback operations in milliseconds (zero unless track_io_timing is enabled)"
        - extend_time:
            usage: "COUNTER"
            description: "Time spent in extend operations in milliseconds (zero unless track_io_timing is enabled)"
        - fsync_time:
            usage: "COUNTER"
            description: "Time spent in fsync operations in milliseconds (zero unless track_io_timing is enabled)"

    pg_stat_user_tables:
      primary: true
      query: |
        SELECT schemaname
          , relname
          , n_tup_ins
          , n_tup_upd
          , n_tup_hot_upd
          , n_tup_del
          , n_dead_tup
          , n_live_tup
          , autovacuum_count
          , autoanalyze_count
          , vacuum_count
          , pg_catalog.pg_total_relation_size(relid) AS total_relation_size_bytes
        FROM (
          SELECT relid
            , schemaname
            , relname
            , n_tup_ins
            , n_tup_upd
            , n_tup_hot_upd
            , n_tup_del
            , n_dead_tup
            , n_live_tup
            , autovacuum_count
            , autoanalyze_count
            , vacuum_count
          FROM pg_catalog.pg_stat_user_tables
          ORDER BY (n_tup_ins OPERATOR(pg_catalog.+) n_tup_upd OPERATOR(pg_catalog.+) n_tup_del) DESC
            , schemaname
            , relname
          LIMIT 20
        ) AS top_tables
      metrics:
        - schemaname:
            usage: "LABEL"
            description: "Name of the schema that this table is in"
        - relname:
            usage: "LABEL"
            description: "Name of this table"
        - n_tup_ins:
            usage: "COUNTER"
            description: "Number of rows inserted"
        - n_tup_upd:
            usage: "COUNTER"
            description: "Number of rows updated (includes HOT updated rows)"
        - n_tup_hot_upd:
            usage: "COUNTER"
            description: "Number of rows HOT updated"
        - n_tup_del:
            usage: "COUNTER"
            description: "Number of rows deleted"
        - n_dead_tup:
            usage: "GAUGE"
            description: "Estimated number of dead rows"
        - n_live_tup:
            usage: "GAUGE"
            description: "Estimated number of live rows"
        - autovacuum_count:
            usage: "COUNTER"
            description: "Number of times this table has been vacuumed by the autovacuum daemon"
        - autoanalyze_count:
            usage: "COUNTER"
            description: "Number of times this table has been analyzed by the autovacuum daemon"
        - vacuum_count:
            usage: "COUNTER"
            description: "Number of times this table has been manually vacuumed (not counting VACUUM FULL)"
        - total_relation_size_bytes:
            usage: "GAUGE"
            description: "Total disk space used by the table, including TOAST data and indexes, in bytes"
      target_databases:
        - logs
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: logs-pg
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: logs-pg
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: monitoring
    entity: cluster
    env: main
    capability: observability
    release: prometheus
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: logs-pg
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
---
apiVersion: batch/v1
kind: Job
metadata:
  name: logs-schema
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: logs-schema
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: database
    entity: cluster
    env: main
    capability: observability
  annotations:
    kustomize.toolkit.fluxcd.io/force: "enabled"
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logs-schema
        entity: cluster
        env: main
        capability: observability
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: ghcr.io/cloudnative-pg/postgresql:17.11-202609210816-standard-trixie
          command:
            - sh
            - -c
            - |
              until pg_isready -d "$DATABASE_URL"; do
                echo "waiting for logs-pg"
                sleep 3
              done
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: logs-pg-app
                  key: uri
      containers:
        - name: psql
          image: ghcr.io/cloudnative-pg/postgresql:17.11-202609210816-standard-trixie
          command:
            - sh
            - -c
            - |
              # A logs-pg rolling restart can drop or refuse connections after
              # wait-for-db has already passed. psql exits 2 when it cannot
              # reach or loses the server, so retry only that, for about five
              # minutes, instead of spending the Job's backoffLimit. Exit 1
              # (psql error) and 3 (SQL error) fail at once. schema.sql is one
              # transaction and idempotent, so a full re-run is safe.
              attempt=1
              end=$(( $(date +%s) + 300 ))
              while :; do
                psql -v ON_ERROR_STOP=1 -f /sql/schema.sql "$DATABASE_URL"
                rc=$?
                [ "$rc" -eq 2 ] || exit "$rc"
                if [ "$(date +%s)" -ge "$end" ]; then
                  echo "psql: server still unreachable after $attempt attempts, giving up" >&2
                  exit 2
                fi
                echo "psql: attempt $attempt exited $rc, retrying in 5s" >&2
                attempt=$((attempt + 1))
                sleep 5
              done
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: logs-pg-app
                  key: uri
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: sql
              mountPath: /sql
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: sql
          configMap:
            name: logs-schema
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logs-pg-rotate
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: logs-pg-rotate
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: database
    entity: cluster
    env: main
    capability: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: logs-pg-rotate-pvc-reader
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: logs-pg-rotate
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: database
    entity: cluster
    env: main
    capability: observability
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    resourceNames: ["logs-pg-1"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: logs-pg-rotate-pvc-reader
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: logs-pg-rotate
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: database
    entity: cluster
    env: main
    capability: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: logs-pg-rotate-pvc-reader
subjects:
  - kind: ServiceAccount
    name: logs-pg-rotate
    namespace: cluster-main-observability
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: logs-pg-rotate
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: logs-pg-rotate
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: database
    entity: cluster
    env: main
    capability: observability
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: logs-pg-rotate
            entity: cluster
            env: main
            capability: observability
        spec:
          restartPolicy: OnFailure
          serviceAccountName: logs-pg-rotate
          initContainers:
            - name: pvc-capacity
              image: python:3.13-alpine
              command:
                - sh
                - -c
                - |
                  python3 - <<'PYEOF' >/tmp/pvc_bytes 2>/tmp/pvc_bytes.err || true
                  # Reads this Cluster's own PVC capacity via the in-cluster
                  # Kubernetes API, using the ServiceAccount token every pod
                  # has auto-mounted -- the same access pattern mcp-flux.yaml
                  # uses to reach the API from inside the cluster. This
                  # container uses python:3.13-alpine, the helper image
                  # alert-logger and cluster-health also use, because the
                  # pinned `standard` PostgreSQL image used by the rest of
                  # this file does not ship python3.
                  import json, pathlib, ssl, urllib.request

                  NAMESPACE = "cluster-main-observability"
                  PVC_NAME = "logs-pg-1"

                  # Binary (Ki/Mi/Gi/...) suffixes only: that is what CNPG
                  # writes into storage.size and what status.capacity.storage
                  # echoes back, so decimal (K/M/G) suffixes are deliberately
                  # not handled.
                  UNITS = {
                      "Ki": 1024, "Mi": 1024 ** 2, "Gi": 1024 ** 3,
                      "Ti": 1024 ** 4, "Pi": 1024 ** 5, "Ei": 1024 ** 6,
                  }

                  def to_bytes(quantity):
                      for suffix, mult in UNITS.items():
                          if quantity.endswith(suffix):
                              return int(float(quantity[:-len(suffix)]) * mult)
                      return int(quantity)

                  token = pathlib.Path(
                      "/var/run/secrets/kubernetes.io/serviceaccount/token"
                  ).read_text().strip()
                  ctx = ssl.create_default_context(
                      cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
                  )
                  url = (
                      "https://kubernetes.default.svc/api/v1/namespaces/"
                      f"{NAMESPACE}/persistentvolumeclaims/{PVC_NAME}"
                  )
                  req = urllib.request.Request(
                      url, headers={"Authorization": f"Bearer {token}"}
                  )
                  with urllib.request.urlopen(req, context=ctx, timeout=10) as resp:
                      pvc = json.load(resp)
                  quantity = pvc["status"]["capacity"]["storage"]
                  print(to_bytes(quantity), end="")
                  PYEOF
                  if [ -s /tmp/pvc_bytes.err ]; then
                    echo "pvc-capacity: lookup failed, rotate() will skip the size cap this run:" >&2
                    cat /tmp/pvc_bytes.err >&2
                  fi
                  exit 0
              env:
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
                runAsUser: 65532
                seccompProfile:
                  type: RuntimeDefault
          containers:
            - name: psql
              image: ghcr.io/cloudnative-pg/postgresql:17.11-202609210816-standard-trixie
              command:
                - sh
                - -c
                - |
                  PVC_BYTES=""
                  if [ -s /tmp/pvc_bytes ]; then
                    PVC_BYTES=$(cat /tmp/pvc_bytes)
                  fi
                  case "$PVC_BYTES" in
                    ''|*[!0-9]*) PVC_BYTES="" ;;
                  esac
                  if [ -n "$PVC_BYTES" ]; then
                    exec psql -v ON_ERROR_STOP=1 \
                      -c "SELECT * FROM logs_maint.rotate(pvc_bytes => $PVC_BYTES)" \
                      "$DATABASE_URL"
                  else
                    exec psql -v ON_ERROR_STOP=1 \
                      -c "SELECT * FROM logs_maint.rotate()" \
                      "$DATABASE_URL"
                  fi
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: logs-pg-app
                      key: uri
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
          volumes:
            - name: tmp
              emptyDir: {}
