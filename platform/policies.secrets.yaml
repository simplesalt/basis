---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: reject-last-applied-on-secrets
  labels:
    app.kubernetes.io/name: reject-last-applied-on-secrets
    app.kubernetes.io/part-of: kyverno
    app.kubernetes.io/component: policy
    entity: cluster
    capability: access
  annotations:
    policies.kyverno.io/title: Reject last-applied-configuration on Secrets
    policies.kyverno.io/category: Secret Management
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Secret
    policies.kyverno.io/description: >-
      Denies any Secret write whose resulting object carries the
      kubectl.kubernetes.io/last-applied-configuration annotation. Only
      client-side `kubectl apply` writes that annotation, and on a Secret it
      copies the payload out of `data` and into an annotation. `kubectl patch`,
      `kubectl apply --server-side`, and Flux's server-side apply all leave it
      unset, so the supported paths for populating a Flux-declared placeholder
      Secret are unaffected.
spec:
  background: false
  webhookConfiguration:
    failurePolicy: Ignore
  rules:
    - name: no-last-applied-configuration
      match:
        any:
          - resources:
              kinds:
                - Secret
              operations:
                - CREATE
                - UPDATE
      validate:
        failureAction: Enforce
        message: >-
          This Secret carries kubectl.kubernetes.io/last-applied-configuration,
          which copies the Secret payload into an annotation. Only client-side
          `kubectl apply` writes it. Populate Flux-declared placeholder Secrets
          with `kubectl patch secret <name> -p '{"stringData":{...}}'` or
          `kubectl apply --server-side`, neither of which sets it.
        deny:
          conditions:
            all:
              - key: '{{ request.object.metadata.annotations."kubectl.kubernetes.io/last-applied-configuration" || `""` }}'
                operator: NotEquals
                value: ""
