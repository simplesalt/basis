---
# Closes the one hole RBAC cannot close in the human-operator guardrail
# (human-operator.yaml).
#
# That identity is granted `patch` and denied `create`/`update`/`delete`, so the
# only way it can touch a Secret is by patching one Flux already declared. But
# CLIENT-SIDE `kubectl apply -f` against an object that already exists is also a
# PATCH -- kubectl computes a three-way merge and sends it -- so RBAC permits it
# and cannot tell it apart from `kubectl patch`. Client-side apply additionally
# writes the entire applied manifest into the
# kubectl.kubernetes.io/last-applied-configuration annotation. Do that to a
# Secret and the payload you just supplied is copied verbatim into an
# annotation, where it is readable by anything holding plain `get` on the object
# and is NOT covered by any of the protections that apply to `data` (no
# encryption-at-rest key separation, no `data` masking in tooling, and it shows
# up in `kubectl describe` and in any manifest dump). That is precisely the
# exposure the patch-only Secret discipline exists to prevent.
#
# Admission can see what RBAC cannot: the resulting object either carries the
# annotation or it does not. `kubectl patch` and `kubectl apply --server-side`
# never write it (server-side apply tracks ownership in managedFields instead),
# and neither does Flux's own SSA, so nothing legitimate in this cluster trips
# this rule. Helm does not write it either -- Helm release state lives in its
# own `helm.sh/release.v1` Secrets, written through the Helm SDK.
#
# No deadlock: the rule looks at the resulting object, so a Secret that somehow
# already carries the annotation can still be repaired by patching the
# annotation away (the result has no annotation, so the request is allowed).
#
# failurePolicy is deliberately Ignore. This is defense in depth for a
# discipline that is already enforced socially and (partly) by RBAC -- it is not
# worth making Kyverno a hard availability dependency for every Secret write in
# the cluster. With the default Fail, a Kyverno outage would block ServiceAccount
# token Secrets, Helm release Secrets, and cert-manager certificate Secrets
# cluster-wide. Ignore trades a gap during an outage for not turning an admission
# controller into a single point of failure on the Secret write path.
#
# failureAction is set per-rule (validate.failureAction) rather than at
# spec.validationFailureAction, which Kyverno deprecated in 1.13. The Kyverno
# chart in operators/controllers.yaml is unpinned, so this tracks current.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: reject-last-applied-on-secrets
  labels:
    app.kubernetes.io/name: reject-last-applied-on-secrets
    app.kubernetes.io/part-of: kyverno
    app.kubernetes.io/component: policy
    entity: cluster
    capability: access
  annotations:
    policies.kyverno.io/title: Reject last-applied-configuration on Secrets
    policies.kyverno.io/category: Secret Management
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Secret
    policies.kyverno.io/description: >-
      Denies any Secret write whose resulting object carries the
      kubectl.kubernetes.io/last-applied-configuration annotation. Only
      client-side `kubectl apply` writes that annotation, and on a Secret it
      copies the payload out of `data` and into an annotation. `kubectl patch`,
      `kubectl apply --server-side`, and Flux's server-side apply all leave it
      unset, so the supported paths for populating a Flux-declared placeholder
      Secret are unaffected.
spec:
  background: false
  webhookConfiguration:
    failurePolicy: Ignore
  rules:
    - name: no-last-applied-configuration
      match:
        any:
          - resources:
              kinds:
                - Secret
              operations:
                - CREATE
                - UPDATE
      validate:
        failureAction: Enforce
        message: >-
          This Secret carries kubectl.kubernetes.io/last-applied-configuration,
          which copies the Secret payload into an annotation. Only client-side
          `kubectl apply` writes it. Populate Flux-declared placeholder Secrets
          with `kubectl patch secret <name> -p '{"stringData":{...}}'` or
          `kubectl apply --server-side`, neither of which sets it.
        deny:
          conditions:
            all:
              - key: '{{ request.object.metadata.annotations."kubectl.kubernetes.io/last-applied-configuration" || `""` }}'
                operator: NotEquals
                value: ""
