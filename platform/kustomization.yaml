apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cf-providers.yaml
  - cf-runtime.yaml
  - fluent-bit.yaml
  - gcp-providers.yaml
  - gcp-runtime.yaml
  - human-operator.yaml
  - logs-api.yaml
  - logs-parity.yaml
  - logs-pg.yaml
  - mcp-flux.yaml
  - policies.cleanup.yaml
  - policies.resiliency.yaml
  - policies.secrets.yaml
  - policies.storage.yaml

# A generator rather than a checked-in ConfigMap manifest, for the name hash:
# kustomize suffixes the ConfigMap name with a hash of its contents and rewrites
# the logs-mcp Deployment's volume reference to match, so regenerating the spec
# rolls the pod. agentgateway reads its schema once at startup, so a stable name
# would leave a new spec sitting unread in the mounted file until something
# unrelated restarted the pod -- exactly the silent staleness the generated spec
# exists to avoid. Flux prunes the superseded hashed ConfigMaps.
configMapGenerator:
  # Every statement in logs-schema.sql is idempotent (IF NOT EXISTS / OR
  # REPLACE) because the Job that applies it re-runs on every change to that
  # file. This generator is what makes "on every change" true: a checked-in
  # ConfigMap manifest keeps a stable name, so editing the SQL left the Job's
  # spec byte-identical and Flux had no reason to recreate it -- the new
  # statements sat in the mounted file, applied to nothing. The hash moves the
  # name, which moves the volume reference inside the Job's immutable
  # spec.template, which its kustomize.toolkit.fluxcd.io/force annotation
  # resolves by delete-and-recreate.
  - name: logs-schema
    namespace: cluster-main-observability
    files:
      - schema.sql=logs-schema.sql
    options:
      labels:
        app.kubernetes.io/name: logs-schema
        app.kubernetes.io/part-of: observability
        app.kubernetes.io/component: database
        entity: cluster
        env: main
        capability: observability
  - name: logs-mcp-openapi
    namespace: cluster-main-observability
    files:
      - openapi.json=logs-openapi.generated.json
    options:
      labels:
        app.kubernetes.io/name: logs-mcp
        app.kubernetes.io/part-of: observability
        app.kubernetes.io/component: mcp-server
        entity: cluster
        env: main
        capability: observability
