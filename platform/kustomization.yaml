apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cf-providers.yaml
  - cf-runtime.yaml
  - fluent-bit.yaml
  - gcp-providers.yaml
  - gcp-runtime.yaml
  - human-operator.yaml
  - logs-api.yaml
  - logs-parity.yaml
  - logs-pg.yaml
  - mcp-flux.yaml
  - policies.batch.yaml
  - policies.cleanup.yaml
  - policies.flux.yaml
  - policies.resiliency.yaml
  - policies.secrets.yaml
  - policies.storage.yaml

configMapGenerator:
  - name: logs-schema
    namespace: cluster-main-observability
    files:
      - schema.sql=logs-schema.sql
    options:
      labels:
        app.kubernetes.io/name: logs-schema
        app.kubernetes.io/part-of: observability
        app.kubernetes.io/component: database
        entity: cluster
        env: main
        capability: observability
  - name: logs-mcp-openapi
    namespace: cluster-main-observability
    files:
      - openapi.json=logs-openapi.generated.json
    options:
      labels:
        app.kubernetes.io/name: logs-mcp
        app.kubernetes.io/part-of: observability
        app.kubernetes.io/component: mcp-server
        entity: cluster
        env: main
        capability: observability
