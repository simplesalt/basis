apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cluster-health.yaml
  - fluent-bit.yaml
  - human-operator.yaml
  - kured-gate.yaml
  - node-image-switch-k-e7488b70.yaml
  - logs-api.yaml
  - logs-parity.yaml
  - logs-pg.yaml
  - mcp-flux.yaml
  - node-class.yaml
  - policies.batch.yaml
  - policies.cleanup.yaml
  - policies.flux.yaml
  - policies.resiliency.yaml
  - policies.scheduling.yaml
  - policies.secrets.yaml
  - policies.storage.yaml

configMapGenerator:
  - name: logs-schema
    namespace: cluster-main-observability
    files:
      - schema.sql=logs-schema.sql
    options:
      labels:
        app.kubernetes.io/name: logs-schema
        app.kubernetes.io/part-of: observability
        app.kubernetes.io/component: database
        entity: cluster
        env: main
        capability: observability
  - name: logs-mcp-openapi
    namespace: cluster-main-observability
    files:
      - openapi.json=logs-openapi.generated.json
    options:
      labels:
        app.kubernetes.io/name: logs-mcp
        app.kubernetes.io/part-of: observability
        app.kubernetes.io/component: mcp-server
        entity: cluster
        env: main
        capability: observability
  - name: logs-mcp
    namespace: cluster-main-observability
    files:
      - config.yaml=logs-mcp-config.yaml
    options:
      labels:
        app.kubernetes.io/name: logs-mcp
        app.kubernetes.io/part-of: observability
        app.kubernetes.io/component: mcp-server
        entity: cluster
        env: main
        capability: observability
  - name: cluster-health-script
    namespace: cluster-main-observability
    files:
      - server.py=cluster-health/server.py
      - client.py=cluster-health/client.py
      - finalizers.py=cluster-health/finalizers.py
      - flux.py=cluster-health/flux.py
      - crossplane.py=cluster-health/crossplane.py
      - prometheus.py=cluster-health/prometheus.py
      - alerts.py=cluster-health/alerts.py
      - nodes.py=cluster-health/nodes.py
      - stale.py=cluster-health/stale.py
      - controller-map.json=cluster-health/controller-map.json
    options:
      labels:
        app.kubernetes.io/name: cluster-health
        app.kubernetes.io/part-of: observability
        app.kubernetes.io/component: health-check
        entity: cluster
        env: main
        capability: observability
