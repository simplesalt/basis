---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alert-logger
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: alert-logger
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: alert-sink
    entity: cluster
    env: main
    capability: observability
# The logger only receives webhooks and prints; it never calls the API.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-logger
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: alert-logger
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: alert-sink
    entity: cluster
    env: main
    capability: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-logger
  template:
    metadata:
      labels:
        app: alert-logger
        app.kubernetes.io/name: alert-logger
        app.kubernetes.io/part-of: observability
        app.kubernetes.io/component: alert-sink
        entity: cluster
        env: main
        capability: observability
    spec:
      serviceAccountName: alert-logger
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: python:3.13-alpine
          command: ["python3", "/scripts/server.py"]
          env:
            - name: PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: script
          configMap:
            name: alert-logger-script
---
apiVersion: v1
kind: Service
metadata:
  name: alert-logger
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: alert-logger
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: alert-sink
    entity: cluster
    env: main
    capability: observability
spec:
  type: ClusterIP
  selector:
    app: alert-logger
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alert-logger-allow-alertmanager
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: alert-logger
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: alert-sink
    entity: cluster
    env: main
    capability: observability
spec:
  podSelector:
    matchLabels:
      app: alert-logger
  policyTypes:
    - Ingress
  ingress:
    # Only the Alertmanager pods the kube-prometheus-stack release runs
    # (prometheus-operator stamps both labels on them).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
              alertmanager: prometheus-kube-prometheus-alertmanager
      ports:
        - protocol: TCP
          port: 8080
