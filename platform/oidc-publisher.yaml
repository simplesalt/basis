---
apiVersion: v1
kind: Namespace
metadata:
  name: cluster-main-identity
  labels:
    name: cluster-main-identity
    entity: cluster
    env: main
    capability: identity
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oidc-publisher
  namespace: cluster-main-identity
  labels:
    app.kubernetes.io/name: oidc-publisher
    app.kubernetes.io/part-of: identity
    app.kubernetes.io/component: key-publisher
    entity: cluster
    env: main
    capability: identity
# Needs a token only to read the two discovery documents, which the built-in
# system:service-account-issuer-discovery binding grants to every service
# account. No other role is bound to it.
automountServiceAccountToken: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oidc-publisher
  namespace: cluster-main-identity
  labels:
    app.kubernetes.io/name: oidc-publisher
    app.kubernetes.io/part-of: identity
    app.kubernetes.io/component: key-publisher
    entity: cluster
    env: main
    capability: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oidc-publisher
  template:
    metadata:
      labels:
        app: oidc-publisher
        app.kubernetes.io/name: oidc-publisher
        app.kubernetes.io/part-of: identity
        app.kubernetes.io/component: key-publisher
        entity: cluster
        env: main
        capability: identity
    spec:
      serviceAccountName: oidc-publisher
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: python:3.13-alpine
          command: ["python3", "/scripts/server.py"]
          env:
            - name: PORT
              value: "8080"
            - name: PUBLIC_JWKS_URI
              value: https://oidc.simplesalt.company/openid/v1/jwks
            - name: CACHE_SECONDS
              value: "60"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: script
          configMap:
            name: oidc-publisher-script
---
apiVersion: v1
kind: Service
metadata:
  name: oidc-publisher
  namespace: cluster-main-identity
  labels:
    app.kubernetes.io/name: oidc-publisher
    app.kubernetes.io/part-of: identity
    app.kubernetes.io/component: key-publisher
    entity: cluster
    env: main
    capability: identity
spec:
  type: ClusterIP
  selector:
    app: oidc-publisher
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oidc-publisher-ingress
  namespace: cluster-main-identity
  labels:
    app.kubernetes.io/name: oidc-publisher
    app.kubernetes.io/part-of: identity
    app.kubernetes.io/component: key-publisher
    entity: cluster
    env: main
    capability: identity
spec:
  podSelector:
    matchLabels:
      app: oidc-publisher
  policyTypes:
    - Ingress
  ingress:
    # The tunnel connector that serves oidc.simplesalt.company, and the build
    # agents that check the publisher in-cluster. The documents are public.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cluster-named-routing
          podSelector:
            matchLabels:
              pod: cloudflared
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ssint-main-coding
      ports:
        - protocol: TCP
          port: 8080
