---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: stateful-labelling
  labels:
    app.kubernetes.io/name: stateful-labelling
    app.kubernetes.io/part-of: kyverno
    app.kubernetes.io/component: policy
    entity: cluster
    capability: governance
  annotations:
    policies.kyverno.io/title: Label stateful objects
    policies.kyverno.io/category: Resiliency
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Cluster, PersistentVolumeClaim, Secret
    policies.kyverno.io/description: >-
      Sets the label stateful=true, overriding any value from Git, and the annotation
      kustomize.toolkit.fluxcd.io/force=Disabled at admission to CNPG
      Clusters, PVCs and Secrets other than Helm release storage. A PVC annotated
      storage-tier ephemeral is set to stateful=false instead. Kyverno is the
      only source of the stateful label. projects#913.
spec:
  background: false
  webhookConfiguration:
    failurePolicy: Ignore
  rules:
    - name: label-cnpg-clusters
      match:
        any:
          - resources:
              kinds:
                - postgresql.cnpg.io/v1/Cluster
              operations:
                - CREATE
                - UPDATE
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              stateful: "true"
            annotations:
              kustomize.toolkit.fluxcd.io/force: Disabled
    - name: label-pvcs
      match:
        any:
          - resources:
              kinds:
                - v1/PersistentVolumeClaim
              operations:
                - CREATE
                - UPDATE
      preconditions:
        all:
          - key: '{{ request.object.metadata.annotations."resiliency.simplesalt.company/storage-tier" || '''' }}'
            operator: NotEquals
            value: ephemeral
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              stateful: "true"
            annotations:
              kustomize.toolkit.fluxcd.io/force: Disabled
    - name: label-ephemeral-pvcs
      match:
        any:
          - resources:
              kinds:
                - v1/PersistentVolumeClaim
              operations:
                - CREATE
                - UPDATE
      preconditions:
        all:
          - key: '{{ request.object.metadata.annotations."resiliency.simplesalt.company/storage-tier" || '''' }}'
            operator: Equals
            value: ephemeral
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              stateful: "false"
    - name: label-secrets
      match:
        any:
          - resources:
              kinds:
                - v1/Secret
              operations:
                - CREATE
                - UPDATE
      preconditions:
        all:
          - key: "{{ request.object.type || '' }}"
            operator: NotEquals
            value: helm.sh/release.v1
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              stateful: "true"
            annotations:
              kustomize.toolkit.fluxcd.io/force: Disabled
