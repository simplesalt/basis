---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: storage-tier
  labels:
    app.kubernetes.io/name: storage-tier
    app.kubernetes.io/part-of: kyverno
    app.kubernetes.io/component: policy
    entity: cluster
    capability: storage
  annotations:
    policies.kyverno.io/title: Implement storage-tier
    policies.kyverno.io/category: Resiliency
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod, PersistentVolumeClaim
    policies.kyverno.io/description: >-
      Implements the resiliency.simplesalt.company/storage-tier declaration.
      `ephemeral` replaces every PVC volume on the pod with a memory-backed
      emptyDir so nothing is written to disk. `blips-are-ok` (the default) pins
      PVCs to the node-local StorageClass. `replicated` is denied, because this
      cluster provides no storage that survives losing the node.
spec:
  background: true
  webhookConfiguration:
    failurePolicy: Ignore
  rules:
    - name: reject-unknown-storage-tier
      match:
        any:
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
                - UPDATE
      preconditions:
        all:
          - key: '{{ request.object.metadata.annotations."resiliency.simplesalt.company/storage-tier" || '''' }}'
            operator: NotEquals
            value: ""
      validate:
        failureAction: Enforce
        message: >-
          resiliency.simplesalt.company/storage-tier must be one of ephemeral,
          blips-are-ok, or replicated. Omit it entirely to get blips-are-ok,
          which is the default tier for this cluster.
        deny:
          conditions:
            all:
              - key: '{{ request.object.metadata.annotations."resiliency.simplesalt.company/storage-tier" }}'
                operator: AnyNotIn
                value:
                  - ephemeral
                  - blips-are-ok
                  - replicated

    - name: reject-replicated-pods
      match:
        any:
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
                - UPDATE
      validate:
        failureAction: Enforce
        message: >-
          This pod declares storage-tier replicated, but this cluster has no
          replicated filesystem. Every StorageClass here is node-local, so a
          volume does not survive losing the node that holds it. Either move the
          durability requirement into the application layer (as the CNPG
          clusters do) and declare blips-are-ok, or do not schedule this
          workload here.
        deny:
          conditions:
            all:
              - key: '{{ request.object.metadata.annotations."resiliency.simplesalt.company/storage-tier" || '''' }}'
                operator: Equals
                value: replicated

    - name: ephemeral-volumes-to-memory
      match:
        any:
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
      preconditions:
        all:
          - key: '{{ request.object.metadata.annotations."resiliency.simplesalt.company/storage-tier" || '''' }}'
            operator: Equals
            value: ephemeral
      mutate:
        foreach:
          - list: request.object.spec.volumes[?persistentVolumeClaim]
            patchStrategicMerge:
              spec:
                volumes:
                  - name: '{{ element.name }}'
                    emptyDir:
                      medium: Memory
                      sizeLimit: '{{ request.object.metadata.annotations."resiliency.simplesalt.company/ephemeral-size" || ''100Mi'' }}'
                    persistentVolumeClaim: null

    - name: pin-node-local-storage-class
      match:
        any:
          - resources:
              kinds:
                - PersistentVolumeClaim
              operations:
                - CREATE
      preconditions:
        all:
          - key: '{{ request.object.spec.storageClassName || '''' }}'
            operator: Equals
            value: ""
      mutate:
        patchStrategicMerge:
          spec:
            storageClassName: local-path
