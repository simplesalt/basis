apiVersion: batch/v1
kind: Job
metadata:
  name: node-image-check-k-e7488b70
  namespace: kured
  labels:
    app.kubernetes.io/name: node-image-check
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: node-lifecycle
    entity: cluster
    capability: lifecycle
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-image-check
        app.kubernetes.io/part-of: basis
        app.kubernetes.io/component: node-lifecycle
    spec:
      restartPolicy: Never
      hostPID: true
      nodeSelector:
        kubernetes.io/hostname: k-e7488b70
      tolerations:
        - operator: Exists
      containers:
        - name: node-image-check
          image: ghcr.io/simplesalt/oci/cluster:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - nsenter
            - --target=1
            - --mount
            - --uts
            - --ipc
            - --net
            - --pid
            - --
            - bash
            - -c
            - |
              set -euo pipefail
              bootc status
              grep -h container-image-reference /ostree/deploy/*/deploy/*.origin || true
              if [ -e /var/run/reboot-required ]; then echo "reboot flag present"; else echo "no reboot flag"; fi
