---
apiVersion: fluentbit.fluent.io/v1alpha2
kind: FluentBit
metadata:
  name: fluent-bit
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: logging
    entity: cluster
    env: main
    capability: observability
spec:
  annotations:
    restart-epoch: "2026-09-01-390b"
  image: ghcr.io/fluent/fluent-operator/fluent-bit:5.1.0
  fluentBitConfigName: fluent-bit-config
  namespaceFluentBitCfgSelector: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  tolerations:
    - effect: NoSchedule
      operator: Exists
  livenessProbe:
    httpGet:
      path: /
      port: 2020
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 15
    failureThreshold: 8
  volumesMounts:
    - name: etcmachineid
      mountPath: /etc/machine-id
      readOnly: true
    - name: runsystemd
      mountPath: /run/systemd
      readOnly: true
    - name: flbstate
      mountPath: /var/lib/fluent-bit
  volumes:
    - name: etcmachineid
      hostPath:
        path: /etc/machine-id
        type: File
    - name: runsystemd
      hostPath:
        path: /run/systemd
    - name: flbstate
      hostPath:
        path: /var/lib/fluent-bit
        type: DirectoryOrCreate
  envVars:
    - name: LOGS_PG_HOST
      valueFrom:
        secretKeyRef:
          name: logs-pg-app
          key: host
    - name: LOGS_PG_USER
      valueFrom:
        secretKeyRef:
          name: logs-pg-app
          key: username
    - name: LOGS_PG_PASSWORD
      valueFrom:
        secretKeyRef:
          name: logs-pg-app
          key: password
    - name: LOGS_PG_DATABASE
      valueFrom:
        secretKeyRef:
          name: logs-pg-app
          key: dbname
---
apiVersion: fluentbit.fluent.io/v1alpha2
kind: ClusterFluentBitConfig
metadata:
  name: fluent-bit-config
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: logging
    entity: cluster
    env: main
    capability: observability
spec:
  service:
    daemon: false
    flushSeconds: 1
    logLevel: info
    parsersFile: /fluent-bit/etc/parsers.conf
    httpServer: true
    httpListen: 0.0.0.0
    httpPort: 2020
    healthCheck: true
    storage:
      path: /var/lib/fluent-bit/storage/
      sync: normal
      checksum: "off"
      backlogMemLimit: 64M
  inputSelector:
    matchLabels:
      fluentbit.fluent.io/enabled: "true"
  filterSelector:
    matchLabels:
      fluentbit.fluent.io/enabled: "true"
  outputSelector:
    matchLabels:
      fluentbit.fluent.io/enabled: "true"
  parserSelector:
    matchLabels:
      fluentbit.fluent.io/enabled: "true"
  multilineParserSelector:
    matchLabels:
      fluentbit.fluent.io/enabled: "true"
---
apiVersion: fluentbit.fluent.io/v1alpha2
kind: ClusterInput
metadata:
  name: systemd
  labels:
    fluentbit.fluent.io/enabled: "true"
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: logging
    entity: cluster
    env: main
    capability: observability
spec:
  systemd:
    tag: host.*
    readFromTail: "on"
    stripUnderscores: "on"
---
apiVersion: fluentbit.fluent.io/v1alpha2
kind: ClusterInput
metadata:
  name: tail
  labels:
    fluentbit.fluent.io/enabled: "true"
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: logging
    entity: cluster
    env: main
    capability: observability
spec:
  tail:
    tag: kube.*
    path: /var/log/containers/*.log
    excludePath: /var/log/containers/fluent-bit-*_cluster-main-observability_*.log,/var/log/containers/logs-pg-[0-9]*_cluster-main-observability_*.log,/var/log/containers/logs-postgrest-*_cluster-main-observability_*.log,/var/log/containers/logs-mcp-*_cluster-main-observability_*.log
    multilineParser: cri
    skipLongLines: true
    refreshIntervalSeconds: 10
    memBufLimit: 32M
    db: /var/lib/fluent-bit/tail-containers.db
    storageType: filesystem
---
apiVersion: fluentbit.fluent.io/v1alpha2
kind: ClusterFilter
metadata:
  name: kubernetes
  labels:
    fluentbit.fluent.io/enabled: "true"
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: logging
    entity: cluster
    env: main
    capability: observability
spec:
  match: kube.*
  filters:
    - kubernetes:
        kubeTagPrefix: kube.var.log.containers.
        mergeLog: true
        keepLog: true
        k8sLoggingParser: true
        k8sLoggingExclude: true
        labels: true
        annotations: false
---
apiVersion: fluentbit.fluent.io/v1alpha2
kind: ClusterFilter
metadata:
  name: grep-errors
  labels:
    fluentbit.fluent.io/enabled: "true"
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: logging
    entity: cluster
    env: main
    capability: observability
spec:
  match: kube.*
  ordinal: 10
  filters:
    - customPlugin:
        config: |
          Name grep
          Regex log (?i)(error|fail|fatal|panic|exception|traceback|refused|denied|timeout|\boom\b)
          Regex level (?i)^(error|fatal|warn|warning)$
          Logical_Op Or
    - grep:
        exclude: "log http: TLS handshake error"
---
apiVersion: fluentbit.fluent.io/v1alpha2
kind: ClusterFilter
metadata:
  name: host-allowlist
  labels:
    fluentbit.fluent.io/enabled: "true"
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: logging
    entity: cluster
    env: main
    capability: observability
spec:
  match: host.*
  filters:
    - grep:
        regex: SYSTEMD_UNIT ^(bootc-update|k3s|kcluster-node-network|kcluster-provision|greenboot)
    - modify:
        rules:
          - rename:
              MESSAGE: log
    - grep:
        exclude: 'log "level":"info".*"caller":"(traceutil|mvcc|rafthttp)'
    - grep:
        exclude: 'log ^I[0-9]{4} .*(job_controller|reconciler_common|operation_generator|kubelet_volumes|pod_container_deletor|pod_startup_latency_tracker|cpu_manager|memory_manager)\.go:'
    - grep:
        exclude: 'log msg="Writing manifest: /var/lib/rancher'
---
apiVersion: fluentbit.fluent.io/v1alpha2
kind: ClusterOutput
metadata:
  name: host-stdout
  labels:
    fluentbit.fluent.io/enabled: "true"
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: logging
    entity: cluster
    env: main
    capability: observability
spec:
  match: host.*
  stdout:
    format: json_lines
---
apiVersion: fluentbit.fluent.io/v1alpha2
kind: ClusterOutput
metadata:
  name: logs-pg
  labels:
    fluentbit.fluent.io/enabled: "true"
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: logging
    entity: cluster
    env: main
    capability: observability
spec:
  matchRegex: ^(kube|host)\..*$
  retry_limit: no_limits
  customPlugin:
    config: |
      Name pgsql
      Host ${LOGS_PG_HOST}
      Port 5432
      User ${LOGS_PG_USER}
      Password ${LOGS_PG_PASSWORD}
      Database ${LOGS_PG_DATABASE}
      Table logs
      storage.total_limit_size 5G
