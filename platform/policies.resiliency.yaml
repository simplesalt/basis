---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: cnpg-resiliency
  labels:
    app.kubernetes.io/name: cnpg-resiliency
    app.kubernetes.io/part-of: kyverno
    app.kubernetes.io/component: policy
    entity: cluster
    capability: storage
  annotations:
    policies.kyverno.io/title: CNPG resiliency governance
    policies.kyverno.io/category: Resiliency
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Cluster
    policies.kyverno.io/description: >-
      Governs resiliency configuration on CloudNativePG Clusters. Defaults
      spec.inheritedMetadata so every generated pod and PVC declares
      storage-tier blips-are-ok, and validates the optional backup-tier
      annotation, refusing an unbacked claim of cloud backup. Also mutates
      every Cluster to instances: 2 with required, node-scoped pod
      anti-affinity, and denies a subsequent write that reverts either.
      Exempt a genuinely single-instance Cluster with the label or annotation
      resiliency.simplesalt.company/ha: exempt.
spec:
  background: false
  webhookConfiguration:
    failurePolicy: Ignore
  rules:
    - name: default-storage-tier
      match:
        any:
          - resources:
              kinds:
                - postgresql.cnpg.io/v1/Cluster
              operations:
                - CREATE
                - UPDATE
      mutate:
        patchStrategicMerge:
          spec:
            inheritedMetadata:
              annotations:
                +(resiliency.simplesalt.company/storage-tier): blips-are-ok

    - name: reject-replicated-storage-tier
      match:
        any:
          - resources:
              kinds:
                - postgresql.cnpg.io/v1/Cluster
              operations:
                - CREATE
                - UPDATE
      validate:
        failureAction: Enforce
        message: >-
          This Cluster asks for storage-tier replicated, but this cluster has no
          replicated filesystem -- every StorageClass here is node-local.
          Postgres provides its own durability through replication, so a CNPG
          Cluster should declare blips-are-ok and carry the resiliency in the
          application layer.
        deny:
          conditions:
            all:
              - key: '{{ request.object.spec.inheritedMetadata.annotations."resiliency.simplesalt.company/storage-tier" || '''' }}'
                operator: Equals
                value: replicated

    - name: reject-unknown-backup-tier
      match:
        any:
          - resources:
              kinds:
                - postgresql.cnpg.io/v1/Cluster
              operations:
                - CREATE
                - UPDATE
      preconditions:
        all:
          - key: '{{ request.object.metadata.annotations."resiliency.simplesalt.company/backup-tier" || '''' }}'
            operator: NotEquals
            value: ""
      validate:
        failureAction: Enforce
        message: >-
          resiliency.simplesalt.company/backup-tier must be one of none, local,
          or cloud. The annotation is optional -- omit it rather than guessing.
        deny:
          conditions:
            all:
              - key: '{{ request.object.metadata.annotations."resiliency.simplesalt.company/backup-tier" }}'
                operator: AnyNotIn
                value:
                  - none
                  - local
                  - cloud

    - name: cloud-backup-tier-needs-a-target
      match:
        any:
          - resources:
              kinds:
                - postgresql.cnpg.io/v1/Cluster
              operations:
                - CREATE
                - UPDATE
      preconditions:
        all:
          - key: '{{ request.object.metadata.annotations."resiliency.simplesalt.company/backup-tier" || '''' }}'
            operator: Equals
            value: cloud
      validate:
        failureAction: Enforce
        message: >-
          This Cluster claims backup-tier cloud but configures no backup target.
          An annotation asserting off-site backup with nothing behind it is
          worse than no annotation, because it will be believed. Configure
          spec.backup, or state the tier this database actually has.
        deny:
          conditions:
            all:
              - key: '{{ request.object.spec.backup || '''' }}'
                operator: Equals
                value: ""

    - name: default-ha-instances
      match:
        any:
          - resources:
              kinds:
                - postgresql.cnpg.io/v1/Cluster
              operations:
                - CREATE
                - UPDATE
      preconditions:
        all:
          - key: '{{ request.object.metadata.labels."resiliency.simplesalt.company/ha" || request.object.metadata.annotations."resiliency.simplesalt.company/ha" || '''' }}'
            operator: NotEquals
            value: exempt
          - key: '{{ request.object.spec.instances || `0` }}'
            operator: LessThan
            value: 2
      mutate:
        patchStrategicMerge:
          spec:
            instances: 2

    - name: required-pod-anti-affinity
      match:
        any:
          - resources:
              kinds:
                - postgresql.cnpg.io/v1/Cluster
              operations:
                - CREATE
                - UPDATE
      preconditions:
        all:
          - key: '{{ request.object.metadata.labels."resiliency.simplesalt.company/ha" || request.object.metadata.annotations."resiliency.simplesalt.company/ha" || '''' }}'
            operator: NotEquals
            value: exempt
      mutate:
        patchStrategicMerge:
          spec:
            affinity:
              enablePodAntiAffinity: true
              podAntiAffinityType: required
              topologyKey: kubernetes.io/hostname

    - name: reject-ha-revert
      match:
        any:
          - resources:
              kinds:
                - postgresql.cnpg.io/v1/Cluster
              operations:
                - CREATE
                - UPDATE
      preconditions:
        all:
          - key: '{{ request.object.metadata.labels."resiliency.simplesalt.company/ha" || request.object.metadata.annotations."resiliency.simplesalt.company/ha" || '''' }}'
            operator: NotEquals
            value: exempt
      validate:
        failureAction: Enforce
        message: >-
          This Cluster resolves to pod anti-affinity that is not required and
          node-scoped. required-pod-anti-affinity sets this automatically and
          unconditionally, so the only way to reach this state is a request
          that also defeats the mutation -- which this rule exists to refuse.
          Add resiliency.simplesalt.company/ha: exempt if this Cluster
          genuinely does not need a standby.
        deny:
          conditions:
            any:
              - key: '{{ request.object.spec.affinity.enablePodAntiAffinity || `false` }}'
                operator: NotEquals
                value: true
              - key: '{{ request.object.spec.affinity.podAntiAffinityType || '''' }}'
                operator: NotEquals
                value: required
              - key: '{{ request.object.spec.affinity.topologyKey || '''' }}'
                operator: NotEquals
                value: kubernetes.io/hostname
