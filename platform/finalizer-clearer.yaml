---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finalizer-clearer
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: finalizer-clearer
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: self-heal
    entity: cluster
    capability: resiliency
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: finalizer-clearer
  labels:
    app.kubernetes.io/name: finalizer-clearer
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: self-heal
    entity: cluster
    capability: resiliency
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "configmaps", "services", "serviceaccounts"]
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["patch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["patch"]
  - apiGroups:
      - helm.toolkit.fluxcd.io
      - source.toolkit.fluxcd.io
      - pkg.crossplane.io
      - apiextensions.crossplane.io
      - cloudplatform.gcp.m.upbound.io
      - cloudplatform.gcp.upbound.io
      - gcp.m.upbound.io
      - gcp.upbound.io
      - dns.upjet-cloudflare.m.upbound.io
      - dns.upjet-cloudflare.upbound.io
      - r2.upjet-cloudflare.m.upbound.io
      - r2.upjet-cloudflare.upbound.io
      - upjet-cloudflare.m.upbound.io
      - upjet-cloudflare.upbound.io
      - workers.upjet-cloudflare.m.upbound.io
      - workers.upjet-cloudflare.upbound.io
      - zero.upjet-cloudflare.m.upbound.io
      - zero.upjet-cloudflare.upbound.io
      - fluentbit.fluent.io
      - cert-manager.io
    resources: ["*"]
    verbs: ["patch"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: finalizer-clearer-scope
  labels:
    app.kubernetes.io/name: finalizer-clearer
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: self-heal
    entity: cluster
    capability: resiliency
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        resources: ["*"]
        operations: ["UPDATE"]
  matchConditions:
    - name: finalizer-clearer
      expression: request.userInfo.username == "system:serviceaccount:cluster-main-observability:finalizer-clearer"
  validations:
    - expression: has(oldObject.metadata.deletionTimestamp)
      message: finalizer-clearer may only change objects that are already deleting
    - expression: "!has(oldObject.spec) ? !has(object.spec) : (has(object.spec) && object.spec == oldObject.spec)"
      message: finalizer-clearer may not change spec
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: finalizer-clearer-scope
  labels:
    app.kubernetes.io/name: finalizer-clearer
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: self-heal
    entity: cluster
    capability: resiliency
spec:
  policyName: finalizer-clearer-scope
  validationActions: ["Deny"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: finalizer-clearer
  labels:
    app.kubernetes.io/name: finalizer-clearer
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: self-heal
    entity: cluster
    capability: resiliency
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: finalizer-clearer
subjects:
  - kind: ServiceAccount
    name: finalizer-clearer
    namespace: cluster-main-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: finalizer-clearer-reader
  labels:
    app.kubernetes.io/name: finalizer-clearer
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: self-heal
    entity: cluster
    capability: resiliency
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-health-reader
subjects:
  - kind: ServiceAccount
    name: finalizer-clearer
    namespace: cluster-main-observability
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: finalizer-clearer
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: finalizer-clearer
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: self-heal
    entity: cluster
    capability: resiliency
  annotations:
    description: >-
      Every 5 minutes, removes the finalizers from objects stuck deleting for longer than DEFAULT_TIMEOUT_MINUTES, or the object's self-heal-timeout label (e.g. 30m, 2h). What is stateful is decided only by the Kyverno policy stateful-protection, which refuses this job's patch on anything it protects; those are logged as skip-stateful. Never touches Secrets, PVCs, PVs, CRDs, FluxInstances, CNPG or Kyverno objects. An admission policy limits it to objects already deleting, with spec unchanged. Each cleared object is logged as one JSON line. projects#913.
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 240
      template:
        metadata:
          labels:
            app.kubernetes.io/name: finalizer-clearer
            entity: cluster
            capability: resiliency
        spec:
          restartPolicy: Never
          serviceAccountName: finalizer-clearer
          containers:
            - name: clear
              image: docker.io/library/python:3.13-alpine
              command: ["python3", "-u", "/clearer/clear.py"]
              env:
                - name: DEFAULT_TIMEOUT_MINUTES
                  value: "15"
              volumeMounts:
                - name: health
                  mountPath: /scripts
                  readOnly: true
                - name: clearer
                  mountPath: /clearer
                  readOnly: true
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
                runAsUser: 65534
                seccompProfile:
                  type: RuntimeDefault
          volumes:
            - name: health
              configMap:
                name: cluster-health-script
            - name: clearer
              configMap:
                name: finalizer-clearer-script
