---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ha-probe
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: ha-probe
    app.kubernetes.io/part-of: kyverno
    app.kubernetes.io/component: probe
    entity: cluster
    env: main
    capability: resiliency
    resiliency.simplesalt.company/ha: required
spec:
  selector:
    matchLabels:
      app: ha-probe
  template:
    metadata:
      labels:
        app: ha-probe
        app.kubernetes.io/name: ha-probe
        app.kubernetes.io/part-of: kyverno
        app.kubernetes.io/component: probe
        entity: cluster
        env: main
        capability: resiliency
    spec:
      automountServiceAccountToken: false
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              cpu: 10m
              memory: 16Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
