apiVersion: batch/v1
kind: Job
metadata:
  name: node-flannel-repin-k-0ad0ff18
  namespace: kured
  labels:
    app.kubernetes.io/name: node-flannel-repin
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: node-lifecycle
    entity: cluster
    capability: lifecycle
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-flannel-repin
        app.kubernetes.io/part-of: basis
        app.kubernetes.io/component: node-lifecycle
    spec:
      restartPolicy: Never
      hostPID: true
      nodeSelector:
        kubernetes.io/hostname: k-0ad0ff18
      tolerations:
        - operator: Exists
      containers:
        - name: node-flannel-repin
          image: ghcr.io/simplesalt/oci/cluster:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - nsenter
            - --target=1
            - --mount
            - --uts
            - --ipc
            - --net
            - --pid
            - --
            - bash
            - -c
            - |
              set -euo pipefail
              FLOATING=192.168.1.10
              LINK=$(ip -d -o link show flannel.1)
              FLANNEL_LOCAL=$(grep -o 'local [0-9.]*' <<<"$LINK" | cut -d' ' -f2) || {
                echo "could not read the local address of flannel.1"
                exit 1
              }
              echo "flannel.1 local address: $FLANNEL_LOCAL"
              if [ "$FLANNEL_LOCAL" != "$FLOATING" ]; then
                echo "flannel already uses its own address, nothing to do"
                exit 0
              fi
              ADDRS=$(ip -4 -o addr show)
              if grep -qF " $FLOATING/" <<<"$ADDRS"; then
                echo "this node holds the floating address $FLOATING, not restarting k3s"
                exit 1
              fi
              ip -4 -o addr show scope global
              k3s etcd-snapshot save --name pre-flannel-repin
              systemd-run --unit=k3s-flannel-repin --on-active=20 systemctl restart k3s.service
              echo "k3s restart scheduled in 20 seconds"
