---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-flux
  namespace: flux-system
  labels:
    entity: cluster
    capability: svcs
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-flux
  namespace: flux-system
  labels:
    app: mcp-flux
    app.kubernetes.io/name: mcp-flux
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: mcp-server
    entity: cluster
    capability: svcs
spec:
  ports:
    - name: http
      port: 9090
      targetPort: 9090
  selector:
    app: mcp-flux
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-flux
  namespace: flux-system
  labels:
    app: mcp-flux
    app.kubernetes.io/name: mcp-flux
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: mcp-server
    entity: cluster
    capability: svcs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-flux
  template:
    metadata:
      labels:
        app: mcp-flux
        app.kubernetes.io/name: mcp-flux
        app.kubernetes.io/part-of: basis
        app.kubernetes.io/component: mcp-server
        entity: cluster
        capability: svcs
    spec:
      serviceAccountName: mcp-flux
      containers:
        - name: manager
          image: ghcr.io/controlplaneio-fluxcd/flux-operator-mcp:v0.49.0
          imagePullPolicy: Always
          args:
            - serve
            - --transport=http
            - --port=9090
            - --read-only=false
          env:
            - name: RUNTIME_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 9090
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-flux-allow-internal
  namespace: flux-system
  labels:
    app: mcp-flux
    app.kubernetes.io/name: mcp-flux
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: mcp-server
    entity: cluster
    capability: svcs
spec:
  podSelector:
    matchLabels:
      app: mcp-flux
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - ssint-main-coding
                  - ssint-main-ai
      ports:
        - protocol: TCP
          port: 9090
