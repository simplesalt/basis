# mcp-flux: MCP server exposing read/write Flux + Kubernetes API access
# (flux-operator-mcp) to in-cluster consumers.
#
# Deliberately internal-only: no Ingress. Every known consumer already
# reaches it via the in-cluster Service DNS, so there is no need for
# external/Ingress exposure -- do not "helpfully" re-add one. See the
# NetworkPolicy below for the exact namespaces admitted.
#
# Ported from simplesalt/base-stack (branch `named`) 3.infra/mcp-k8s.yaml.
# Ref: simplesalt/projects#221.
#
# Name (mcp-flux), namespace (flux-system) and port (9090) are load-bearing:
# three consumers hardcode http://mcp-flux.flux-system:9090/mcp --
# simplesalt/brain manifests/hermes-config.yaml, simplesalt/brain
# manifests/coding.yaml, and simplesalt/oci builder-sb/skel/.claude.json.tmpl.
# Do not rename or move without updating all three.
#
# NOT included in this port: the ClusterRole/ClusterRoleBinding RBAC
# (`operator-role` / `operator-role-mcp-flux` in base-stack's
# 2.access/rbac.yaml) that this ServiceAccount needs to actually call the
# K8s/Flux API. That grant includes a broad `delete` verb across most
# cluster resources and issue simplesalt/projects#221 explicitly calls for a
# security review (and a rename to mcp-flux-operator-role) before it's
# re-applied here -- it was intentionally left out of this change rather
# than copied uncritically. Without it, this Deployment will run but every
# API call it makes will be forbidden. Track as follow-up.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-flux
  namespace: flux-system
  labels:
    entity: cluster
    capability: svcs
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-flux
  namespace: flux-system
  labels:
    app: mcp-flux
    app.kubernetes.io/name: mcp-flux
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: mcp-server
    entity: cluster
    capability: svcs
spec:
  ports:
    - name: http
      port: 9090
      targetPort: 9090
  selector:
    app: mcp-flux
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-flux
  namespace: flux-system
  labels:
    app: mcp-flux
    app.kubernetes.io/name: mcp-flux
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: mcp-server
    entity: cluster
    capability: svcs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-flux
  template:
    metadata:
      labels:
        app: mcp-flux
        app.kubernetes.io/name: mcp-flux
        app.kubernetes.io/part-of: basis
        app.kubernetes.io/component: mcp-server
        entity: cluster
        capability: svcs
    spec:
      serviceAccountName: mcp-flux
      containers:
        - name: manager
          image: ghcr.io/controlplaneio-fluxcd/flux-operator-mcp:v0.49.0
          imagePullPolicy: Always
          args:
            - serve
            - --transport=http
            - --port=9090
            - --read-only=false
          env:
            - name: RUNTIME_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 9090
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-flux-allow-internal
  namespace: flux-system
  labels:
    app: mcp-flux
    app.kubernetes.io/name: mcp-flux
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: mcp-server
    entity: cluster
    capability: svcs
spec:
  # mcp-flux is deliberately internal-only: there is no Ingress for it (see
  # simplesalt/projects#221), and it must stay that way -- do not re-add one
  # without also re-reviewing this policy. Reachable only via the in-cluster
  # Service DNS (http://mcp-flux.flux-system:9090/mcp), which is what every
  # known consumer already hardcodes (see the file header). Ingress is
  # restricted to those consumers' namespaces, matched on the built-in
  # kubernetes.io/metadata.name label:
  #   - ssint-main-coding (simplesalt/brain manifests/coding.yaml: the
  #     claude-rc-* coding pods, and simplesalt/oci builder-sb/skel/
  #     .claude.json.tmpl which they run)
  #   - ssint-main-ai (simplesalt/brain manifests/hermes-config.yaml:
  #     the hermes-agent Deployment)
  podSelector:
    matchLabels:
      app: mcp-flux
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - ssint-main-coding
                  - ssint-main-ai
      ports:
        - protocol: TCP
          port: 9090
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-flux-operator-role
  labels:
    entity: cluster
    capability: svcs
rules:
  # KNOWN ISSUE (accepted, tracked, carried over as-is from base-stack@named):
  # this blanket list-everything rule includes secrets, so it grants
  # read access to every Secret's data cluster-wide, silently defeating
  # the "non-secret resources" restriction on the rule below. This is
  # not a new regression -- it's the same grant that is live on the
  # current production cluster today via base-stack. See
  # simplesalt/basis#8 for the tracked narrowing follow-up.
  # Allow listing all resources
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["list"]
  # Read-only verbs for non-secret resources
  - apiGroups: ["*"]
    resources:
      # Core resources
      - bindings
      - componentstatuses
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - nodes
      - pods
      - podtemplates
      - replicationcontrollers
      - resourcequotas
      - serviceaccounts
      - services
      - persistentvolumes
      - persistentvolumeclaims
      # ACME/Cert-Manager
      - challenges
      - orders
      # Admission
      - mutatingwebhookconfigurations
      - validatingadmissionpolicies
      - validatingadmissionpolicybindings
      - validatingwebhookconfigurations
      # API Extensions
      - customresourcedefinitions
      - apiservices
      # Apps
      - controllerrevisions
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
      # Authentication
      - selfsubjectreviews
      - tokenreviews
      - localsubjectaccessreviews
      - selfsubjectaccessreviews
      - selfsubjectrulesreviews
      - subjectaccessreviews
      # Autoscaling
      - horizontalpodautoscalers
      # Batch
      - cronjobs
      - jobs
      # Coordination
      - leases
      # Discovery
      - endpointslices
      # DNS
      - dnsendpoints
      # Flow Control
      - flowschemas
      - prioritylevelconfigurations
      # Flux
      - fluxreports
      - fluxinstances
      - resourcesetinputproviders
      - resourcesets
      - helmchartconfigs
      - helmcharts
      - helmreleases
      - kustomizations
      - gitrepositories
      - helmrepositories
      - ocirepositories
      - buckets
      - imagepolicies
      - imagerepositories
      - imageupdateautomations
      - alerts
      - providers
      - receivers
      # Gateway API
      - gatewayclasses
      - gateways
      - grpcroutes
      - httproutes
      - referencegrants
      # Hub/Extensions
      - accesscontrolpolicies
      - aiservices
      - apiversions
      - managedsubscriptions
      - apiaccesses
      - apibundles
      - apicatalogitems
      - apiplans
      - apiportals
      - apiratelimits
      - apis
      # Infrastructure
      - terraforms
      - addons
      - etcdsnapshotfiles
      # MetalLB
      - bfdprofiles
      - bgpadvertisements
      - bgppeers
      - communities
      - ipaddresspools
      - l2advertisements
      - servicebgpstatuses
      - servicel2statuses
      # Networking
      - ingressclasses
      - ingresses
      - networkpolicies
      # Node
      - runtimeclasses
      # Policy
      - poddisruptionbudgets
      # RBAC
      - clusterrolebindings
      - clusterroles
      - rolebindings
      - roles
      # Scheduling
      - priorityclasses
      # Storage
      - csidrivers
      - csinodes
      - csistoragecapacities
      - storageclasses
      - volumeattachments
      # Traefik
      - ingressroutes
      - ingressroutetcps
      - ingressrouteudps
      - middlewares
      - middlewaretcps
      - serverstransports
      - serverstransporttcps
      - tlsoptions
      - traefikservices
    verbs:
      - get
      - describe
      - logs
      - top
      - cluster-info
      - events
      - diff
      - wait
      - api-resources
      - api-versions
      - config
      - version
      - auth
      - completion
      - explain
      - exec
      - attach
      - port-forward
      - proxy
      - cp
      - certificate
      - debug
  # Allow delete for non-persistent resources
  - apiGroups: ["*"]
    resources:
      - bindings
      - componentstatuses
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - nodes
      - pods
      - podtemplates
      - replicationcontrollers
      - resourcequotas
      - serviceaccounts
      - services
      - challenges
      - orders
      - mutatingwebhookconfigurations
      - validatingadmissionpolicies
      - validatingadmissionpolicybindings
      - validatingwebhookconfigurations
      - customresourcedefinitions
      - apiservices
      - controllerrevisions
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
      - selfsubjectreviews
      - tokenreviews
      - localsubjectaccessreviews
      - selfsubjectaccessreviews
      - selfsubjectrulesreviews
      - subjectaccessreviews
      - horizontalpodautoscalers
      - cronjobs
      - jobs
      - leases
      - endpointslices
      - dnsendpoints
      - flowschemas
      - prioritylevelconfigurations
      - fluxreports
      - resourcesetinputproviders
      - resourcesets
      - gatewayclasses
      - gateways
      - grpcroutes
      - httproutes
      - referencegrants
      - helmchartconfigs
      - helmcharts
      - helmreleases
      - accesscontrolpolicies
      - aiservices
      - apiversions
      - managedsubscriptions
      - imagepolicies
      - imagerepositories
      - imageupdateautomations
      - terraforms
      - addons
      - etcdsnapshotfiles
      - kustomizations
      - bfdprofiles
      - bgpadvertisements
      - bgppeers
      - communities
      - ipaddresspools
      - l2advertisements
      - servicebgpstatuses
      - servicel2statuses
      - ingressclasses
      - ingresses
      - networkpolicies
      - runtimeclasses
      - alerts
      - providers
      - receivers
      - poddisruptionbudgets
      - clusterrolebindings
      - clusterroles
      - rolebindings
      - roles
      - priorityclasses
      - buckets
      - gitrepositories
      - helmcharts
      - helmrepositories
      - ocirepositories
      - csidrivers
      - csinodes
      - csistoragecapacities
      - storageclasses
      - volumeattachments
      - ingressroutes
      - ingressroutetcps
      - ingressrouteudps
      - middlewares
      - middlewaretcps
      - serverstransports
      - serverstransporttcps
      - tlsoptions
      - traefikservices
    verbs:
      - delete
  # Special permission for FluxInstances
  - apiGroups: ["fluxcd.controlplane.io"]
    resources: ["fluxinstances"]
    verbs: ["apply"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-flux-operator-role
  labels:
    entity: cluster
    capability: svcs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-flux-operator-role
subjects:
  - kind: ServiceAccount
    name: mcp-flux
    namespace: flux-system
