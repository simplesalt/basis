---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logs-postgrest
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: logs-postgrest
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: api
    entity: cluster
    env: main
    capability: observability
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: logs-postgrest
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: logs-postgrest
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: api
    entity: cluster
    env: main
    capability: observability
spec:
  type: ClusterIP
  selector:
    app: logs-postgrest
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logs-postgrest
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: logs-postgrest
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: api
    entity: cluster
    env: main
    capability: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logs-postgrest
  template:
    metadata:
      labels:
        app: logs-postgrest
        app.kubernetes.io/name: logs-postgrest
        app.kubernetes.io/part-of: observability
        app.kubernetes.io/component: api
        entity: cluster
        env: main
        capability: observability
    spec:
      serviceAccountName: logs-postgrest
      automountServiceAccountToken: false
      containers:
        - name: postgrest
          image: postgrest/postgrest:v16.2
          env:
            - name: PGRST_DB_URI
              valueFrom:
                secretKeyRef:
                  name: logs-pg-app
                  key: uri
            - name: PGRST_DB_ANON_ROLE
              value: logs_read
            - name: PGRST_DB_SCHEMAS
              value: logs_api
            - name: PGRST_SERVER_PORT
              value: "3000"
            - name: PGRST_DB_MAX_ROWS
              value: "1000"
            - name: PGRST_DB_POOL
              value: "10"
            - name: PGRST_OPENAPI_MODE
              value: follow-privileges
            - name: PGRST_LOG_LEVEL
              value: warn
            - name: PGRST_ADMIN_SERVER_PORT
              value: "3001"
          ports:
            - name: http
              containerPort: 3000
            - name: admin
              containerPort: 3001
          readinessProbe:
            httpGet:
              path: /ready
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: admin
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logs-mcp
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: logs-mcp
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: mcp-server
    entity: cluster
    env: main
    capability: observability
data:
  config.yaml: |
    binds:
    - port: 8080
      listeners:
      - routes:
        - backends:
          - mcp:
              targets:
              - name: logs
                openapi:
                  schema:
                    file: /etc/agentgateway/spec/openapi.json
                  host: logs-postgrest.cluster-main-observability.svc.cluster.local:3000
---
apiVersion: v1
kind: Service
metadata:
  name: logs-mcp
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: logs-mcp
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: mcp-server
    entity: cluster
    env: main
    capability: observability
spec:
  type: ClusterIP
  selector:
    app: logs-mcp
  ports:
    - name: mcp
      port: 8080
      targetPort: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logs-mcp
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: logs-mcp
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: mcp-server
    entity: cluster
    env: main
    capability: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logs-mcp
  template:
    metadata:
      labels:
        app: logs-mcp
        app.kubernetes.io/name: logs-mcp
        app.kubernetes.io/part-of: observability
        app.kubernetes.io/component: mcp-server
        entity: cluster
        env: main
        capability: observability
    spec:
      automountServiceAccountToken: false
      containers:
        - name: agentgateway
          image: ghcr.io/agentgateway/agentgateway:v1.5.0
          args:
            - -f
            - /etc/agentgateway/config.yaml
          ports:
            - name: mcp
              containerPort: 8080
            - name: metrics
              containerPort: 15020
            - name: readiness
              containerPort: 15021
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: readiness
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/agentgateway
            - name: spec
              mountPath: /etc/agentgateway/spec
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: logs-mcp
        - name: spec
          configMap:
            name: logs-mcp-openapi
        - name: tmp
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: logs-mcp-allow-internal
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: logs-mcp
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: mcp-server
    entity: cluster
    env: main
    capability: observability
spec:
  podSelector:
    matchLabels:
      app: logs-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - ssint-main-coding
                  - ssint-main-ai
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: logs-postgrest-allow-internal
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: logs-postgrest
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: api
    entity: cluster
    env: main
    capability: observability
spec:
  podSelector:
    matchLabels:
      app: logs-postgrest
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: logs-mcp
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - ssint-main-coding
                  - ssint-main-ai
      ports:
        - protocol: TCP
          port: 3000
