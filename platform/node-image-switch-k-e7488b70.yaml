apiVersion: batch/v1
kind: Job
metadata:
  name: node-image-switch-k-e7488b70
  namespace: kured
  labels:
    app.kubernetes.io/name: node-image-switch
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: node-lifecycle
    entity: cluster
    capability: lifecycle
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-image-switch
        app.kubernetes.io/part-of: basis
        app.kubernetes.io/component: node-lifecycle
    spec:
      restartPolicy: Never
      hostPID: true
      nodeSelector:
        kubernetes.io/hostname: k-e7488b70
      tolerations:
        - operator: Exists
      containers:
        - name: node-image-switch
          image: ghcr.io/simplesalt/oci/cluster:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - nsenter
            - --target=1
            - --mount
            - --uts
            - --ipc
            - --net
            - --pid
            - --
            - bash
            - -c
            - |
              set -euo pipefail
              TARGET=ghcr.io/simplesalt/oci/cluster:latest

              bootc status

              CURRENT=$(bootc status --format=json 2>/dev/null | jq -r '.spec.image.image // empty' || true)

              if [ "$CURRENT" != "$TARGET" ]; then
                bootc switch "$TARGET"
              else
                echo "already on $TARGET, skipping bootc switch"
              fi

              if [ -e /run/ostree/staged-deployment ]; then
                touch /var/run/reboot-required
                stat -c '%n mtime=%y' /var/run/reboot-required
              else
                echo "nothing staged, no reboot flag set"
              fi

              bootc status
              grep -h container-image-reference /ostree/deploy/*/deploy/*.origin || true
