apiVersion: batch/v1
kind: Job
metadata:
  name: node-update-k-0ad0ff18
  namespace: kured
  labels:
    app.kubernetes.io/name: node-update
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: node-lifecycle
    entity: cluster
    capability: lifecycle
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-update
        app.kubernetes.io/part-of: basis
        app.kubernetes.io/component: node-lifecycle
    spec:
      restartPolicy: Never
      hostPID: true
      nodeSelector:
        kubernetes.io/hostname: k-0ad0ff18
      tolerations:
        - operator: Exists
      containers:
        - name: node-update
          image: ghcr.io/simplesalt/oci/cluster:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: EXPECTED_DIGEST
              valueFrom:
                configMapKeyRef:
                  name: node-update-step
                  key: expected-digest
          command:
            - nsenter
            - --target=1
            - --mount
            - --uts
            - --ipc
            - --net
            - --pid
            - --
            - bash
            - -c
            - |
              set -euo pipefail
              trap 'rm -f /var/run/reboot-required; echo "check failed, reboot flag removed"' ERR
              systemctl start bootc-update.service
              journalctl -u bootc-update.service -n 20 --no-pager -o cat
              STATUS=$(bootc status --format=json)
              STAGED=$(jq -r '.status.staged.image.imageDigest // empty' <<<"$STATUS")
              BOOTED=$(jq -r '.status.booted.image.imageDigest // empty' <<<"$STATUS")
              echo "expected=$EXPECTED_DIGEST booted=$BOOTED staged=${STAGED:-none}"
              if [ -n "$STAGED" ] && [ "$STAGED" != "$EXPECTED_DIGEST" ]; then
                rm -f /var/run/reboot-required
                echo "staged image is not this step's image, reboot flag removed"
                exit 1
              fi
              if [ -z "$STAGED" ] && [ "$BOOTED" != "$EXPECTED_DIGEST" ]; then
                echo "nothing staged and the booted image is not this step's image"
                exit 1
              fi
              if [ -e /var/run/reboot-required ]; then echo "reboot flag set"; else echo "no reboot flag"; fi
---
