---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-health
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: cluster-health
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: health-check
    entity: cluster
    env: main
    capability: observability
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-health-reader
  labels:
    app.kubernetes.io/name: cluster-health
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: health-check
    entity: cluster
    env: main
    capability: observability
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - pods
      - persistentvolumes
      - persistentvolumeclaims
      - configmaps
      - services
      - serviceaccounts
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheusrules"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - validatingwebhookconfigurations
      - mutatingwebhookconfigurations
    verbs: ["get", "list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list"]
  - apiGroups: ["fluxcd.controlplane.io"]
    resources: ["fluxinstances"]
    verbs: ["get", "list"]
  - apiGroups:
      # Flux (source.toolkit.fluxcd.io's resources: ["*"] here already
      # covers helmcharts -- no separate rule needed for it)
      - kustomize.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - source.toolkit.fluxcd.io
      # Crossplane core + managed-resource groups (same groups as
      # platform/mcp-flux.yaml's ClusterRole)
      - pkg.crossplane.io
      - apiextensions.crossplane.io
      - cloudplatform.gcp.m.upbound.io
      - cloudplatform.gcp.upbound.io
      - gcp.m.upbound.io
      - gcp.upbound.io
      - dns.upjet-cloudflare.m.upbound.io
      - dns.upjet-cloudflare.upbound.io
      - r2.upjet-cloudflare.m.upbound.io
      - r2.upjet-cloudflare.upbound.io
      - upjet-cloudflare.m.upbound.io
      - upjet-cloudflare.upbound.io
      - workers.upjet-cloudflare.m.upbound.io
      - workers.upjet-cloudflare.upbound.io
      - zero.upjet-cloudflare.m.upbound.io
      - zero.upjet-cloudflare.upbound.io
      # Other operators this repo installs
      - fluentbit.fluent.io
      - postgresql.cnpg.io
      - cert-manager.io
      - kyverno.io
    resources: ["*"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-health-reader
  labels:
    app.kubernetes.io/name: cluster-health
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: health-check
    entity: cluster
    env: main
    capability: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-health-reader
subjects:
  - kind: ServiceAccount
    name: cluster-health
    namespace: cluster-main-observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-health
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: cluster-health
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: health-check
    entity: cluster
    env: main
    capability: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-health
  template:
    metadata:
      labels:
        app: cluster-health
        app.kubernetes.io/name: cluster-health
        app.kubernetes.io/part-of: observability
        app.kubernetes.io/component: health-check
        entity: cluster
        env: main
        capability: observability
    spec:
      serviceAccountName: cluster-health
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: python:3.13-alpine
          command: ["python3", "/scripts/server.py"]
          env:
            - name: ORPHAN_AFTER_MINUTES
              value: "15"
            - name: CONTROLLER_MAP_PATH
              value: /scripts/controller-map.json
            - name: PROMETHEUS_URL
              value: http://prometheus-operated.cluster-main-observability.svc.cluster.local:9090
            - name: REBOOT_GATE_ALERT
              value: RebootGateClosed
            - name: REBOOT_GATE_MAX_HOURS
              value: "24"
            - name: CORDON_MAX_MINUTES
              value: "30"
            - name: KURED_NAMESPACE
              value: kured
            - name: KURED_DAEMONSET
              value: kured
            - name: KURED_LOCK_ANNOTATION
              value: weave.works/kured-node-lock
            - name: KURED_LOCK_MAX_MINUTES
              value: "30"
            - name: NODE_MEMORY_MIN_USABLE_FRACTION
              value: "0.5"
            - name: NOT_READY_AFTER_HOURS
              value: "24"
            - name: PORT
              value: "8080"
            - name: HOME
              value: /tmp
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: script
          configMap:
            name: cluster-health-script
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cluster-health
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: cluster-health
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: health-check
    entity: cluster
    env: main
    capability: observability
spec:
  type: ClusterIP
  selector:
    app: cluster-health
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cluster-health-allow-logs-mcp
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: cluster-health
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: health-check
    entity: cluster
    env: main
    capability: observability
spec:
  podSelector:
    matchLabels:
      app: cluster-health
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: logs-mcp
      ports:
        - protocol: TCP
          port: 8080
