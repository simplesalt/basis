---
# Read-only diagnostic: queries the Prometheus and Alertmanager HTTP APIs and
# prints the answers to its log. Read the log with get_kubernetes_logs and a
# line limit of at least 500. It needs no NetworkPolicy: every live policy in
# this namespace is Ingress-only and selects only cluster-health, logs-mcp or
# logs-postgrest pods, so nothing restricts this pod's egress or the ingress to
# the Prometheus and Alertmanager pods. Remove this file and its kustomization
# entry after reading: Flux recreates the Job once the TTL deletes it.
apiVersion: batch/v1
kind: Job
metadata:
  name: probe-node-alert-signals
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: probe-node-alert-signals
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: diagnostic
    entity: cluster
    env: main
    capability: observability
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: probe-node-alert-signals
        app.kubernetes.io/part-of: observability
        app.kubernetes.io/component: diagnostic
        entity: cluster
        env: main
        capability: observability
        scheduling.simplesalt.company/class: work
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: python:3.13-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PROMETHEUS_URL
              value: http://prometheus-operated.cluster-main-observability.svc.cluster.local:9090
            - name: ALERTMANAGER_URL
              value: http://alertmanager-operated.cluster-main-observability.svc.cluster.local:9093
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - python3
            - -u
            - -c
            - |
              """Read-only node alert signal probe.

              Queries the cluster Prometheus and Alertmanager HTTP APIs and prints compact
              tables to stdout. Stdlib only. Every query is caught individually, so one
              failure never stops the run. Alertmanager's configuration is parsed locally
              and only receiver names and integration type names are ever printed; no
              value from it (URLs, tokens, routes' matchers) can reach the log.
              """
              import json
              import os
              import re
              import sys
              import time
              import urllib.error
              import urllib.parse
              import urllib.request
              from datetime import datetime, timezone

              PROM = os.environ.get(
                  "PROMETHEUS_URL",
                  "http://prometheus-operated.cluster-main-observability.svc.cluster.local:9090",
              ).rstrip("/")
              AM = os.environ.get(
                  "ALERTMANAGER_URL",
                  "http://alertmanager-operated.cluster-main-observability.svc.cluster.local:9093",
              ).rstrip("/")
              HTTP_TIMEOUT = int(os.environ.get("HTTP_TIMEOUT", "120"))

              NOW = time.time()
              NE = '{job="node-exporter"}'
              WIN = "3d"
              STEP = "4m"
              EVAL_S = 120
              GIB = float(2 ** 30)
              MEM_LOW = 1610612736
              DEV_RE = r"(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|dm-.+|md.+|dasd.+)"
              CAP = 45

              NODES = {}
              CACHE = {}
              STATS = {"ok": 0, "err": 0}
              CONN = {"fails": 0}
              EXCEED = []
              FIRED = []
              WINDOW = {}


              def out(s=""):
                  print(s, flush=True)


              def iso(ts):
                  return datetime.fromtimestamp(ts, timezone.utc).strftime("%Y-%m-%d %H:%MZ")


              def oneline(s):
                  return re.sub(r"\s+", " ", str(s)).strip()


              def errtext(e):
                  return "%s: %s" % (type(e).__name__, oneline(e)[:300])


              def num(v):
                  if v != v:
                      return "nan"
                  if v in (float("inf"), float("-inf")):
                      return "inf" if v > 0 else "-inf"
                  if v == 0:
                      return "0"
                  return "%.4g" % v


              def cnt(v):
                  if v != v or v in (float("inf"), float("-inf")):
                      return num(v)
                  return str(int(round(v)))


              def gib(v):
                  return "%.2f" % (v / GIB)


              def who(inst):
                  return NODES.get(inst) or inst


              def sec(n, title):
                  out("")
                  out("=== %s. %s ===" % (n, title))


              def table(headers, rows, cap=CAP):
                  rows = [[str(c) for c in r] for r in rows]
                  shown = rows[:cap]
                  w = [max([len(h)] + [len(r[i]) for r in shown]) for i, h in enumerate(headers)]
                  out("   " + "  ".join(h.ljust(w[i]) for i, h in enumerate(headers)).rstrip())
                  for r in shown:
                      out("   " + "  ".join(c.ljust(w[i]) for i, c in enumerate(r)).rstrip())
                  if len(rows) > cap:
                      out("   ... %d more rows not shown" % (len(rows) - cap))


              # ---------------------------------------------------------------- HTTP

              def http_json(base, path, params=None, post=False, error_detail=False, timeout=None):
                  url = base + path
                  data = None
                  if params:
                      enc = urllib.parse.urlencode(params)
                      if post:
                          data = enc.encode()
                      else:
                          url += "?" + enc
                  req = urllib.request.Request(url, data=data, headers={"Accept": "application/json"})
                  try:
                      with urllib.request.urlopen(req, timeout=timeout or HTTP_TIMEOUT) as r:
                          raw = r.read()
                  except urllib.error.HTTPError as e:
                      detail = ""
                      if error_detail:
                          try:
                              detail = " " + oneline(json.loads(e.read()).get("error", ""))[:250]
                          except Exception:
                              pass
                      raise RuntimeError("HTTP %d%s" % (e.code, detail))
                  return json.loads(raw)


              def query(expr):
                  if CONN["fails"] >= 3:
                      raise RuntimeError("skipped: 3 connection failures in a row")
                  try:
                      body = http_json(
                          PROM,
                          "/api/v1/query",
                          {"query": expr, "time": "%.3f" % NOW, "timeout": "100s"},
                          post=True,
                          error_detail=True,
                      )
                  except (urllib.error.URLError, OSError):
                      CONN["fails"] += 1
                      raise
                  CONN["fails"] = 0
                  if body.get("status") != "success":
                      raise RuntimeError("status=%s %s" % (body.get("status"), oneline(body.get("error", ""))[:250]))
                  d = body["data"]
                  kind = d.get("resultType")
                  if kind == "vector":
                      return [(s["metric"], float(s["value"][1])) for s in d["result"]]
                  if kind == "scalar":
                      return [({}, float(d["result"][1]))]
                  raise RuntimeError("unexpected resultType %r" % (kind,))


              def run(expr, quiet=False):
                  """Run one instant query. Prints the query unless quiet. None on error."""
                  if not quiet:
                      out("Q> " + oneline(expr))
                  if expr in CACHE:
                      return CACHE[expr]
                  try:
                      rows = query(expr)
                  except Exception as e:
                      if not quiet:
                          STATS["err"] += 1
                          out("   SKIPPED: prometheus unreachable" if CONN["fails"] >= 3 else "   ERROR: " + errtext(e))
                      return None
                  STATS["ok"] += 1
                  CACHE[expr] = rows
                  return rows


              def series(expr, empty="(no data)"):
                  """Run expr; return {(instance, device): value} (max on duplicates) or None."""
                  rows = run(expr)
                  if rows is None:
                      return None
                  if not rows:
                      out("   " + empty)
                  d = {}
                  for lab, v in rows:
                      k = (lab.get("instance", "?"), lab.get("device", ""))
                      if k not in d or d[k] != d[k] or v > d[k]:
                          d[k] = v
                  return d


              def collect(items):
                  """items: (name, expr) or (name, expr, message printed when the result is empty)."""
                  return dict((it[0], series(*it[1:])) for it in items)


              def keys_of(res):
                  ks = set()
                  for d in res.values():
                      if d:
                          ks.update(d.keys())
                  return ks


              def cell(res, name, k, fmt=num):
                  d = res.get(name)
                  if d is None:
                      return "ERR"
                  return fmt(d[k]) if k in d else "-"


              def over(res, nname, sname, k):
                  """('hits/steps' cell, hits). Steps with no exceedance are absent from the count query."""
                  n, s = res.get(nname), res.get(sname)
                  if n is None or s is None:
                      return "ERR", 0
                  if k not in s:
                      return "-", 0
                  hit = int(round(n.get(k, 0.0)))
                  return "%d/%d" % (hit, int(round(s[k]))), hit


              def note(what, k, hit, res, sname, mname):
                  if hit > 0:
                      s = res.get(sname) or {}
                      m = (res.get(mname) or {}).get(k)
                      EXCEED.append((what, who(k[0]), k[1], hit, int(round(s.get(k, 0))), m))


              def sub(expr, cmp=None):
                  """Subquery over WIN at STEP; cmp such as '> 10' filters to the steps that hit it."""
                  if cmp is None:
                      return "%s[%s:%s]" % (expr, WIN, STEP)
                  return "(%s %s)[%s:%s]" % (expr, cmp, WIN, STEP)


              # ---------------------------------------------------------------- header, node map

              def header():
                  out("probe-node-alert-signals  started %s" % iso(NOW))
                  out("prometheus=%s" % PROM)
                  out("alertmanager=%s" % AM)
                  try:
                      b = http_json(PROM, "/api/v1/status/buildinfo", timeout=15)
                      out("prometheus version: %s" % b.get("data", {}).get("version", "?"))
                  except Exception as e:
                      out("prometheus buildinfo ERROR: " + errtext(e))
                      if isinstance(e, (urllib.error.URLError, OSError)):
                          CONN["fails"] = 3
                          out("prometheus is unreachable from this pod: every Prometheus query below is skipped")
                  out("window=%s step=%s rate-window=%s scrape/eval interval assumed %ds" % (WIN, STEP, STEP, EVAL_S))


              def load_nodes():
                  for lab, _ in run("node_uname_info", quiet=True) or []:
                      if lab.get("instance") and lab.get("nodename"):
                          NODES[lab["instance"]] = lab["nodename"]
                  for lab, _ in run('kube_pod_info{pod=~".*node-exporter.*"}', quiet=True) or []:
                      if lab.get("node"):
                          for k in ("host_ip", "pod_ip"):
                              if lab.get(k):
                                  NODES.setdefault(lab[k] + ":9100", lab["node"])


              # ---------------------------------------------------------------- sections

              def sec1():
                  sec("1", "node-exporter targets")
                  rows = run("up" + NE)
                  if rows is None:
                      return
                  if not rows:
                      out("   (no data)")
                      return
                  table(
                      ["node", "instance", "pod", "up"],
                      sorted([who(l.get("instance", "?")), l.get("instance", "?"), l.get("pod", "-"), cnt(v)] for l, v in rows),
                  )
                  out("   %d of %d targets up" % (sum(1 for _, v in rows if v == 1), len(rows)))


              PRESENCE = [
                  ("cpuW", "node_pressure_cpu_waiting_seconds_total"),
                  ("memW", "node_pressure_memory_waiting_seconds_total"),
                  ("memS", "node_pressure_memory_stalled_seconds_total"),
                  ("ioW", "node_pressure_io_waiting_seconds_total"),
                  ("ioS", "node_pressure_io_stalled_seconds_total"),
                  ("rdT", "node_disk_read_time_seconds_total"),
                  ("wrT", "node_disk_write_time_seconds_total"),
                  ("ioTw", "node_disk_io_time_weighted_seconds_total"),
                  ("memA", "node_memory_MemAvailable_bytes"),
                  ("load1", "node_load1"),
              ]


              def sec2():
                  sec("2", "series count per instance for each signal (- = absent, ERR = query failed)")
                  got = {}
                  for code, metric in PRESENCE:
                      out("[%s]" % code)
                      rows = run("count by (instance) (%s%s)" % (metric, NE))
                      got[code] = None if rows is None else dict((l.get("instance", "?"), v) for l, v in rows)
                  insts = set()
                  for d in got.values():
                      if d:
                          insts.update(d)
                  for lab, _ in CACHE.get("up" + NE, []):
                      insts.add(lab.get("instance", "?"))
                  rows = []
                  gaps = []
                  for inst in sorted(insts, key=lambda i: (who(i), i)):
                      r = [who(inst)]
                      lacks = []
                      for code, _ in PRESENCE:
                          d = got[code]
                          if d is None:
                              r.append("ERR")
                          elif inst in d:
                              r.append(cnt(d[inst]))
                          else:
                              r.append("-")
                              lacks.append(code)
                      if lacks:
                          gaps.append("%s lacks %s" % (who(inst), "all signals" if len(lacks) == len(PRESENCE) else " ".join(lacks)))
                      rows.append(r)
                  table(["node"] + [c for c, _ in PRESENCE], rows)
                  out("   " + ("gaps: " + "; ".join(gaps) if gaps else "no gaps: every signal present on every instance"))


              def sec3():
                  sec("3", "disk devices and the chart device regex")
                  out("   chart regex (anchored): %s" % DEV_RE)
                  rows = run("count by (instance, device) (node_disk_io_time_weighted_seconds_total)")
                  srv = run(
                      'count by (instance, device) (node_disk_io_time_weighted_seconds_total{device=~"%s"})' % DEV_RE
                  )
                  if rows is None:
                      return
                  srv_set = None if srv is None else set((l.get("instance", "?"), l.get("device", "")) for l, _ in srv)
                  per = {}
                  for lab, v in rows:
                      per.setdefault(lab.get("instance", "?"), []).append((lab.get("device", ""), v))
                  for inst in sorted(per, key=lambda i: (who(i), i)):
                      yes, no, odd = [], [], []
                      for dev, v in sorted(per[inst]):
                          m = re.fullmatch(DEV_RE, dev) is not None
                          (yes if m else no).append(dev + ("(x%s)" % cnt(v) if v > 1 else ""))
                          if srv_set is not None and m != ((inst, dev) in srv_set):
                              odd.append(dev)
                      line = "   %s: MATCH [%s]  NO-MATCH [%s]" % (who(inst), " ".join(yes), " ".join(no))
                      if odd:
                          line += "  python-vs-server-mismatch [%s]" % " ".join(odd)
                      out(line)
                  if not per:
                      out("   (no data)")


              def sec4():
                  sec("4", "instance to node name")
                  a = run("node_uname_info")
                  b = run('kube_pod_info{pod=~".*node-exporter.*"}')
                  if a:
                      table(
                          ["instance", "nodename", "kernel"],
                          sorted([l.get("instance", "?"), l.get("nodename", "-"), l.get("release", "-")] for l, _ in a),
                      )
                  if b:
                      table(
                          ["pod", "node", "host_ip", "pod_ip"],
                          sorted([l.get("pod", "-"), l.get("node", "-"), l.get("host_ip", "-"), l.get("pod_ip", "-")] for l, _ in b),
                      )
                  out("   mapping used: " + (", ".join("%s=%s" % (i, n) for i, n in sorted(NODES.items())) or "none"))


              def sec5():
                  sec("5", "do these expressions return data now (rate windows of 2m against a 120s scrape)")
                  exprs = [
                      ("as asked", 'sum without(mode)(avg without(cpu)(rate(node_cpu_seconds_total{job="node-exporter",mode!~"idle|iowait"}[2m])))'),
                      ("as asked", 'rate(node_network_receive_errs_total{job="node-exporter"}[2m])'),
                      ("as asked", 'changes(node_network_up{job="node-exporter"}[2m])'),
                      ("control 4m", 'sum without(mode)(avg without(cpu)(rate(node_cpu_seconds_total{job="node-exporter",mode!~"idle|iowait"}[4m])))'),
                      ("control 4m", 'rate(node_network_receive_errs_total{job="node-exporter"}[4m])'),
                      ("control 4m", 'changes(node_network_up{job="node-exporter"}[4m])'),
                  ]
                  for tag, expr in exprs:
                      out("[%s]" % tag)
                      rows = run(expr)
                      if rows is None:
                          continue
                      insts = set(l.get("instance", "?") for l, _ in rows)
                      vals = [v for _, v in rows if v == v]
                      rng = " values %s..%s" % (num(min(vals)), num(max(vals))) if vals else ""
                      out("   rows=%d instances=%d%s%s" % (len(rows), len(insts), rng, "   NO DATA" if not rows else ""))
                      for lab, v in rows[:3]:
                          rest = ",".join(
                              "%s=%s" % (k, lab[k]) for k in sorted(lab) if k in ("device", "mode", "cpu")
                          )
                          out("   e.g. %s%s = %s" % (who(lab.get("instance", "?")), "{%s}" % rest if rest else "", num(v)))


              def sec6_memory():
                  out("--- 6a. memory available: now, minimum over %s, steps below 1.5 GiB ---" % WIN)
                  sel = "node_memory_MemAvailable_bytes" + NE
                  r = collect([
                      ("total", "node_memory_MemTotal_bytes" + NE),
                      ("now", sel),
                      ("min", "min_over_time(%s[%s])" % (sel, WIN)),
                      ("n", "count_over_time(%s)" % sub(sel, "< %d" % MEM_LOW), "(no rows: no step exceeded, or no data)"),
                      ("steps", "count_over_time(%s)" % sub(sel)),
                  ])
                  rows = []
                  for k in sorted(keys_of(r), key=lambda k: (who(k[0]), k[1])):
                      c, hit = over(r, "n", "steps", k)
                      note("MemAvailable<1.5GiB", k, hit, r, "steps", "min")
                      rows.append([who(k[0]), cell(r, "total", k, gib), cell(r, "now", k, gib), cell(r, "min", k, gib), c])
                  table(["node", "MemTotal_GiB", "now_GiB", "min_GiB", "steps<1.5GiB"], rows)


              def sec6_disk_queue(matches):
                  out("--- 6b. disk average queue depth rate(io_time_weighted[4m]): max over %s, steps above 10 ---" % WIN)
                  expr = "rate(node_disk_io_time_weighted_seconds_total%s[4m])" % NE
                  r = collect([
                      ("max", "max_over_time(%s)" % sub(expr)),
                      ("n", "count_over_time(%s)" % sub(expr, "> 10"), "(no rows: no step exceeded, or no data)"),
                      ("steps", "count_over_time(%s)" % sub(expr)),
                  ])
                  rows = []
                  for k in sorted(keys_of(r), key=lambda k: (not matches(k[1]), who(k[0]), k[1])):
                      c, hit = over(r, "n", "steps", k)
                      note("queue_depth>10", k, hit, r, "steps", "max")
                      rows.append([who(k[0]), k[1], "yes" if matches(k[1]) else "no", cell(r, "max", k), c])
                  table(["node", "device", "in_regex", "max_depth", "steps>10"], rows)


              def sec6_disk_latency(matches):
                  out("--- 6c. disk latency (seconds per op, only where completions > 1/s): max over %s, steps above 0.05 ---" % WIN)
                  rd = "(rate(node_disk_read_time_seconds_total%s[4m]) / (rate(node_disk_reads_completed_total%s[4m]) > 1))" % (NE, NE)
                  wr = "(rate(node_disk_write_time_seconds_total%s[4m]) / (rate(node_disk_writes_completed_total%s[4m]) > 1))" % (NE, NE)
                  r = collect([
                      ("rmax", "max_over_time(%s)" % sub(rd)),
                      ("rn", "count_over_time(%s)" % sub(rd, "> 0.05"), "(no rows: no step exceeded, or no data)"),
                      ("rsteps", "count_over_time(%s)" % sub(rd)),
                      ("wmax", "max_over_time(%s)" % sub(wr)),
                      ("wn", "count_over_time(%s)" % sub(wr, "> 0.05"), "(no rows: no step exceeded, or no data)"),
                      ("wsteps", "count_over_time(%s)" % sub(wr)),
                      ("either", "count_over_time(((%s > 0.05) or (%s > 0.05))[%s:%s])" % (rd, wr, WIN, STEP), "(no rows: no step exceeded, or no data)"),
                  ])
                  rows = []
                  for k in sorted(keys_of(r), key=lambda k: (not matches(k[1]), who(k[0]), k[1])):
                      rc, rhit = over(r, "rn", "rsteps", k)
                      wc, whit = over(r, "wn", "wsteps", k)
                      note("read_latency>0.05s", k, rhit, r, "rsteps", "rmax")
                      note("write_latency>0.05s", k, whit, r, "wsteps", "wmax")
                      ehit = int(round((r.get("either") or {}).get(k, 0)))
                      if ehit:
                          EXCEED.append(("read|write_latency>0.05s", who(k[0]), k[1], ehit, None, None))
                      rows.append([
                          who(k[0]), k[1], "yes" if matches(k[1]) else "no",
                          cell(r, "rmax", k), rc, cell(r, "wmax", k), wc,
                          "ERR" if r.get("either") is None else str(ehit),
                      ])
                  table(["node", "device", "in_regex", "read_max_s", "read>0.05", "write_max_s", "write>0.05", "either>0.05"], rows)


              def sec6_load():
                  out("--- 6d. load1 per CPU: now and max over %s ---" % WIN)
                  expr = 'node_load1%s / count without(cpu, mode) (node_cpu_seconds_total{job="node-exporter",mode="idle"})' % NE
                  r = collect([
                      ("now", expr),
                      ("max", "max_over_time((%s)[%s:%s])" % (expr, WIN, STEP)),
                  ])
                  rows = [[who(k[0]), cell(r, "now", k), cell(r, "max", k)] for k in sorted(keys_of(r), key=lambda k: (who(k[0]), k[1]))]
                  table(["node", "load_per_cpu_now", "load_per_cpu_max"], rows)


              def sec6_pressure():
                  out("--- 6e. PSI pressure rate(...[4m]): max over %s; steps above threshold (cpu wait 0.25, mem wait 0.10, io wait 0.25) ---" % WIN)
                  def p(metric):
                      return "rate(%s%s[4m])" % (metric, NE)
                  cpuw = p("node_pressure_cpu_waiting_seconds_total")
                  memw = p("node_pressure_memory_waiting_seconds_total")
                  mems = p("node_pressure_memory_stalled_seconds_total")
                  iow = p("node_pressure_io_waiting_seconds_total")
                  ios = p("node_pressure_io_stalled_seconds_total")
                  r = collect([
                      ("cpuw_max", "max_over_time(%s)" % sub(cpuw)),
                      ("cpuw_n", "count_over_time(%s)" % sub(cpuw, "> 0.25"), "(no rows: no step exceeded, or no data)"),
                      ("cpuw_s", "count_over_time(%s)" % sub(cpuw)),
                      ("memw_max", "max_over_time(%s)" % sub(memw)),
                      ("memw_n", "count_over_time(%s)" % sub(memw, "> 0.10"), "(no rows: no step exceeded, or no data)"),
                      ("memw_s", "count_over_time(%s)" % sub(memw)),
                      ("mems_max", "max_over_time(%s)" % sub(mems)),
                      ("iow_max", "max_over_time(%s)" % sub(iow)),
                      ("iow_n", "count_over_time(%s)" % sub(iow, "> 0.25"), "(no rows: no step exceeded, or no data)"),
                      ("iow_s", "count_over_time(%s)" % sub(iow)),
                      ("ios_max", "max_over_time(%s)" % sub(ios)),
                  ])
                  rows = []
                  for k in sorted(keys_of(r), key=lambda k: (who(k[0]), k[1])):
                      c1, h1 = over(r, "cpuw_n", "cpuw_s", k)
                      c2, h2 = over(r, "memw_n", "memw_s", k)
                      c3, h3 = over(r, "iow_n", "iow_s", k)
                      note("cpu_waiting>0.25", k, h1, r, "cpuw_s", "cpuw_max")
                      note("mem_waiting>0.10", k, h2, r, "memw_s", "memw_max")
                      note("io_waiting>0.25", k, h3, r, "iow_s", "iow_max")
                      rows.append([
                          who(k[0]),
                          cell(r, "cpuw_max", k), c1,
                          cell(r, "memw_max", k), c2,
                          cell(r, "mems_max", k),
                          cell(r, "iow_max", k), c3,
                          cell(r, "ios_max", k),
                      ])
                  table(
                      ["node", "cpuW_max", "cpuW>.25", "memW_max", "memW>.10", "memS_max", "ioW_max", "ioW>.25", "ioS_max"],
                      rows,
                  )


              def sec6():
                  sec("6", "current and %s extremes per instance (subqueries at %s; 4m rate windows)" % (WIN, STEP))
                  matches = lambda dev: re.fullmatch(DEV_RE, dev) is not None
                  for fn in (sec6_memory, lambda: sec6_disk_queue(matches), lambda: sec6_disk_latency(matches), sec6_load, sec6_pressure):
                      try:
                          fn()
                      except Exception as e:
                          STATS["err"] += 1
                          out("   SECTION ERROR: " + errtext(e))


              NOISE = ("alertstate", "alertname", "severity", "prometheus", "endpoint", "service", "container", "job", "instance", "node", "nodename")


              def sec7():
                  sec("7", "alerts firing over %s (evaluation points) and the Prometheus data window" % WIN)
                  rows = run('count_over_time(ALERTS{alertstate="firing"}[%s])' % WIN)
                  if rows is not None:
                      if not rows:
                          out("   (no alert fired in the window)")
                      groups = {}
                      for lab, v in rows:
                          inst = lab.get("instance")
                          node = lab.get("node") or lab.get("nodename") or (NODES.get(inst) if inst else None)
                          where = ("node=" + node) if node else (("instance=" + inst) if inst else "-")
                          key = (lab.get("alertname", "?"), lab.get("severity", "-"), where)
                          g = groups.setdefault(key, [0, 0.0, 0.0, ""])
                          g[0] += 1
                          g[2] += v
                          if v >= g[1]:
                              g[1] = v
                              g[3] = oneline(",".join("%s=%s" % (k, lab[k]) for k in sorted(lab) if k not in NOISE))[:70]
                      ordered = sorted(groups.items(), key=lambda kv: (-kv[1][1], kv[0]))
                      table(
                          ["alertname", "severity", "where", "series", "max_points", "~max_min", "other labels of the longest"],
                          [[k[0], k[1], k[2], g[0], cnt(g[1]), cnt(g[1] * EVAL_S / 60.0), g[3] or "-"] for k, g in ordered],
                          cap=60,
                      )
                      for k, g in ordered:
                          FIRED.append((k[0], k[1], k[2], g[1]))
                  out("--- Prometheus TSDB coverage ---")
                  for name in ("prometheus_tsdb_lowest_timestamp_seconds", "prometheus_tsdb_head_min_time_seconds", "prometheus_tsdb_head_max_time_seconds"):
                      r = run(name)
                      if r:
                          ts = min(v for _, v in r)
                          out("   %s = %s  (%.2f days before now)" % (name, iso(ts), (NOW - ts) / 86400.0))
                          if name == "prometheus_tsdb_lowest_timestamp_seconds":
                              WINDOW["lowest"] = ts
                      elif r is not None:
                          out("   (no data)")
                  out("Q> GET /api/v1/status/tsdb (headStats only)")
                  try:
                      hs = http_json(PROM, "/api/v1/status/tsdb").get("data", {}).get("headStats", {})
                      out("   head: series=%s chunks=%s minTime=%s maxTime=%s" % (
                          hs.get("numSeries"), hs.get("chunkCount"),
                          iso(hs["minTime"] / 1000.0) if "minTime" in hs else "?",
                          iso(hs["maxTime"] / 1000.0) if "maxTime" in hs else "?",
                      ))
                  except Exception as e:
                      out("   ERROR: " + errtext(e))


              # ---------------------------------------------------------------- Alertmanager

              def safe_name(s):
                  s = str(s)
                  return s if re.fullmatch(r"[\w./ -]{1,80}", s) else "<unprintable-name>"


              def safe_err(e):
                  if isinstance(e, (RuntimeError, urllib.error.URLError, OSError)):
                      return errtext(e)
                  return type(e).__name__


              def unq(v):
                  v = (v or "").strip()
                  if len(v) >= 2 and v[0] == v[-1] and v[0] in "\"'":
                      v = v[1:-1]
                  return v


              LINE_RE = re.compile(r"^( *)(- +)?(.*)$")
              KEY_RE = re.compile(r"""^("[^"]*"|'[^']*'|[A-Za-z0-9_.\-]+):(?:\s+(.*))?$""")


              def parse_amconfig(text):
                  """Return (route_lines, receivers). Reads structure only.

                  route_lines: [(depth, receiver name)]
                  receivers:   [(name, {integration type: entry count})]
                  Nothing but receiver names and *_configs key names is extracted.
                  """
                  route_lines = []
                  receivers = []
                  section = None
                  stack = []
                  recv_ind = None
                  cur = None
                  cur_int = None
                  child_ind = None
                  for raw in text.splitlines():
                      if not raw.strip() or raw.lstrip().startswith("#"):
                          continue
                      m = LINE_RE.match(raw.rstrip())
                      ind = len(m.group(1))
                      item = m.group(2) is not None
                      kind = ind + (len(m.group(2)) if item else 0)
                      km = KEY_RE.match(m.group(3))
                      key = unq(km.group(1)) if km else None
                      val = km.group(2) if km else None
                      if not item and ind == 0:
                          section = key
                          stack = []
                          cur = None
                          cur_int = None
                          recv_ind = None
                          continue
                      if section == "route":
                          while stack and kind <= stack[-1]:
                              stack.pop()
                          if key == "receiver" and val is not None:
                              route_lines.append((len(stack), unq(val)))
                          elif key == "routes":
                              stack.append(kind)
                      elif section == "receivers":
                          if item and key == "name" and (recv_ind is None or kind == recv_ind):
                              recv_ind = kind
                              cur = (unq(val), {})
                              receivers.append(cur)
                              cur_int = None
                          elif cur is not None and recv_ind is not None:
                              if not item and kind == recv_ind:
                                  if key and key.endswith("_configs"):
                                      cur_int = key[: -len("_configs")]
                                      cur[1][cur_int] = 0
                                      child_ind = None
                                  else:
                                      cur_int = None
                              elif item and cur_int and kind > recv_ind:
                                  if child_ind is None:
                                      child_ind = ind
                                  if ind == child_ind:
                                      cur[1][cur_int] += 1
                  return route_lines, receivers


              def sec8():
                  sec("8", "Alertmanager receivers and routes (names only; no URLs, tokens or other values)")
                  out("Q> GET /api/v2/receivers")
                  try:
                      recs = http_json(AM, "/api/v2/receivers")
                      names = [safe_name(r.get("name")) for r in recs if isinstance(r, dict)]
                      out("   receivers (%d): %s" % (len(names), ", ".join(names) or "-"))
                  except Exception as e:
                      STATS["err"] += 1
                      out("   ERROR: " + safe_err(e))
                  out("Q> GET /api/v2/status  (config parsed locally; only receiver names and integration types are printed)")
                  try:
                      st = http_json(AM, "/api/v2/status")
                      text = ((st.get("config") or {}).get("original")) or ""
                      del st
                      route_lines, receivers = parse_amconfig(text)
                      del text
                      if not receivers and not route_lines:
                          out("   could not read a route tree or receivers from the config (structure not recognised); nothing printed")
                          return
                      out("   route tree (receiver names; child routes indented, routes without an explicit receiver inherit):")
                      for depth, name in route_lines:
                          out("   %s-> %s" % ("   " * depth, safe_name(name)))
                      out("   integrations per receiver:")
                      rows = []
                      for name, ints in receivers:
                          kinds = ", ".join(
                              "%s(%d)" % (t if re.fullmatch(r"[a-z0-9_]{1,30}", t) else "?", n) for t, n in sorted(ints.items())
                          )
                          rows.append([safe_name(name), kinds or "none", "yes" if "webhook" in ints else "no"])
                      table(["receiver", "integrations (entries)", "webhook_configs present"], rows)
                  except Exception as e:
                      STATS["err"] += 1
                      out("   ERROR: " + safe_err(e))


              # ---------------------------------------------------------------- summary

              def summary():
                  out("")
                  out("=== SUMMARY ===")
                  lo = WINDOW.get("lowest")
                  if lo:
                      days = (NOW - lo) / 86400.0
                      out("Prometheus data starts %s, %.2f days of the %s asked for" % (iso(lo), days, WIN))
                  out("4m steps over threshold in the window (only non-zero): steps hit / steps with data; worst = window max, or minimum for MemAvailable")
                  if EXCEED:
                      ordered = sorted(EXCEED, key=lambda e: (-e[3], e[0], e[1], e[2]))
                      for what, node, dev, hit, steps, m in ordered[:30]:
                          worst = ""
                          if m is not None:
                              worst = gib(m) + " GiB" if what.startswith("MemAvailable") else num(m)
                          out("   %-26s %-12s %-10s %6s / %-6s worst %s" % (
                              what, node, dev or "-", hit, steps if steps is not None else "-", worst or "-"))
                      if len(ordered) > 30:
                          out("   ... %d more rows, see the section 6 tables" % (len(ordered) - 30))
                  elif STATS["err"]:
                      out("   none seen, but %d queries failed: this is not evidence that nothing exceeded" % STATS["err"])
                  else:
                      out("   none: no threshold was exceeded on any instance or device")
                  out("alerts that fired (top 12 by evaluation points):")
                  if FIRED:
                      for name, sev, where, pts in sorted(FIRED, key=lambda f: -f[3])[:12]:
                          out("   %-40s %-9s %-24s %s points (~%s min)" % (name, sev, where, cnt(pts), cnt(pts * EVAL_S / 60.0)))
                  elif STATS["err"]:
                      out("   none seen, but %d queries failed" % STATS["err"])
                  else:
                      out("   none")
                  out("queries ok=%d error=%d" % (STATS["ok"], STATS["err"]))
                  out("=== END ===")


              def main():
                  header()
                  load_nodes()
                  for fn in (sec1, sec2, sec3, sec4, sec5, sec6, sec7, sec8):
                      try:
                          fn()
                      except Exception as e:
                          STATS["err"] += 1
                          out("   SECTION ERROR: " + errtext(e))
                  summary()
                  return 0 if STATS["ok"] else 2


              if __name__ == "__main__":
                  sys.exit(main())
