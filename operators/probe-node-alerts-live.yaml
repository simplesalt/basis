---
# Read-only check that the node alert rules are live: which node alert rules
# Prometheus has loaded and their health, whether each expression returns
# data for every node, how often node exporter is now scraped, and whether
# the old 2m-window CPU and network expressions returned data at the 120s
# scrape before the change. Output stays under 100 lines. Remove this file
# and its kustomization entry after reading.
apiVersion: batch/v1
kind: Job
metadata:
  name: probe-node-alerts-live
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: probe-node-alerts-live
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: diagnostic
    entity: cluster
    env: main
    capability: observability
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: probe-node-alerts-live
        app.kubernetes.io/part-of: observability
        app.kubernetes.io/component: diagnostic
        entity: cluster
        env: main
        capability: observability
        scheduling.simplesalt.company/class: work
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: python:3.13-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PROMETHEUS_URL
              value: http://prometheus-operated.cluster-main-observability.svc.cluster.local:9090
            - name: BEFORE_CHANGE
              value: "2026-09-30T11:00:00Z"
          command:
            - python3
            - -u
            - -c
            - |
              import json, os, urllib.parse, urllib.request
              from datetime import datetime

              PROM = os.environ["PROMETHEUS_URL"]
              BEFORE = datetime.strptime(os.environ["BEFORE_CHANGE"], "%Y-%m-%dT%H:%M:%SZ").timestamp() + 0.0
              NE = 'job="node-exporter"'
              DEV = 'device=~"(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|dm-.+|md.+|dasd.+)"'
              JOIN = ' * on (instance) group_left (nodename) node_uname_info{%s}' % NE
              NEW = ["NodeDiskQueueDepthHigh", "NodeDiskReadLatencyHigh", "NodeDiskWriteLatencyHigh",
                     "NodeMemoryAvailableLow", "NodeCPUStall", "NodeMemoryStall", "NodeIOStall"]
              GONE = ["NodeDiskIOSaturation", "NodeMemoryHighUtilization", "NodeMemoryMajorPagesFaults",
                      "NodeSystemSaturation", "NodeCPUHighUsage", "NodeSystemdServiceFailed",
                      "NodeSystemdServiceCrashlooping"]

              def get(path, params=None):
                  url = PROM + path + ("?" + urllib.parse.urlencode(params) if params else "")
                  with urllib.request.urlopen(url, timeout=60) as r:
                      return json.loads(r.read())["data"]

              def q(expr, t=None):
                  p = {"query": expr}
                  if t:
                      p["time"] = "%.0f" % t
                  try:
                      return [(s["metric"], float(s["value"][1])) for s in get("/api/v1/query", p)["result"]]
                  except Exception as e:
                      print("   ERROR %s: %s" % (type(e).__name__, str(e)[:200]))
                      return None

              print("== 1. rules loaded ==")
              seen = {}
              for g in get("/api/v1/rules", {"type": "alert"})["groups"]:
                  for r in g["rules"]:
                      seen.setdefault(r["name"], []).append((g["name"], g.get("interval"), r.get("health"), r.get("lastError", ""), r.get("state")))
              for n in NEW:
                  print("   new  %-26s %s" % (n, seen.get(n, "MISSING")))
              for n in GONE:
                  print("   gone %-26s %s" % (n, "still loaded" if n in seen else "absent"))

              print("== 2. expressions return data per node (value range) ==")
              exprs = {
                  "queue_depth": 'rate(node_disk_io_time_weighted_seconds_total{%s, %s}[1m])' % (NE, DEV),
                  "read_wait": 'rate(node_disk_read_time_seconds_total{%s, %s}[1m]) / rate(node_disk_reads_completed_total{%s, %s}[1m])' % (NE, DEV, NE, DEV),
                  "write_wait": 'rate(node_disk_write_time_seconds_total{%s, %s}[1m]) / rate(node_disk_writes_completed_total{%s, %s}[1m])' % (NE, DEV, NE, DEV),
                  "mem_avail_GiB": 'node_memory_MemAvailable_bytes{%s} / 1024^3' % NE,
                  "cpu_stall": 'rate(node_pressure_cpu_waiting_seconds_total{%s}[1m])' % NE,
                  "mem_stall": 'rate(node_pressure_memory_waiting_seconds_total{%s}[1m])' % NE,
                  "io_stall": 'rate(node_pressure_io_waiting_seconds_total{%s}[1m])' % NE,
              }
              for name, e in exprs.items():
                  rows = q("(%s)%s" % (e, JOIN))
                  if rows is None:
                      continue
                  per = {}
                  for lab, v in rows:
                      per.setdefault(lab.get("nodename", "?"), []).append(v)
                  cells = ["%s[%d]=%s" % (n, len(vs), ",".join("%.3g" % v for v in vs)) for n, vs in sorted(per.items())]
                  print("   %-14s %s" % (name, "  ".join(cells) or "NO DATA"))

              print("== 3. node exporter samples per node in the last 2m (4 = every 30s, 1 = every 120s) ==")
              rows = q('count_over_time(up{%s}[2m])%s' % (NE, JOIN))
              print("   " + "  ".join("%s=%d" % (l.get("nodename", "?"), v) for l, v in sorted(rows or [], key=lambda x: x[0].get("nodename", ""))))

              print("== 4. before the change: 2m-window expressions over the prior day at 120s scrape ==")
              old = {
                  "cpu_high_usage": 'sum without(mode)(avg without(cpu)(rate(node_cpu_seconds_total{%s,mode!~"idle|iowait"}[2m])))' % NE,
                  "net_receive_errs": 'rate(node_network_receive_errs_total{%s}[2m])' % NE,
                  "net_transmit_errs": 'rate(node_network_transmit_errs_total{%s}[2m])' % NE,
              }
              for name, e in old.items():
                  rows = q("count_over_time((%s)[1d:2m])" % e, BEFORE)
                  if rows is None:
                      continue
                  vals = sorted(v for _, v in rows)
                  print("   %-18s series=%d steps_with_data min=%s max=%s of 720" % (
                      name, len(vals), "%d" % vals[0] if vals else "-", "%d" % vals[-1] if vals else "-"))

              print("== 5. new node alerts pending or firing now ==")
              rows = q('ALERTS{alertname=~"%s"}' % "|".join(NEW))
              for lab, _ in rows or []:
                  print("   %s %s %s %s" % (lab.get("alertname"), lab.get("alertstate"), lab.get("nodename", "-"), lab.get("device", "")))
              if rows == []:
                  print("   none")
              print("== END ==")
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
