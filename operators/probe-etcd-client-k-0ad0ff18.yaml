---
apiVersion: batch/v1
kind: Job
metadata:
  name: probe-etcd-client-k-0ad0ff18
  namespace: kured
  labels:
    app.kubernetes.io/name: probe-etcd-client
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: node-lifecycle
    entity: cluster
    capability: lifecycle
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: probe-etcd-client
        app.kubernetes.io/part-of: basis
        app.kubernetes.io/component: node-lifecycle
    spec:
      restartPolicy: Never
      hostPID: true
      nodeSelector:
        kubernetes.io/hostname: k-0ad0ff18
      tolerations:
        - operator: Exists
      containers:
        - name: probe-etcd-client
          image: ghcr.io/simplesalt/oci/cluster:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - nsenter
            - --target=1
            - --mount
            - --uts
            - --ipc
            - --net
            - --pid
            - --
            - bash
            - -c
            - |
              set -u
              C=/var/lib/rancher/k3s/server/tls/etcd
              echo "=== NODE ==="
              hostname
              date -u +%FT%TZ
              echo "=== TOOLS ==="
              for b in curl wget python3 openssl; do printf "%s=" "$b"; command -v "$b" || echo MISSING; done
              echo "=== CERTS ==="
              ls -l "$C" 2>&1 | head -20
              echo "=== ETCD ==="
              python3 - <<'PY'
              import ssl, urllib.request
              C = "/var/lib/rancher/k3s/server/tls/etcd"
              try:
                  ctx = ssl.create_default_context(cafile=C + "/server-ca.crt")
                  ctx.load_cert_chain(C + "/client.crt", C + "/client.key")
                  ctx.check_hostname = False
              except Exception as e:
                  print("CTX ERR", type(e).__name__, e)
                  raise SystemExit(0)
              for ip in ["127.0.0.1", "192.168.1.186", "192.168.1.105", "192.168.1.106"]:
                  for path in ["/version"]:
                      try:
                          r = urllib.request.urlopen("https://%s:2379%s" % (ip, path), context=ctx, timeout=10)
                          print(ip, path, r.read().decode().strip())
                      except Exception as e:
                          print(ip, path, "ERR", type(e).__name__, str(e)[:200])
              try:
                  req = urllib.request.Request("https://127.0.0.1:2379/v3/cluster/member/list", data=b"{}",
                                               headers={"Content-Type": "application/json"}, method="POST")
                  print("memberlist", urllib.request.urlopen(req, context=ctx, timeout=10).read().decode()[:1200])
              except Exception as e:
                  print("memberlist ERR", type(e).__name__, str(e)[:200])
              PY
              echo "=== END ==="
