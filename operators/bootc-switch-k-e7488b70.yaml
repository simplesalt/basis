apiVersion: batch/v1
kind: Job
metadata:
  name: bootc-switch-k-e7488b70
  namespace: kured
  labels:
    app.kubernetes.io/name: bootc-switch
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: node-lifecycle
    entity: cluster
    capability: lifecycle
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bootc-switch
        app.kubernetes.io/part-of: basis
        app.kubernetes.io/component: node-lifecycle
    spec:
      restartPolicy: Never
      hostPID: true
      nodeSelector:
        kubernetes.io/hostname: k-e7488b70
      tolerations:
        - operator: Exists
      containers:
        - name: bootc-switch
          image: ghcr.io/simplesalt/oci/cluster:latest
          securityContext:
            privileged: true
          command:
            - nsenter
            - --target=1
            - --mount
            - --uts
            - --ipc
            - --net
            - --pid
            - --
            - bash
            - -c
            - |
              set -euo pipefail
              bootc switch ghcr.io/simplesalt/oci/cluster:qa
              touch /var/run/reboot-required
