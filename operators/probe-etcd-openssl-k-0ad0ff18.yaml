---
apiVersion: batch/v1
kind: Job
metadata:
  name: probe-etcd-openssl-k-0ad0ff18
  namespace: kured
  labels:
    app.kubernetes.io/name: probe-etcd-openssl
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: node-lifecycle
    entity: cluster
    capability: lifecycle
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: probe-etcd-openssl
        app.kubernetes.io/part-of: basis
        app.kubernetes.io/component: node-lifecycle
    spec:
      restartPolicy: Never
      hostPID: true
      nodeSelector:
        kubernetes.io/hostname: k-0ad0ff18
      tolerations:
        - operator: Exists
      containers:
        - name: probe-etcd-openssl
          image: ghcr.io/simplesalt/oci/cluster:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - nsenter
            - --target=1
            - --mount
            - --uts
            - --ipc
            - --net
            - --pid
            - --
            - bash
            - -c
            - |
              set -u
              export PATH="/usr/sbin:/usr/bin:/sbin:/bin:$PATH"
              C=/var/lib/rancher/k3s/server/tls/etcd
              echo "=== NODE ==="
              hostname
              date -u +%FT%TZ
              echo "=== OPENSSL VERSION ==="
              openssl version
              echo "=== ALPN OFFER http/1.1 (127.0.0.1) ==="
              printf 'GET /version HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n' | timeout 10 openssl s_client -connect 127.0.0.1:2379 -cert "$C/client.crt" -key "$C/client.key" -CAfile "$C/server-ca.crt" -alpn http/1.1 -brief 2>&1 | head -60
              echo "=== NO ALPN OFFER (127.0.0.1) ==="
              printf 'GET /version HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n' | timeout 10 openssl s_client -connect 127.0.0.1:2379 -cert "$C/client.crt" -key "$C/client.key" -CAfile "$C/server-ca.crt" -brief 2>&1 | head -60
              echo "=== END ==="
