apiVersion: batch/v1
kind: Job
metadata:
  name: reboot-sentinel-set-k-e7488b70
  namespace: kured
  labels:
    app.kubernetes.io/name: reboot-sentinel-set
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: node-lifecycle
    entity: cluster
    capability: lifecycle
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reboot-sentinel-set
        app.kubernetes.io/part-of: basis
        app.kubernetes.io/component: node-lifecycle
    spec:
      restartPolicy: Never
      hostPID: true
      nodeSelector:
        kubernetes.io/hostname: k-e7488b70
      tolerations:
        - operator: Exists
      containers:
        - name: reboot-sentinel-set
          image: ghcr.io/simplesalt/oci/cluster:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - nsenter
            - --target=1
            - --mount
            - --uts
            - --ipc
            - --net
            - --pid
            - --
            - bash
            - -c
            - |
              set -euo pipefail
              if bootc status --booted --format=yaml | grep -q 'ghcr.io/simplesalt/oci/cluster:qa'; then
                echo "booted image is already qa, leaving sentinel unset"
                exit 0
              fi
              touch /var/run/reboot-required
              stat -c '%n mtime=%y' /var/run/reboot-required
