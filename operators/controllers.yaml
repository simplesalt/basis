---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: certificates
    entity: cluster
    capability: certs
spec:
  releaseName: cert-manager
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux-system
  interval: 5m
  values:
    crds:
      enabled: true
    namespace: cert-manager
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crossplane
  namespace: crossplane-system
  labels:
    app.kubernetes.io/name: crossplane
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: iac
    entity: cluster
    capability: iac
spec:
  interval: 5m
  releaseName: crossplane
  chart:
    spec:
      chart: crossplane
      sourceRef:
        kind: HelmRepository
        name: crossplane-stable
        namespace: flux-system
  values:
    provider:
      packages: []
    configuration:
      packages: []
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
  labels:
    app.kubernetes.io/name: kyverno
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: policy
    entity: cluster
    capability: governance
spec:
  interval: 5m
  releaseName: kyverno-controller
  chart:
    spec:
      chart: kyverno
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: monitoring
    entity: cluster
    env: main
    capability: observability
spec:
  releaseName: prometheus
  install:
    createNamespace: true
  chart:
    spec:
      chart: kube-prometheus-stack
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  interval: 5m
  values:
    prometheus:
      prometheusSpec:
        serviceMonitorSelectorNilUsesHelmValues: false
        honorLabels: true
        scrapeInterval: 120s
        evaluationInterval: 120s
        retention: 3d
        retentionSize: 5GB
        resources:
          requests:
            cpu: 100m
            memory: 2Gi
          limits:
            memory: 3Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi
        query:
          maxConcurrency: 8
          maxSamples: 25000000
    kubeApiServer:
      serviceMonitor:
        metricRelabelings:
        - action: drop
          sourceLabels: [__name__]
          regex: apiserver_request_duration_seconds_bucket|etcd_request_duration_seconds_bucket|apiserver_request_sli_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket|workqueue_queue_duration_seconds_bucket|workqueue_work_duration_seconds_bucket|apiserver_watch_cache_read_wait_seconds_bucket
    kubelet:
      serviceMonitor:
        cAdvisorMetricRelabelings:
        - action: drop
          sourceLabels: [__name__]
          regex: container_tasks_state|container_memory_failures_total|container_network_tcp_usage_total|container_network_udp_usage_total|container_blkio_device_usage_total|container_network_.*_errors_total|container_network_.*_dropped_total|container_spec_.*|container_file_descriptors|container_threads.*|container_processes|container_sockets|container_last_seen|container_start_time_seconds
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
    grafana:
      adminPassword: admin
      persistence:
        enabled: true
        storageClassName: local-path
        size: 10Gi
      ingress:
        enabled: false
    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: cnpg-system
  labels:
    app.kubernetes.io/name: cnpg
    app.kubernetes.io/part-of: database
    app.kubernetes.io/component: operator
    entity: cluster
    env: main
    capability: data
spec:
  releaseName: cnpg
  install:
    createNamespace: true
  chart:
    spec:
      chart: cloudnative-pg
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: flux-system
  interval: 5m
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: logging
    entity: cluster
    env: main
    capability: observability
spec:
  releaseName: fluent-bit
  install:
    createNamespace: true
  chart:
    spec:
      chart: fluent-bit
      sourceRef:
        kind: HelmRepository
        name: fluent
        namespace: flux-system
  interval: 5m
  values:
    kind: DaemonSet
    # The kubernetes_events input reads core/v1 Events, which the chart's
    # default ClusterRole (namespaces + pods only) does not cover.
    rbac:
      eventsAccess: true
    # Tailing every container log on the node is meaningfully more work than
    # reading the journal was. No CPU limit on purpose: throttling a log
    # shipper does not shed load, it just moves the backlog into memory.
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
    # Truncation and dedup used to be two Lua filters running inside Fluent
    # Bit. Fluent Bit has no Python filter plugin -- embedded scripting is
    # filter_lua or filter_wasm and nothing else -- so the logic moved out of
    # the Fluent Bit process into this sidecar. Fluent Bit keeps doing what it
    # is genuinely good at (tail with rotation and offset handling, CRI
    # decoding, Kubernetes metadata enrichment, the events watch, the cheap
    # grep prefilter) and POSTs the survivors to loopback; feed.py does the
    # editorial work, and ITS stdout is the feed.
    #
    # The move bought real verifiability. There is no Lua interpreter in the
    # environment these manifests are edited from, so both Lua filters shipped
    # without so much as a syntax check -- and the dedup signature turned out
    # to be wrong in a way no amount of reading caught: the hex rule below is
    # a rewrite of one that provably failed on the exact CNPG records it was
    # written for. feed.py ships with a unit suite that runs before deploy.
    #
    # A sidecar rather than a separate Deployment, for three reasons: it keeps
    # everything inside this one values block (so this file stays byte-identical
    # with its counterpart in the other repo), the transport is loopback with
    # no Service or cluster DNS in the path, and the sidecar's log lands at
    # /var/log/containers/fluent-bit-*_feed-*.log, which the Exclude_Path below
    # already matches -- so the amplification loop stays closed for free.
    #
    # Read the feed with get_kubernetes_logs container_name=feed. NOT
    # container_name=fluent-bit; that one is now only the shipper's own
    # service log.
    extraContainers:
      - name: feed
        image: python:3.13-alpine
        # -u is not optional. Without unbuffered stdout the records sit in a
        # libc buffer and never reach the pod log, which presents as an empty
        # feed attached to a perfectly healthy pod.
        command: ["python3", "-u", "/etc/feed/feed.py"]
        env:
          - name: PYTHONDONTWRITEBYTECODE
            value: "1"
        volumeMounts:
          # The same ConfigMap the Fluent Bit container mounts at
          # /fluent-bit/etc/conf -- config.extraFiles below places feed.py in
          # it. Reusing that ConfigMap is what makes the chart's
          # checksum/config annotation cover the Python too, so editing the
          # script triggers a rolling restart exactly like editing the
          # pipeline does. A hand-rolled ConfigMap would lose that.
          - name: config
            mountPath: /etc/feed
            readOnly: true
        # If the sidecar is not listening then the feed is down, and that
        # should surface as an unready pod rather than as Fluent Bit quietly
        # retrying into a closed port.
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
    config:
      service: |
        [SERVICE]
            Daemon Off
            Flush 1
            # error, not info: this service log shares stdout with the JSON
            # records below, so every inotify_fs_add() lands in the feed. No
            # filter can reach it -- level is the only lever.
            Log_Level error
            Parsers_File /fluent-bit/etc/parsers.conf
            Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
            HTTP_Server On
            HTTP_Listen 0.0.0.0
            HTTP_Port 2020
            Health_Check On
      inputs: |
        # Container stdout/stderr. multiline.parser cri both strips the CRI
        # envelope and rejoins partial (P) lines, so a stack trace arrives as
        # ONE record instead of forty -- which is what lets the grep filter
        # below keep the whole trace off its single "Exception" line.
        #
        # It emits the message under the key `log`. The plain
        # `[PARSER] Name cri` emits it under `message` instead. If you ever
        # swap one for the other, update every `log`-keyed filter below, or
        # the feed silently goes empty while still looking healthy.
        #
        # Exclude_Path is load-bearing, not tidiness: this pipeline's OUTPUT
        # is this pod's own stdout, which the kubelet writes straight back
        # into /var/log/containers. Tailing our own log would re-ingest every
        # record we emit, and because we keep only lines matching
        # /error|fatal|.../ the re-ingested copies match too. That is
        # unbounded amplification, not a duplicate-line annoyance. The glob is
        # deliberately namespace-agnostic so it still holds if the release's
        # targetNamespace changes.
        #
        # The feed sidecar is covered by the same glob without needing a
        # second entry: the kubelet names container log files
        # <pod>_<namespace>_<container>-<id>.log, and the sidecar shares this
        # pod, so its file is fluent-bit-<suffix>_<ns>_feed-<id>.log. That is
        # the whole reason the sidecar lives in this pod rather than in a
        # Deployment of its own -- a separate pod would need its own exclusion
        # here, and forgetting it would be the amplification bug again.
        [INPUT]
            Name              tail
            Alias             container_logs
            Tag               kube.*
            Path              /var/log/containers/*.log
            Exclude_Path      /var/log/containers/fluent-bit-*.log
            multiline.parser  cri
            Skip_Long_Lines   On
            Refresh_Interval  10
            Mem_Buf_Limit     16MB
            DB                /var/log/flb-container.db

        # Crashes are the case container logs help with least: OOMKilled,
        # CrashLoopBackOff, FailedScheduling and image-pull failures produce
        # no application log line at all, and the pod whose log you would want
        # is usually already gone. Events carry those reasons.
        [INPUT]
            Name              kubernetes_events
            Alias             warning_events
            Tag               k8sevent
      filters: |
        # Merge_Log is deliberately Off. With it On, a JSON-logging app has
        # its fields lifted to the record root and the `log` key is dropped --
        # so the grep below, which keys on `log`, would discard exactly those
        # apps' errors while quietly keeping everyone else's.
        [FILTER]
            Name                kubernetes
            Match               kube.*
            Merge_Log           Off
            Labels              Off
            Annotations         Off
            K8S-Logging.Parser  Off
            K8S-Logging.Exclude On

        # This regex is the entire editorial policy of the feed: widen it and
        # the feed drowns, narrow it and real failures go missing. A pod can
        # opt out of collection entirely with the annotation
        # fluentbit.io/exclude: "true" (K8S-Logging.Exclude, above).
        [FILTER]
            Name    grep
            Match   kube.*
            Regex   log (?i)\b(errors?|fatal|panic|critical|exception|traceback|segfault|oomkilled|failed|failure)\b

        [FILTER]
            Name         nest
            Match        kube.*
            Operation    lift
            Nested_under kubernetes
            Add_prefix   k8s_

        # Trim hard. The previous config put whole records on stdout and the
        # result overflowed get_kubernetes_logs' token limit within minutes,
        # which is a way of being unreadable that looks like working.
        [FILTER]
            Name          record_modifier
            Match         kube.*
            Allowlist_key k8s_namespace_name
            Allowlist_key k8s_pod_name
            Allowlist_key k8s_container_name
            Allowlist_key stream
            Allowlist_key log

        [FILTER]
            Name    grep
            Match   k8sevent
            Regex   type Warning

        # DNSConfigForming fires on essentially every pod on this node (three
        # upstream nameservers configured, kubelet keeps two) and is already
        # at count 7000+ and climbing. It is a permanent property of the
        # node's resolv.conf, not an incident, and it was the single largest
        # source of event volume in the feed.
        [FILTER]
            Name    grep
            Match   k8sevent
            Exclude reason DNSConfigForming

        [FILTER]
            Name         nest
            Match        k8sevent
            Operation    lift
            Nested_under involvedObject
            Add_prefix   obj_

        [FILTER]
            Name          record_modifier
            Match         k8sevent
            Allowlist_key obj_namespace
            Allowlist_key obj_kind
            Allowlist_key obj_name
            Allowlist_key reason
            Allowlist_key message
            Allowlist_key count

        # Truncation and dedup used to sit here as two Lua filters. They now
        # run in the feed sidecar instead; see extraContainers above. The
        # ordering constraint that mattered still holds and is now structural
        # rather than a matter of filter order: the greps above run against
        # the full untruncated text, so a long record whose only error keyword
        # sits past byte 600 is still trimmed rather than silently dropped.
      outputs: |
        # A single pod's stdout IS the delivery mechanism here, not a
        # placeholder -- it is the one shape mcp-flux's get_kubernetes_logs
        # can read, since that tool fetches one named pod, so "which pod?"
        # has to stop being a question you need answered before you can look.
        # What changed is only which container's stdout: records go over
        # loopback to the feed sidecar, which prints the survivors.
        #
        # Retention is therefore still only whatever kubelet log rotation
        # gives. A durable backend is deliberate follow-on work, not part of
        # this.
        #
        # Retry_Limit is bounded on purpose. The sidecar starts in about a
        # second while Fluent Bit's first flush is at one second, so a couple
        # of early retries are expected; unbounded retries would instead let a
        # persistently wedged sidecar back pressure into Mem_Buf_Limit and
        # stall the tail.
        [OUTPUT]
            Name             http
            Match            *
            Host             127.0.0.1
            Port             8080
            URI              /
            Format           json_lines
            json_date_key    time
            json_date_format iso8601
            Retry_Limit      10
      # config.extraFiles writes arbitrary key/value pairs as files into the
      # same ConfigMap as the pipeline above, mounted at /fluent-bit/etc/conf
      # in the Fluent Bit container and at /etc/feed in the sidecar. Fluent
      # Bit itself never reads feed.py -- it only ever opens the files its
      # own config names -- so parking it here is free, and it is what makes
      # checksum/config cover the script.
      #
      # This block is the single source of truth for the script. The test
      # suite that guards it extracts it from this YAML rather than keeping
      # its own copy, so the tests can never drift from what is deployed:
      #   yq '.spec.values.config.extraFiles."feed.py"' controllers.yaml
      #
      # CNPG is the workload that forced both halves of this. It wraps every
      # postgres ERROR in a JSON record embedding the entire offending SQL
      # statement -- one measured 4494 bytes, and fifty of them overflowed
      # get_kubernetes_logs outright -- and it stamps a per-record hex
      # session_id that made naive dedup signatures never match. The
      # identifying part (error_severity, sql_state_code, message) is always
      # near the front; the tail is query text nobody reads from a log feed.
      #
      # The dedup half is deliberately lossy. Occurrences 2..N inside a
      # window are DROPPED, not buffered: the next emission of that signature
      # carries a `suppressed` count instead. If you need every occurrence of
      # something, read that pod's own log directly -- this feed is a triage
      # surface, not an audit trail. Before it existed, one cal pod repeating
      # the same CLIENT_FETCH_ERROR every 5s was ~85% of all records, so the
      # feed was technically complete and practically unreadable.
      extraFiles:
        feed.py: |
          #!/usr/bin/env python3
          """feed.py -- HTTP sink for Fluent Bit that ports two former Lua filters:

              1. truncate  -- clip oversized "log"/"message" fields so one runaway
                               record can't blow out the pod log.
              2. dedup      -- collapse bursts of near-identical records within a
                               rolling window, the same way the old Lua filter did.

          Fluent Bit POSTs batches of records here (its http output plugin can be
          configured to send either JSON-lines or a single JSON array -- we accept
          both). Surviving records are printed to stdout as compact JSON lines.
          stdout IS the product: it becomes a Kubernetes pod log that an MCP tool
          reads, so formatting and flushing discipline matter more than they would
          in an ordinary service.

          STDLIB ONLY -- this must run unmodified on the bare python:3.13-alpine
          image, no pip install step.
          """

          import json
          import os
          import re
          import signal
          import sys
          import threading
          import time
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          # --------------------------------------------------------------------------
          # Configuration (env-overridable, matching the knobs the Lua filter exposed)
          # --------------------------------------------------------------------------

          WINDOW = int(os.environ.get("FEED_WINDOW", "60"))
          MAX_KEYS = int(os.environ.get("FEED_MAX_KEYS", "5000"))
          PORT = int(os.environ.get("FEED_PORT", "8080"))

          # SIG_RAW_CAP bounds the regex passes in _normalize() against a runaway raw
          # input -- a CPU guard only, not a signature boundary -- and it has to sit
          # far past any signature-relevant cut so it never actually performs one. See
          # the comment inside _normalize() for why that distinction matters. SIG_CAP
          # is the real, signature-relevant limit: how much of the *normalized* text
          # actually enters the dedup key. It has to reach far enough into the record
          # to still catch discriminating content that lands well past the front --
          # CloudNativePG's own "message" field starts around raw char ~505 -- which
          # is why it is 600, not the tighter 400 an earlier version used (that
          # earlier, smaller window is exactly what let two different CNPG errors
          # collapse into one signature and silently drop one of them).
          SIG_RAW_CAP = 4000
          SIG_CAP = 600

          # Indirection so tests can inject a fake clock without patching the stdlib.
          # time.monotonic() is deliberate, not time.time(): this is a rate limiter,
          # not an audit trail, and must not be fooled (or made to hang forever) by
          # an NTP step or a container clock jump. The record's own timestamp is
          # untrusted input and is never used for window math.
          _now = time.monotonic

          # Precompiled once at import time -- these run on every record, on the hot
          # path of every batch POST.
          #
          # Identifier-ish tokens have to be collapsed BEFORE digit runs are, and the
          # rule has to work on whole alphanumeric tokens rather than on raw character
          # runs. CloudNativePG stamps a hex session_id into every record, and two
          # records a second apart look like:
          #
          #     6a845d2d.4808e     6a845cf1.4806f
          #
          # A digits-only pass leaves those distinct (they differ in non-digit
          # positions). A "6-or-more hex characters" pass is also not enough: the
          # second component is only five characters, so it survives to the digit
          # pass, which eats "4808" and leaves a bare "e" vs "f" -- still distinct,
          # and the duplicate still leaks into the feed.
          #
          # So: collapse a whole alphanumeric token when it is entirely hex AND
          # either contains a digit (>=4 chars) or is long enough to be a hash on
          # its own (>=6 chars). Requiring a digit at the short end is what keeps
          # ordinary English words out of it -- "cafe" and "dead" are hex-only but
          # carry no digit, so they survive. Over-collapsing is the dangerous
          # direction here (it would merge two genuinely different errors into one
          # signature and drop one of them), which is why the short rule is the
          # narrow one.
          #
          # Just as important as the collapsing rule itself is WHEN it runs relative
          # to any length cut: it has to happen before any cut that can land inside
          # signature-relevant content, never after. A cut taken on raw text (before
          # collapsing) sits at a fixed raw offset, but two records with the same
          # shape can carry digit runs of different LENGTHS upstream of that offset
          # (e.g. a timestamp's fractional-second digits, or the hex session_id this
          # comment is about) -- so the same raw offset lands at a different point in
          # each record's actual content. That is what let two different CloudNativePG
          # errors collapse into one signature and silently drop one of them: the
          # raw cut fell before the record's discriminating "message" field, so
          # neither record's signature ever saw it. Collapsing first removes that
          # jitter, so any cut taken afterward (see SIG_CAP / _normalize()) lands at
          # an equivalent point across records instead of an arbitrary raw offset.
          _TOKEN_RE = re.compile(r"[0-9A-Za-z]+")
          _DIGIT_RE = re.compile(r"\d+")
          _HEX_CHARS = frozenset("0123456789abcdefABCDEF")
          _DIGITS = frozenset("0123456789")


          def _collapse_token(match):
              token = match.group(0)
              if len(token) >= 4 and _HEX_CHARS.issuperset(token):
                  if len(token) >= 6 or not _DIGITS.isdisjoint(token):
                      return "#"
              return token

          # signature -> {"last": <monotonic float>, "count": <int>}
          # Module-level and shared across requests/threads by design -- dedup state
          # has to survive across the life of the process, not just one batch.
          _state = {}
          _lock = threading.Lock()


          def truncate(record):
              """Clip "log"/"message" to 600 chars in place. No other keys touched.

              Must run on a record AFTER dedup(record) has already computed its
              signature from the untruncated text -- see the do_POST loop. dedup()
              only reads "log"/"message" (via signature()/_normalize()) and writes
              "suppressed", so it can never observe this function's edits either
              way; the ordering constraint is one-directional, purely about not
              feeding dedup() text this function has already clipped.
              """
              for key in ("log", "message"):
                  value = record.get(key)
                  if isinstance(value, str) and len(value) > 600:
                      record[key] = value[:600] + " ...[truncated]"


          def _normalize(text):
              if not isinstance(text, str):
                  # Defensive: record.get("log") can be a non-string JSON value
                  # (number, bool, ...) if upstream sends something odd. The Lua
                  # filter only ever saw strings; str() is the closest equivalent
                  # of Lua's implicit tostring() coercion and keeps signature() from
                  # blowing up on a slice of a non-string.
                  text = str(text)
              # Order matters here, and it is the entire fix for the two bugs this
              # function used to have:
              #
              #   1. Cut raw text at SIG_RAW_CAP -- a CPU guard only. It sits at 4000,
              #      far past SIG_CAP (600) and past any realistic signature-relevant
              #      content, specifically so it can never be the cut that actually
              #      shapes a signature. Slicing here, on raw text, before collapsing
              #      is safe ONLY because it is that far out.
              #   2. Collapse identifier-ish tokens (hex/session-id shaped) and THEN
              #      digit runs, on the (still effectively full-length) text. This is
              #      what removes upstream length jitter -- e.g. a timestamp's
              #      fractional-second digit run being 8 digits in one record and 9 in
              #      another -- before any signature-relevant cut happens, so that
              #      jitter can't shift where the cut below lands.
              #   3. THEN cut the collapsed text at SIG_CAP (600). This is the cut
              #      that actually determines what enters the signature, and doing it
              #      after collapsing is what lets it reach CloudNativePG's own
              #      "message" field (raw char ~505) reliably across records instead
              #      of at an offset that drifts with upstream jitter.
              #
              # The previous version cut raw text at 400 chars BEFORE collapsing --
              # both wrong for the same underlying reason. It made the signature
              # sensitive to raw-offset jitter (bug 1: near-duplicates that differ
              # only in digit-run length got different signatures), and because 400
              # raw chars falls short of where "message" starts, it also cut that
              # field out of the signature entirely for some records -- collapsing two
              # genuinely different CNPG errors into one signature and silently
              # dropping one of them (bug 2, the more serious one).
              text = text[:SIG_RAW_CAP]
              text = _TOKEN_RE.sub(_collapse_token, text)
              text = _DIGIT_RE.sub("#", text)
              return text[:SIG_CAP]


          def signature(record):
              """Build the dedup key for a record, matching the Lua filter exactly."""
              # `or` here is deliberately Lua-style falsy-or, not "prefer log if
              # present": an empty string or JSON null in "log" falls through to
              # "message", same as the original filter.
              text = record.get("log") or record.get("message") or ""
              src = record.get("k8s_pod_name") or record.get("obj_name") or "?"
              normalized = _normalize(text)
              return src + "\0" + str(record.get("reason") or "") + "\0" + normalized


          def dedup(record, now=None):
              """Return True if the record should be emitted, False if it's a dup.

              Mutates `record` to add a "suppressed" count when a run of dupes ends.
              Uses module-level _state; callers that need isolation (tests) should
              reset feed._state between cases.
              """
              if now is None:
                  now = _now()

              key = signature(record)
              entry = _state.get(key)

              if entry is not None and (now - entry["last"]) < WINDOW:
                  # Still inside the window opened by the last *emitted* record.
                  # Note we do NOT touch entry["last"] here -- the window is fixed
                  # from the first emit, not a sliding/refreshing window. A steady
                  # 1/sec stream of the same signature therefore emits at t=0 and
                  # again at t=60, not "never" (which is what a sliding window,
                  # continuously refreshed by every dropped duplicate, would do).
                  entry["count"] += 1
                  return False

              if entry is not None and entry["count"] > 0:
                  # The window just closed on a run of suppressed dupes -- surface
                  # how many were dropped so the emitted record carries that context.
                  record["suppressed"] = entry["count"]

              if entry is None:
                  if len(_state) >= MAX_KEYS:
                      # Whole-table clear, not LRU eviction. Cheap to implement and
                      # correctness-safe: the failure mode is one extra emitted
                      # record per still-live signature (each has to re-open its
                      # window), never a false drop. Silently discarding a record
                      # that should have been emitted is the failure mode this
                      # filter exists to avoid, so we bias hard away from it even
                      # at the cost of a duplicate flood right after a clear.
                      _state.clear()

              _state[key] = {"last": now, "count": 0}
              return True


          # --------------------------------------------------------------------------
          # HTTP layer
          # --------------------------------------------------------------------------


          def _parse_body(body):
              """Parse a POST body into a list of dict records.

              Accepts either a single JSON array of objects, or JSON-lines (one
              object per line, blank lines ignored). A line/entry that isn't valid
              JSON, or isn't a JSON object, is skipped silently -- Fluent Bit will
              keep sending batches and one bad record must never take the rest of
              the batch down with it. Raises only when the body can't even be
              decoded as UTF-8, which is the one case the caller treats as a real
              400 (the whole body is unreadable, not just one record in it).
              """
              text = body.decode("utf-8")
              text = text.strip()
              if not text:
                  return []

              if text[0] == "[":
                  try:
                      parsed = json.loads(text)
                  except ValueError:
                      parsed = None
                  if isinstance(parsed, list):
                      return [r for r in parsed if isinstance(r, dict)]
                  # Fall through to line-by-line parsing below -- e.g. a body that
                  # merely starts with "[" but is actually malformed. Best-effort
                  # recovery rather than a hard failure, consistent with "skip bad
                  # lines, don't crash".

              records = []
              for line in text.splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      obj = json.loads(line)
                  except ValueError:
                      continue
                  if isinstance(obj, dict):
                      records.append(obj)
              return records


          class Handler(BaseHTTPRequestHandler):
              # BaseHTTPRequestHandler defaults to HTTP/1.0, which closes the socket
              # after every response. Fluent Bit's http output keeps connections alive
              # by default, so speaking 1.1 (with an explicit Content-Length, or the
              # client can't tell where the empty body ends) avoids reconnecting on
              # every one-second flush.
              protocol_version = "HTTP/1.1"

              # BaseHTTPRequestHandler logs one line per request to stderr by
              # default. At Fluent Bit's flush cadence that's pure noise next to the
              # actual record stream, so silence it entirely.
              def log_message(self, format, *args):  # noqa: A002 (stdlib signature)
                  pass

              def do_POST(self):
                  try:
                      try:
                          length = int(self.headers.get("Content-Length") or 0)
                      except ValueError:
                          length = 0
                      body = self.rfile.read(length) if length > 0 else b""

                      try:
                          records = _parse_body(body)
                      except UnicodeDecodeError:
                          self._respond(400)
                          return

                      with _lock:
                          for record in records:
                              if not isinstance(record, dict):
                                  continue
                              # dedup() BEFORE truncate() is deliberate, not
                              # incidental: dedup() computes its signature from
                              # "log"/"message" via _normalize(), and that signature
                              # must see the untruncated text so its own SIG_CAP cut
                              # (600 chars of *normalized* text -- see _normalize())
                              # is the only length cut that shapes it. Truncating
                              # first would reintroduce a raw-offset cut ahead of
                              # normalization, the same class of bug _normalize()
                              # itself was fixed to avoid. This ordering is safe
                              # because the two functions don't interfere: dedup()
                              # only reads "log"/"message" and writes "suppressed";
                              # truncate() only rewrites "log"/"message". A record
                              # dedup() drops here is never truncated -- there is no
                              # point clipping text that will never be emitted.
                              if dedup(record):
                                  truncate(record)
                                  sys.stdout.write(
                                      json.dumps(record, separators=(",", ":"), ensure_ascii=False)
                                  )
                                  sys.stdout.write("\n")
                          # Flush once per batch, inside the lock, so a slow flush
                          # can't interleave with another thread's batch. This is
                          # the single most important line in the file: unflushed
                          # stdout never reaches the pod log, full stop.
                          sys.stdout.flush()

                      self._respond(200)
                  except Exception as exc:  # noqa: BLE001 -- must never kill the server
                      print(f"feed: unexpected error handling request: {exc!r}", file=sys.stderr)
                      try:
                          self._respond(500)
                      except Exception:
                          # Connection may already be broken; nothing more to do.
                          pass

              def _respond(self, code):
                  # Under HTTP/1.1 keep-alive, a response with no Content-Length and
                  # no Transfer-Encoding is ambiguous: the client can't tell where
                  # the (empty) body ends short of the connection closing, so it
                  # blocks forever waiting for bytes that never come on a connection
                  # we intend to keep open. Always claim the length explicitly, even
                  # though it's always zero -- this is what actually makes keep-alive
                  # safe to reuse for Fluent Bit's next flush.
                  self.send_response(code)
                  self.send_header("Content-Length", "0")
                  self.end_headers()


          def _serve():
              # Pin stdout to UTF-8 with lossy fallback. Log lines carry arbitrary
              # application bytes, and the default encoding is locale-derived -- on a
              # bare container image with no LANG set that is not guaranteed to be
              # UTF-8. A UnicodeEncodeError here would raise inside the request
              # handler, return 500, and make Fluent Bit retry the identical bad
              # record forever, so the feed would wedge on a single stray character.
              # errors="replace" degrades one glyph instead.
              sys.stdout.reconfigure(encoding="utf-8", errors="replace")

              server = ThreadingHTTPServer(("0.0.0.0", PORT), Handler)

              def _handle_sigterm(signum, frame):
                  # Flush whatever's pending before we start tearing down, then stop
                  # accepting/serving. shutdown() blocks until serve_forever's loop
                  # notices, so run it off the signal-handling thread.
                  sys.stdout.flush()
                  threading.Thread(target=server.shutdown, daemon=True).start()

              signal.signal(signal.SIGTERM, _handle_sigterm)

              try:
                  server.serve_forever()
              finally:
                  server.server_close()
                  sys.stdout.flush()


          if __name__ == "__main__":
              _serve()
    tolerations:
      - effect: NoSchedule
        operator: Exists
    # The chart's default daemonSetVolumes/daemonSetVolumeMounts already mount
    # hostPath /var/log read-write, which is all this pipeline needs:
    # /var/log/containers/*.log are symlinks into /var/log/pods, and the tail
    # DB above needs the write. There was previously a `volumeMounts:`
    # override here; it was inert. Chart 0.58.1's pod template reads
    # daemonSetVolumeMounts / extraVolumeMounts and never .Values.volumeMounts,
    # so the /run/systemd mount it declared was never actually applied -- do
    # not reintroduce that key expecting it to do something.
