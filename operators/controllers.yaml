---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: certificates
    entity: cluster
    capability: certs
spec:
  releaseName: cert-manager
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.2"
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux-system
  interval: 5m
  values:
    crds:
      enabled: true
    namespace: cert-manager
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
  labels:
    app.kubernetes.io/name: kyverno
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: policy
    entity: cluster
    capability: governance
spec:
  interval: 5m
  releaseName: kyverno-controller
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - ""
        target:
          group: coordination.k8s.io
          kind: Lease
  chart:
    spec:
      chart: kyverno
      version: "3.9.1"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  values:
    backgroundController:
      enabled: false
    reportsController:
      enabled: false
    features:
      admissionReports:
        enabled: false
      logging:
        format: json
        verbosity: 0
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: monitoring
    entity: cluster
    env: main
    capability: observability
spec:
  releaseName: prometheus
  install:
    createNamespace: true
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "91.8.2"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  interval: 5m
  values:
    prometheus:
      prometheusSpec:
        podMetadata:
          annotations:
            resiliency.simplesalt.company/storage-tier: blips-are-ok
        serviceMonitorSelectorNilUsesHelmValues: false
        honorLabels: true
        scrapeInterval: 120s
        evaluationInterval: 120s
        retention: 3d
        retentionSize: 5GB
        resources:
          requests:
            cpu: 100m
            memory: 2Gi
          limits:
            memory: 3Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 8Gi
        query:
          maxConcurrency: 8
          maxSamples: 25000000
    kubeApiServer:
      serviceMonitor:
        metricRelabelings:
        - action: drop
          sourceLabels: [__name__]
          regex: apiserver_request_duration_seconds_bucket|etcd_request_duration_seconds_bucket|apiserver_request_sli_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket|workqueue_queue_duration_seconds_bucket|workqueue_work_duration_seconds_bucket|apiserver_watch_cache_read_wait_seconds_bucket
    kubelet:
      serviceMonitor:
        cAdvisorMetricRelabelings:
        - action: drop
          sourceLabels: [__name__]
          regex: container_tasks_state|container_memory_failures_total|container_network_tcp_usage_total|container_network_udp_usage_total|container_blkio_device_usage_total|container_network_.*_errors_total|container_network_.*_dropped_total|container_spec_.*|container_file_descriptors|container_threads.*|container_processes|container_sockets|container_last_seen|container_start_time_seconds
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
    grafana:
      enabled: false
    defaultRules:
      disabled:
        NodeDiskIOSaturation: true
        NodeMemoryHighUtilization: true
        NodeMemoryMajorPagesFaults: true
        NodeSystemSaturation: true
        NodeCPUHighUsage: true
        NodeSystemdServiceFailed: true
        NodeSystemdServiceCrashlooping: true
        # No RAID arrays or bonded interfaces on this cluster, so node_md_*
        # and node_bonding_* never exist and these never have data.
        NodeRAIDDegraded: true
        NodeRAIDDiskFailure: true
        NodeBondingDegraded: true
        # k3s does not export the kubelet_certificate_manager_* and
        # *_renew_errors metrics these read. Certificate expiry is covered by
        # NodeCertificateExpiresSoon/Imminently in platform/node-alerts.yaml
        # (k3s_certificate_expiration_seconds). Each key disables both the
        # warning and the critical rule of that name.
        KubeletClientCertificateExpiration: true
        KubeletServerCertificateExpiration: true
        KubeletClientCertificateRenewalErrors: true
        KubeletServerCertificateRenewalErrors: true
    customRules:
      KubeNodePressure:
        severity: warning
      KubeNodeEviction:
        severity: warning
    prometheus-node-exporter:
      prometheus:
        monitor:
          interval: 30s
    alertmanager:
      alertmanagerSpec:
        podMetadata:
          annotations:
            resiliency.simplesalt.company/storage-tier: blips-are-ok
        storage:
          emptyDir: {}
      # Log every firing and resolved alert (platform/alert-logger.yaml
      # prints one JSON line per alert; fluent-bit ships it to the logs
      # database). Only route and receivers are set here: Helm deep-merges
      # maps, so the chart's default global, inhibit_rules and templates keep
      # applying unchanged. The chart's route.routes list is replaced by the
      # one below, which carries its Watchdog entry forward.
      config:
        route:
          receiver: alert-logger
          # One group per alert (every label), so each alert is logged once
          # when it fires, once when it resolves, and again every
          # repeat_interval while it keeps firing -- never re-logged just
          # because a different alert joined or left a shared group.
          group_by: ["..."]
          group_wait: 30s
          group_interval: 2m
          repeat_interval: 4h
          routes:
            - receiver: "null"
              matchers:
                - alertname =~ "Watchdog|InfoInhibitor"
        receivers:
          - name: "null"
          - name: alert-logger
            webhook_configs:
              - url: http://alert-logger.cluster-main-observability.svc.cluster.local:8080/alerts
                send_resolved: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: cnpg-system
  labels:
    app.kubernetes.io/name: cnpg
    app.kubernetes.io/part-of: database
    app.kubernetes.io/component: operator
    entity: cluster
    env: main
    capability: data
spec:
  releaseName: cnpg
  install:
    createNamespace: true
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.29.1"
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: flux-system
  interval: 5m
  values:
    monitoringQueriesConfigMap:
      queries: |
        backends:
          query: |
            SELECT sa.datname
              , sa.usename
              , sa.application_name
              , states.state
              , COALESCE(sa.count, 0) AS total
              , COALESCE(sa.max_tx_secs, 0) AS max_tx_duration_seconds
            FROM ( VALUES ('active')
              , ('idle')
              , ('idle in transaction')
              , ('idle in transaction (aborted)')
              , ('fastpath function call')
              , ('disabled')
              ) AS states(state)
            LEFT JOIN (
              SELECT datname
                , state
                , usename
                , COALESCE(application_name, '') AS application_name
                , pg_catalog.count(*)
                , COALESCE(EXTRACT (EPOCH FROM (pg_catalog.max(pg_catalog.now() OPERATOR(pg_catalog.-) xact_start))), 0) AS max_tx_secs
              FROM pg_catalog.pg_stat_activity
              GROUP BY datname, state, usename, application_name
            ) sa ON states.state OPERATOR(pg_catalog.=) sa.state
            WHERE sa.usename IS NOT NULL
          metrics:
            - datname:
                usage: "LABEL"
                description: "Name of the database"
            - usename:
                usage: "LABEL"
                description: "Name of the user"
            - application_name:
                usage: "LABEL"
                description: "Name of the application"
            - state:
                usage: "LABEL"
                description: "State of the backend"
            - total:
                usage: "GAUGE"
                description: "Number of backends"
            - max_tx_duration_seconds:
                usage: "GAUGE"
                description: "Maximum duration of a transaction in seconds"

        backends_waiting:
          query: |
            SELECT pg_catalog.count(*) AS total
            FROM pg_catalog.pg_locks blocked_locks
            JOIN pg_catalog.pg_locks blocking_locks
              ON blocking_locks.locktype OPERATOR(pg_catalog.=) blocked_locks.locktype
              AND blocking_locks.database IS NOT DISTINCT FROM blocked_locks.database
              AND blocking_locks.relation IS NOT DISTINCT FROM blocked_locks.relation
              AND blocking_locks.page IS NOT DISTINCT FROM blocked_locks.page
              AND blocking_locks.tuple IS NOT DISTINCT FROM blocked_locks.tuple
              AND blocking_locks.virtualxid IS NOT DISTINCT FROM blocked_locks.virtualxid
              AND blocking_locks.transactionid IS NOT DISTINCT FROM blocked_locks.transactionid
              AND blocking_locks.classid IS NOT DISTINCT FROM blocked_locks.classid
              AND blocking_locks.objid IS NOT DISTINCT FROM blocked_locks.objid
              AND blocking_locks.objsubid IS NOT DISTINCT FROM blocked_locks.objsubid
              AND blocking_locks.pid OPERATOR(pg_catalog.<>) blocked_locks.pid
            JOIN pg_catalog.pg_stat_activity blocking_activity ON blocking_activity.pid OPERATOR(pg_catalog.=) blocking_locks.pid
            WHERE NOT blocked_locks.granted
          metrics:
            - total:
                usage: "GAUGE"
                description: "Total number of backends that are currently waiting on other queries"

        pg_database:
          query: |
            SELECT datname
              , pg_catalog.pg_database_size(datname) AS size_bytes
              , pg_catalog.age(datfrozenxid) AS xid_age
              , pg_catalog.mxid_age(datminmxid) AS mxid_age
            FROM pg_catalog.pg_database
            WHERE datallowconn
          metrics:
            - datname:
                usage: "LABEL"
                description: "Name of the database"
            - size_bytes:
                usage: "GAUGE"
                description: "Disk space used by the database"
            - xid_age:
                usage: "GAUGE"
                description: "Number of transactions from the frozen XID to the current one"
            - mxid_age:
                usage: "GAUGE"
                description: "Number of multiple transactions (Multixact) from the frozen XID to the current one"

        pg_postmaster:
          query: |
            SELECT EXTRACT(EPOCH FROM pg_postmaster_start_time) AS start_time
            FROM pg_catalog.pg_postmaster_start_time()
          metrics:
            - start_time:
                usage: "GAUGE"
                description: "Time at which postgres started (based on epoch)"

        pg_replication:
          query: |
            SELECT CASE WHEN (
                NOT pg_catalog.pg_is_in_recovery()
                OR pg_catalog.pg_last_wal_receive_lsn() OPERATOR(pg_catalog.=) pg_catalog.pg_last_wal_replay_lsn())
              THEN 0
              ELSE GREATEST (0,
                EXTRACT(EPOCH FROM (pg_catalog.now() OPERATOR(pg_catalog.-) pg_catalog.pg_last_xact_replay_timestamp())))
              END AS lag,
              pg_catalog.pg_is_in_recovery() AS in_recovery,
              EXISTS (TABLE pg_catalog.pg_stat_wal_receiver) AS is_wal_receiver_up,
              (SELECT pg_catalog.count(*) FROM pg_catalog.pg_stat_replication) AS streaming_replicas
          metrics:
            - lag:
                usage: "GAUGE"
                description: "Replication lag behind primary in seconds"
            - in_recovery:
                usage: "GAUGE"
                description: "Whether the instance is in recovery"
            - is_wal_receiver_up:
                usage: "GAUGE"
                description: "Whether the instance wal_receiver is up"
            - streaming_replicas:
                usage: "GAUGE"
                description: "Number of streaming replicas connected to the instance"

        pg_replication_slots:
          query: |
            SELECT slot_name,
              slot_type,
              database,
              active,
              (CASE pg_catalog.pg_is_in_recovery()
                WHEN TRUE THEN pg_catalog.pg_wal_lsn_diff(pg_catalog.pg_last_wal_receive_lsn(), restart_lsn)
                ELSE pg_catalog.pg_wal_lsn_diff(pg_catalog.pg_current_wal_lsn(), restart_lsn)
              END) as pg_wal_lsn_diff
            FROM pg_catalog.pg_replication_slots
            WHERE NOT temporary
          metrics:
            - slot_name:
                usage: "LABEL"
                description: "Name of the replication slot"
            - slot_type:
                usage: "LABEL"
                description: "Type of the replication slot"
            - database:
                usage: "LABEL"
                description: "Name of the database"
            - active:
                usage: "GAUGE"
                description: "Flag indicating whether the slot is active"
            - pg_wal_lsn_diff:
                usage: "GAUGE"
                description: "Replication lag in bytes"

        pg_stat_archiver:
          query: |
            SELECT archived_count
              , failed_count
              , COALESCE(EXTRACT(EPOCH FROM (pg_catalog.now() OPERATOR(pg_catalog.-) last_archived_time)), -1) AS seconds_since_last_archival
              , COALESCE(EXTRACT(EPOCH FROM (pg_catalog.now() OPERATOR(pg_catalog.-) last_failed_time)), -1) AS seconds_since_last_failure
              , COALESCE(EXTRACT(EPOCH FROM last_archived_time), -1) AS last_archived_time
              , COALESCE(EXTRACT(EPOCH FROM last_failed_time), -1) AS last_failed_time
              , COALESCE(CAST(CAST('x' OPERATOR(pg_catalog.||) pg_catalog.right(pg_catalog.split_part(last_archived_wal, '.', 1), 16) AS pg_catalog.bit(64)) AS pg_catalog.int8), -1) AS last_archived_wal_start_lsn
              , COALESCE(CAST(CAST('x' OPERATOR(pg_catalog.||) pg_catalog.right(pg_catalog.split_part(last_failed_wal, '.', 1), 16) AS pg_catalog.bit(64)) AS pg_catalog.int8), -1) AS last_failed_wal_start_lsn
              , EXTRACT(EPOCH FROM stats_reset) AS stats_reset_time
            FROM pg_catalog.pg_stat_archiver
          predicate_query: |
            SELECT NOT pg_catalog.pg_is_in_recovery()
              OR pg_catalog.current_setting('archive_mode') OPERATOR(pg_catalog.=) 'always'
          metrics:
            - archived_count:
                usage: "COUNTER"
                description: "Number of WAL files that have been successfully archived"
            - failed_count:
                usage: "COUNTER"
                description: "Number of failed attempts for archiving WAL files"
            - seconds_since_last_archival:
                usage: "GAUGE"
                description: "Seconds since the last successful archival operation"
            - seconds_since_last_failure:
                usage: "GAUGE"
                description: "Seconds since the last failed archival operation"
            - last_archived_time:
                usage: "GAUGE"
                description: "Epoch of the last time WAL archiving succeeded"
            - last_failed_time:
                usage: "GAUGE"
                description: "Epoch of the last time WAL archiving failed"
            - last_archived_wal_start_lsn:
                usage: "GAUGE"
                description: "Archived WAL start LSN"
            - last_failed_wal_start_lsn:
                usage: "GAUGE"
                description: "Last failed WAL LSN"
            - stats_reset_time:
                usage: "GAUGE"
                description: "Time at which these statistics were last reset"

        pg_stat_bgwriter:
          runonserver: "<17.0.0"
          query: |
            SELECT checkpoints_timed
              , checkpoints_req
              , checkpoint_write_time
              , checkpoint_sync_time
              , buffers_checkpoint
              , buffers_clean
              , maxwritten_clean
              , buffers_backend
              , buffers_backend_fsync
              , buffers_alloc
            FROM pg_catalog.pg_stat_bgwriter
          metrics:
            - checkpoints_timed:
                usage: "COUNTER"
                description: "Number of scheduled checkpoints that have been performed"
            - checkpoints_req:
                usage: "COUNTER"
                description: "Number of requested checkpoints that have been performed"
            - checkpoint_write_time:
                usage: "COUNTER"
                description: "Total amount of time that has been spent in the portion of checkpoint processing where files are written to disk, in milliseconds"
            - checkpoint_sync_time:
                usage: "COUNTER"
                description: "Total amount of time that has been spent in the portion of checkpoint processing where files are synchronized to disk, in milliseconds"
            - buffers_checkpoint:
                usage: "COUNTER"
                description: "Number of buffers written during checkpoints"
            - buffers_clean:
                usage: "COUNTER"
                description: "Number of buffers written by the background writer"
            - maxwritten_clean:
                usage: "COUNTER"
                description: "Number of times the background writer stopped a cleaning scan because it had written too many buffers"
            - buffers_backend:
                usage: "COUNTER"
                description: "Number of buffers written directly by a backend"
            - buffers_backend_fsync:
                usage: "COUNTER"
                description: "Number of times a backend had to execute its own fsync call (normally the background writer handles those even when the backend does its own write)"
            - buffers_alloc:
                usage: "COUNTER"
                description: "Number of buffers allocated"

        pg_stat_bgwriter_17:
          runonserver: ">=17.0.0"
          name: pg_stat_bgwriter
          query: |
            SELECT buffers_clean
              , maxwritten_clean
              , buffers_alloc
              , EXTRACT(EPOCH FROM stats_reset) AS stats_reset_time
            FROM pg_catalog.pg_stat_bgwriter
          metrics:
            - buffers_clean:
                usage: "COUNTER"
                description: "Number of buffers written by the background writer"
            - maxwritten_clean:
                usage: "COUNTER"
                description: "Number of times the background writer stopped a cleaning scan because it had written too many buffers"
            - buffers_alloc:
                usage: "COUNTER"
                description: "Number of buffers allocated"
            - stats_reset_time:
                usage: "GAUGE"
                description: "Time at which these statistics were last reset"

        pg_stat_checkpointer:
          runonserver: ">=17.0.0"
          query: |
            SELECT num_timed AS checkpoints_timed
              , num_requested AS checkpoints_req
              , restartpoints_timed
              , restartpoints_req
              , restartpoints_done
              , write_time
              , sync_time
              , buffers_written
              , EXTRACT(EPOCH FROM stats_reset) AS stats_reset_time
            FROM pg_catalog.pg_stat_checkpointer
          metrics:
            - checkpoints_timed:
                usage: "COUNTER"
                description: "Number of scheduled checkpoints that have been performed"
            - checkpoints_req:
                usage: "COUNTER"
                description: "Number of requested checkpoints that have been performed"
            - restartpoints_timed:
                usage: "COUNTER"
                description: "Number of scheduled restartpoints due to timeout or after a failed attempt to perform it"
            - restartpoints_req:
                usage: "COUNTER"
                description: "Number of requested restartpoints that have been performed"
            - restartpoints_done:
                usage: "COUNTER"
                description: "Number of restartpoints that have been performed"
            - write_time:
                usage: "COUNTER"
                description: "Total amount of time that has been spent in the portion of processing checkpoints and restartpoints where files are written to disk, in milliseconds"
            - sync_time:
                usage: "COUNTER"
                description: "Total amount of time that has been spent in the portion of processing checkpoints and restartpoints where files are synchronized to disk, in milliseconds"
            - buffers_written:
                usage: "COUNTER"
                description: "Number of buffers written during checkpoints and restartpoints"
            - stats_reset_time:
                usage: "GAUGE"
                description: "Time at which these statistics were last reset"

        pg_stat_database:
          query: |
            SELECT datname
              , xact_commit
              , xact_rollback
              , blks_read
              , blks_hit
              , tup_returned
              , tup_fetched
              , tup_inserted
              , tup_updated
              , tup_deleted
              , conflicts
              , temp_files
              , temp_bytes
              , deadlocks
              , blk_read_time
              , blk_write_time
            FROM pg_catalog.pg_stat_database
          metrics:
            - datname:
                usage: "LABEL"
                description: "Name of this database"
            - xact_commit:
                usage: "COUNTER"
                description: "Number of transactions in this database that have been committed"
            - xact_rollback:
                usage: "COUNTER"
                description: "Number of transactions in this database that have been rolled back"
            - blks_read:
                usage: "COUNTER"
                description: "Number of disk blocks read in this database"
            - blks_hit:
                usage: "COUNTER"
                description: "Number of times disk blocks were found already in the buffer cache, so that a read was not necessary (this only includes hits in the PostgreSQL buffer cache, not the operating system's file system cache)"
            - tup_returned:
                usage: "COUNTER"
                description: "Number of rows returned by queries in this database"
            - tup_fetched:
                usage: "COUNTER"
                description: "Number of rows fetched by queries in this database"
            - tup_inserted:
                usage: "COUNTER"
                description: "Number of rows inserted by queries in this database"
            - tup_updated:
                usage: "COUNTER"
                description: "Number of rows updated by queries in this database"
            - tup_deleted:
                usage: "COUNTER"
                description: "Number of rows deleted by queries in this database"
            - conflicts:
                usage: "COUNTER"
                description: "Number of queries canceled due to conflicts with recovery in this database"
            - temp_files:
                usage: "COUNTER"
                description: "Number of temporary files created by queries in this database"
            - temp_bytes:
                usage: "COUNTER"
                description: "Total amount of data written to temporary files by queries in this database"
            - deadlocks:
                usage: "COUNTER"
                description: "Number of deadlocks detected in this database"
            - blk_read_time:
                usage: "COUNTER"
                description: "Time spent reading data file blocks by backends in this database, in milliseconds"
            - blk_write_time:
                usage: "COUNTER"
                description: "Time spent writing data file blocks by backends in this database, in milliseconds"

        pg_stat_replication:
          primary: true
          query: |
            SELECT usename
              , COALESCE(application_name, '') AS application_name
              , COALESCE(client_addr::text, '') AS client_addr
              , COALESCE(client_port::text, '') AS client_port
              , EXTRACT(EPOCH FROM backend_start) AS backend_start
              , COALESCE(pg_catalog.age(backend_xmin), 0) AS backend_xmin_age
              , pg_catalog.pg_wal_lsn_diff(pg_catalog.pg_current_wal_lsn(), sent_lsn) AS sent_diff_bytes
              , pg_catalog.pg_wal_lsn_diff(pg_catalog.pg_current_wal_lsn(), write_lsn) AS write_diff_bytes
              , pg_catalog.pg_wal_lsn_diff(pg_catalog.pg_current_wal_lsn(), flush_lsn) AS flush_diff_bytes
              , COALESCE(pg_catalog.pg_wal_lsn_diff(pg_catalog.pg_current_wal_lsn(), replay_lsn),0) AS replay_diff_bytes
              , COALESCE((EXTRACT(EPOCH FROM write_lag)),0)::float AS write_lag_seconds
              , COALESCE((EXTRACT(EPOCH FROM flush_lag)),0)::float AS flush_lag_seconds
              , COALESCE((EXTRACT(EPOCH FROM replay_lag)),0)::float AS replay_lag_seconds
            FROM pg_catalog.pg_stat_replication
          metrics:
            - usename:
                usage: "LABEL"
                description: "Name of the replication user"
            - application_name:
                usage: "LABEL"
                description: "Name of the application"
            - client_addr:
                usage: "LABEL"
                description: "Client IP address"
            - client_port:
                usage: "LABEL"
                description: "Client TCP port"
            - backend_start:
                usage: "COUNTER"
                description: "Time when this process was started"
            - backend_xmin_age:
                usage: "COUNTER"
                description: "The age of this standby's xmin horizon"
            - sent_diff_bytes:
                usage: "GAUGE"
                description: "Difference in bytes from the last write-ahead log location sent on this connection"
            - write_diff_bytes:
                usage: "GAUGE"
                description: "Difference in bytes from the last write-ahead log location written to disk by this standby server"
            - flush_diff_bytes:
                usage: "GAUGE"
                description: "Difference in bytes from the last write-ahead log location flushed to disk by this standby server"
            - replay_diff_bytes:
                usage: "GAUGE"
                description: "Difference in bytes from the last write-ahead log location replayed into the database on this standby server"
            - write_lag_seconds:
                usage: "GAUGE"
                description: "Time elapsed between flushing recent WAL locally and receiving notification that this standby server has written it"
            - flush_lag_seconds:
                usage: "GAUGE"
                description: "Time elapsed between flushing recent WAL locally and receiving notification that this standby server has written and flushed it"
            - replay_lag_seconds:
                usage: "GAUGE"
                description: "Time elapsed between flushing recent WAL locally and receiving notification that this standby server has written, flushed and applied it"

        pg_settings:
          query: |
            SELECT name,
            CASE setting WHEN 'on' THEN '1' WHEN 'off' THEN '0' ELSE setting END AS setting
            FROM pg_catalog.pg_settings
            WHERE vartype IN ('integer', 'real', 'bool')
            ORDER BY 1
          metrics:
            - name:
                usage: "LABEL"
                description: "Name of the setting"
            - setting:
                usage: "GAUGE"
                description: "Setting value"

        pg_extensions:
          query: |
            SELECT
              pg_catalog.current_database() as datname,
              name as extname,
              default_version,
              installed_version,
              CASE
                WHEN default_version OPERATOR(pg_catalog.=) installed_version THEN 0
                ELSE 1
            END AS update_available
            FROM pg_catalog.pg_available_extensions
            WHERE installed_version IS NOT NULL
          metrics:
            - datname:
                usage: "LABEL"
                description: "Name of the database"
            - extname:
                usage: "LABEL"
                description: "Extension name"
            - default_version:
                usage: "LABEL"
                description: "Default version"
            - installed_version:
                usage: "LABEL"
                description: "Installed version"
            - update_available:
                usage: "GAUGE"
                description: "An update is available"
          target_databases:
            - '*'

        pg_stat_io:
          runonserver: ">=16.0.0"
          query: |
            SELECT backend_type
              , object
              , context
              , COALESCE(reads, 0) AS reads
              , COALESCE(writes, 0) AS writes
              , COALESCE(writebacks, 0) AS writebacks
              , COALESCE(extends, 0) AS extends
              , COALESCE(hits, 0) AS hits
              , COALESCE(evictions, 0) AS evictions
              , COALESCE(reuses, 0) AS reuses
              , COALESCE(fsyncs, 0) AS fsyncs
              , COALESCE(read_time, 0) AS read_time
              , COALESCE(write_time, 0) AS write_time
              , COALESCE(writeback_time, 0) AS writeback_time
              , COALESCE(extend_time, 0) AS extend_time
              , COALESCE(fsync_time, 0) AS fsync_time
            FROM pg_catalog.pg_stat_io
            WHERE COALESCE(reads, writes, writebacks, extends, hits, evictions, reuses, fsyncs) IS NOT NULL
          metrics:
            - backend_type:
                usage: "LABEL"
                description: "Type of backend (e.g. background worker, autovacuum worker)"
            - object:
                usage: "LABEL"
                description: "Target object of an I/O operation (relation or temp relation)"
            - context:
                usage: "LABEL"
                description: "Context of an I/O operation (normal, vacuum, bulkread or bulkwrite)"
            - reads:
                usage: "COUNTER"
                description: "Number of read operations"
            - writes:
                usage: "COUNTER"
                description: "Number of write operations"
            - writebacks:
                usage: "COUNTER"
                description: "Number of units of size block_size which the process requested the kernel write out to permanent storage"
            - extends:
                usage: "COUNTER"
                description: "Number of relation extend operations"
            - hits:
                usage: "COUNTER"
                description: "Number of times a desired block was found in a shared buffer"
            - evictions:
                usage: "COUNTER"
                description: "Number of times a block has been written out from a shared or local buffer in order to make it available for another use"
            - reuses:
                usage: "COUNTER"
                description: "Number of times an existing buffer in a size-limited ring buffer outside of shared buffers was reused as part of an I/O operation in the bulkread, bulkwrite, or vacuum contexts"
            - fsyncs:
                usage: "COUNTER"
                description: "Number of fsync calls"
            - read_time:
                usage: "COUNTER"
                description: "Time spent in read operations in milliseconds (zero unless track_io_timing is enabled)"
            - write_time:
                usage: "COUNTER"
                description: "Time spent in write operations in milliseconds (zero unless track_io_timing is enabled)"
            - writeback_time:
                usage: "COUNTER"
                description: "Time spent in writeback operations in milliseconds (zero unless track_io_timing is enabled)"
            - extend_time:
                usage: "COUNTER"
                description: "Time spent in extend operations in milliseconds (zero unless track_io_timing is enabled)"
            - fsync_time:
                usage: "COUNTER"
                description: "Time spent in fsync operations in milliseconds (zero unless track_io_timing is enabled)"

        pg_stat_user_tables:
          primary: true
          query: |
            SELECT pg_catalog.current_database() AS datname
              , schemaname
              , relname
              , n_tup_ins
              , n_tup_upd
              , n_tup_hot_upd
              , n_tup_del
              , n_dead_tup
              , n_live_tup
              , autovacuum_count
              , autoanalyze_count
              , vacuum_count
              , pg_catalog.pg_total_relation_size(relid) AS total_relation_size_bytes
            FROM (
              SELECT relid
                , schemaname
                , relname
                , n_tup_ins
                , n_tup_upd
                , n_tup_hot_upd
                , n_tup_del
                , n_dead_tup
                , n_live_tup
                , autovacuum_count
                , autoanalyze_count
                , vacuum_count
              FROM pg_catalog.pg_stat_user_tables
              ORDER BY (n_tup_ins OPERATOR(pg_catalog.+) n_tup_upd OPERATOR(pg_catalog.+) n_tup_del) DESC
                , schemaname
                , relname
              LIMIT 20
            ) AS top_tables
          metrics:
            - datname:
                usage: "LABEL"
                description: "Name of the database"
            - schemaname:
                usage: "LABEL"
                description: "Name of the schema that this table is in"
            - relname:
                usage: "LABEL"
                description: "Name of this table"
            - n_tup_ins:
                usage: "COUNTER"
                description: "Number of rows inserted"
            - n_tup_upd:
                usage: "COUNTER"
                description: "Number of rows updated (includes HOT updated rows)"
            - n_tup_hot_upd:
                usage: "COUNTER"
                description: "Number of rows HOT updated"
            - n_tup_del:
                usage: "COUNTER"
                description: "Number of rows deleted"
            - n_dead_tup:
                usage: "GAUGE"
                description: "Estimated number of dead rows"
            - n_live_tup:
                usage: "GAUGE"
                description: "Estimated number of live rows"
            - autovacuum_count:
                usage: "COUNTER"
                description: "Number of times this table has been vacuumed by the autovacuum daemon"
            - autoanalyze_count:
                usage: "COUNTER"
                description: "Number of times this table has been analyzed by the autovacuum daemon"
            - vacuum_count:
                usage: "COUNTER"
                description: "Number of times this table has been manually vacuumed (not counting VACUUM FULL)"
            - total_relation_size_bytes:
                usage: "GAUGE"
                description: "Total disk space used by the table, including TOAST data and indexes, in bytes"
          target_databases:
            - '*'
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-operator
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: fluent-operator
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: logging
    entity: cluster
    env: main
    capability: observability
spec:
  releaseName: fluent-operator
  install:
    createNamespace: true
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: fluent-operator
      version: "4.3.0"
      sourceRef:
        kind: HelmRepository
        name: fluent
        namespace: flux-system
  interval: 5m
  values:
    containerRuntime: containerd
    fluentbit:
      enable: false
    fluentd:
      enable: false
    operator:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 192Mi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kured
  namespace: kured
  labels:
    app.kubernetes.io/name: kured
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: node-lifecycle
    entity: cluster
    capability: lifecycle
spec:
  releaseName: kured
  chart:
    spec:
      chart: kured
      version: "6.1.0"
      sourceRef:
        kind: HelmRepository
        name: kured
        namespace: flux-system
  interval: 5m
  values:
    configuration:
      rebootSentinel: /var/run/reboot-required
      useRebootSentinelHostPath: true
      period: 1h
      lockTtl: 30m
      rebootDays: [mo, tu, we, th, fr, sa, su]
      startTime: "03:00"
      endTime: "05:00"
      timeZone: UTC
      drainTimeout: 15m
      prometheusUrl: http://prometheus-operated.cluster-main-observability.svc.cluster.local:9090
      alertFilterRegexp: "^RebootGateClosed$"
      alertFilterMatchOnly: true
      alertFiringOnly: true
    tolerations:
      - operator: Exists
