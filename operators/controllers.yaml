---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: certificates
    entity: cluster
    capability: certs
spec:
  releaseName: cert-manager
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux-system
  interval: 5m
  values:
    crds:
      enabled: true
    namespace: cert-manager
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crossplane
  namespace: crossplane-system
  labels:
    app.kubernetes.io/name: crossplane
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: iac
    entity: cluster
    capability: iac
spec:
  interval: 5m
  releaseName: crossplane
  chart:
    spec:
      chart: crossplane
      sourceRef:
        kind: HelmRepository
        name: crossplane-stable
        namespace: flux-system
  values:
    provider:
      packages: []
    configuration:
      packages: []
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
  labels:
    app.kubernetes.io/name: kyverno
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: policy
    entity: cluster
    capability: governance
spec:
  interval: 5m
  releaseName: kyverno-controller
  chart:
    spec:
      chart: kyverno
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: monitoring
    entity: cluster
    env: main
    capability: observability
spec:
  releaseName: prometheus
  install:
    createNamespace: true
  chart:
    spec:
      chart: kube-prometheus-stack
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  interval: 5m
  values:
    prometheus:
      prometheusSpec:
        serviceMonitorSelectorNilUsesHelmValues: false
        honorLabels: true
        scrapeInterval: 120s
        evaluationInterval: 120s
        retention: 3d
        retentionSize: 5GB
        resources:
          requests:
            cpu: 100m
            memory: 2Gi
          limits:
            memory: 3Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi
        query:
          maxConcurrency: 8
          maxSamples: 25000000
    kubeApiServer:
      serviceMonitor:
        metricRelabelings:
        - action: drop
          sourceLabels: [__name__]
          regex: apiserver_request_duration_seconds_bucket|etcd_request_duration_seconds_bucket|apiserver_request_sli_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket|workqueue_queue_duration_seconds_bucket|workqueue_work_duration_seconds_bucket|apiserver_watch_cache_read_wait_seconds_bucket
    kubelet:
      serviceMonitor:
        cAdvisorMetricRelabelings:
        - action: drop
          sourceLabels: [__name__]
          regex: container_tasks_state|container_memory_failures_total|container_network_tcp_usage_total|container_network_udp_usage_total|container_blkio_device_usage_total|container_network_.*_errors_total|container_network_.*_dropped_total|container_spec_.*|container_file_descriptors|container_threads.*|container_processes|container_sockets|container_last_seen|container_start_time_seconds
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
    grafana:
      adminPassword: admin
      persistence:
        enabled: true
        storageClassName: local-path
        size: 10Gi
      ingress:
        enabled: false
    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: cnpg-system
  labels:
    app.kubernetes.io/name: cnpg
    app.kubernetes.io/part-of: database
    app.kubernetes.io/component: operator
    entity: cluster
    env: main
    capability: data
spec:
  releaseName: cnpg
  install:
    createNamespace: true
  chart:
    spec:
      chart: cloudnative-pg
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: flux-system
  interval: 5m
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: logging
    entity: cluster
    env: main
    capability: observability
spec:
  releaseName: fluent-bit
  install:
    createNamespace: true
  chart:
    spec:
      chart: fluent-bit
      sourceRef:
        kind: HelmRepository
        name: fluent
        namespace: flux-system
  interval: 5m
  values:
    kind: DaemonSet
    # The kubernetes_events input reads core/v1 Events, which the chart's
    # default ClusterRole (namespaces + pods only) does not cover.
    rbac:
      eventsAccess: true
    # Tailing every container log on the node is meaningfully more work than
    # reading the journal was. No CPU limit on purpose: throttling a log
    # shipper does not shed load, it just moves the backlog into memory.
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
    # CNPG wraps every postgres ERROR in a JSON record that embeds the entire
    # offending SQL statement -- one such record measured 4494 bytes, and
    # fifty of them overflowed get_kubernetes_logs outright. The identifying
    # part (error_severity, sql_state_code, message) is always near the front;
    # the tail is query text nobody reads from a log feed.
    luaScripts:
      truncate.lua: |
        function truncate(tag, ts, record)
          for _, k in ipairs({"log", "message"}) do
            local v = record[k]
            if type(v) == "string" and #v > 600 then
              record[k] = string.sub(v, 1, 600) .. " ...[truncated]"
            end
          end
          -- 2 = record replaced, original timestamp kept
          return 2, ts, record
        end
      # One broken workload should not be able to evict every other workload
      # from the feed. Before this, a single cal pod repeating the same
      # CLIENT_FETCH_ERROR every 5s was ~85% of all records, and gbrain-pg-1
      # another ~1/s on top -- so the feed was technically complete and
      # practically unreadable, which is the same failure the token limit
      # caused, arriving by a different route.
      #
      # This is deliberately lossy. Occurrences 2..N inside a window are
      # DROPPED, not buffered: the next emission of that signature carries a
      # `suppressed` count instead. If you need every occurrence of something,
      # read that pod's own log directly -- this feed is a triage surface, not
      # an audit trail.
      dedup.lua: |
        -- Seconds a signature stays suppressed after being emitted once.
        local WINDOW = 60
        -- Bound on tracked signatures. On overflow the whole table is dropped
        -- rather than grown or LRU-evicted: the cost is one extra emitted
        -- record per live signature, which is the safe direction to fail for
        -- a filter whose bug mode is "silently discards errors".
        local MAX_KEYS = 5000

        local seen = {}
        local nkeys = 0

        -- Signature, not equality. The repeating records are never byte-equal:
        -- CNPG varies log_time/process_id/session_line_num and Kubernetes
        -- events carry an ever-incrementing count, all of which sit early in
        -- the string. Collapsing every digit run to '#' makes those variants
        -- hash together while still separating genuinely different messages.
        -- Capped at 400 chars so signature cost stays flat regardless of
        -- record size.
        local function signature(record)
          local text = record.log or record.message or ""
          local src = record.k8s_pod_name
                      or record.obj_name
                      or "?"
          -- Hex before digits, and both are needed. CNPG stamps a hex
          -- session_id into every record (6a845d2d.4808e vs 6a845cf1.4806f
          -- one second apart), which a digits-only pass normalizes to
          -- #a#d#d and #a#cf# -- still different, so the repeat leaked
          -- through. Six is the shortest run worth collapsing; it does mean
          -- an all-hex English word like "facade" normalizes too, which
          -- costs nothing here because this string is only ever a grouping
          -- key and never reaches the output.
          local sig = string.gsub(string.sub(text, 1, 400), "%x%x%x%x%x%x+", "#")
          sig = string.gsub(sig, "%d+", "#")
          return src .. "\0" .. (record.reason or "") .. "\0" .. sig
        end

        function dedup(tag, ts, record)
          local key = signature(record)
          local entry = seen[key]

          if entry ~= nil and (ts - entry.last) < WINDOW then
            entry.count = entry.count + 1
            return -1, ts, record
          end

          if entry ~= nil and entry.count > 0 then
            record["suppressed"] = entry.count
          end

          if entry == nil then
            if nkeys >= MAX_KEYS then
              seen = {}
              nkeys = 0
            end
            nkeys = nkeys + 1
          end
          seen[key] = { last = ts, count = 0 }

          return 2, ts, record
        end
    config:
      service: |
        [SERVICE]
            Daemon Off
            Flush 1
            # error, not info: this service log shares stdout with the JSON
            # records below, so every inotify_fs_add() lands in the feed. No
            # filter can reach it -- level is the only lever.
            Log_Level error
            Parsers_File /fluent-bit/etc/parsers.conf
            Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
            HTTP_Server On
            HTTP_Listen 0.0.0.0
            HTTP_Port 2020
            Health_Check On
      inputs: |
        # Container stdout/stderr. multiline.parser cri both strips the CRI
        # envelope and rejoins partial (P) lines, so a stack trace arrives as
        # ONE record instead of forty -- which is what lets the grep filter
        # below keep the whole trace off its single "Exception" line.
        #
        # It emits the message under the key `log`. The plain
        # `[PARSER] Name cri` emits it under `message` instead. If you ever
        # swap one for the other, update every `log`-keyed filter below, or
        # the feed silently goes empty while still looking healthy.
        #
        # Exclude_Path is load-bearing, not tidiness: this pipeline's OUTPUT
        # is this pod's own stdout, which the kubelet writes straight back
        # into /var/log/containers. Tailing our own log would re-ingest every
        # record we emit, and because we keep only lines matching
        # /error|fatal|.../ the re-ingested copies match too. That is
        # unbounded amplification, not a duplicate-line annoyance. The glob is
        # deliberately namespace-agnostic so it still holds if the release's
        # targetNamespace changes.
        [INPUT]
            Name              tail
            Alias             container_logs
            Tag               kube.*
            Path              /var/log/containers/*.log
            Exclude_Path      /var/log/containers/fluent-bit-*.log
            multiline.parser  cri
            Skip_Long_Lines   On
            Refresh_Interval  10
            Mem_Buf_Limit     16MB
            DB                /var/log/flb-container.db

        # Crashes are the case container logs help with least: OOMKilled,
        # CrashLoopBackOff, FailedScheduling and image-pull failures produce
        # no application log line at all, and the pod whose log you would want
        # is usually already gone. Events carry those reasons.
        [INPUT]
            Name              kubernetes_events
            Alias             warning_events
            Tag               k8sevent
      filters: |
        # Merge_Log is deliberately Off. With it On, a JSON-logging app has
        # its fields lifted to the record root and the `log` key is dropped --
        # so the grep below, which keys on `log`, would discard exactly those
        # apps' errors while quietly keeping everyone else's.
        [FILTER]
            Name                kubernetes
            Match               kube.*
            Merge_Log           Off
            Labels              Off
            Annotations         Off
            K8S-Logging.Parser  Off
            K8S-Logging.Exclude On

        # This regex is the entire editorial policy of the feed: widen it and
        # the feed drowns, narrow it and real failures go missing. A pod can
        # opt out of collection entirely with the annotation
        # fluentbit.io/exclude: "true" (K8S-Logging.Exclude, above).
        [FILTER]
            Name    grep
            Match   kube.*
            Regex   log (?i)\b(errors?|fatal|panic|critical|exception|traceback|segfault|oomkilled|failed|failure)\b

        [FILTER]
            Name         nest
            Match        kube.*
            Operation    lift
            Nested_under kubernetes
            Add_prefix   k8s_

        # Trim hard. The previous config put whole records on stdout and the
        # result overflowed get_kubernetes_logs' token limit within minutes,
        # which is a way of being unreadable that looks like working.
        [FILTER]
            Name          record_modifier
            Match         kube.*
            Allowlist_key k8s_namespace_name
            Allowlist_key k8s_pod_name
            Allowlist_key k8s_container_name
            Allowlist_key stream
            Allowlist_key log

        [FILTER]
            Name    grep
            Match   k8sevent
            Regex   type Warning

        # DNSConfigForming fires on essentially every pod on this node (three
        # upstream nameservers configured, kubelet keeps two) and is already
        # at count 7000+ and climbing. It is a permanent property of the
        # node's resolv.conf, not an incident, and it was the single largest
        # source of event volume in the feed.
        [FILTER]
            Name    grep
            Match   k8sevent
            Exclude reason DNSConfigForming

        [FILTER]
            Name         nest
            Match        k8sevent
            Operation    lift
            Nested_under involvedObject
            Add_prefix   obj_

        [FILTER]
            Name          record_modifier
            Match         k8sevent
            Allowlist_key obj_namespace
            Allowlist_key obj_kind
            Allowlist_key obj_name
            Allowlist_key reason
            Allowlist_key message
            Allowlist_key count

        # After the greps, deliberately: the greps above must match against
        # the full untruncated text, or a long record whose only error
        # keyword sits past byte 600 would be silently dropped instead of
        # trimmed.
        [FILTER]
            Name    lua
            Match   *
            script  /fluent-bit/scripts/truncate.lua
            call    truncate

        # After truncate, not before: signature() reads only the first 400
        # chars, so it sees identical input either way, and running last keeps
        # this the single place records leave the pipeline.
        [FILTER]
            Name    lua
            Match   *
            script  /fluent-bit/scripts/dedup.lua
            call    dedup
      outputs: |
        # stdout IS the delivery mechanism here, not a placeholder. It puts
        # the whole cluster's errors into one pod's log stream, which is the
        # one shape mcp-flux's get_kubernetes_logs can read -- that tool
        # fetches a single named pod, so "which pod?" has to stop being a
        # question you need answered before you can look.
        #
        # Retention is therefore only whatever kubelet log rotation gives.
        # A durable backend is deliberate follow-on work, not part of this.
        [OUTPUT]
            Name             stdout
            Match            kube.*
            Format           json_lines
            json_date_key    time
            json_date_format iso8601

        [OUTPUT]
            Name             stdout
            Match            k8sevent
            Format           json_lines
            json_date_key    time
            json_date_format iso8601
    tolerations:
      - effect: NoSchedule
        operator: Exists
    # The chart's default daemonSetVolumes/daemonSetVolumeMounts already mount
    # hostPath /var/log read-write, which is all this pipeline needs:
    # /var/log/containers/*.log are symlinks into /var/log/pods, and the tail
    # DB above needs the write. There was previously a `volumeMounts:`
    # override here; it was inert. Chart 0.58.1's pod template reads
    # daemonSetVolumeMounts / extraVolumeMounts and never .Values.volumeMounts,
    # so the /run/systemd mount it declared was never actually applied -- do
    # not reintroduce that key expecting it to do something.
