---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: certificates
    entity: cluster
    capability: certs
spec:
  releaseName: cert-manager
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.2"
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux-system
  interval: 5m
  values:
    crds:
      enabled: true
    namespace: cert-manager
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
  labels:
    app.kubernetes.io/name: kyverno
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: policy
    entity: cluster
    capability: governance
spec:
  interval: 5m
  releaseName: kyverno-controller
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - ""
        target:
          group: coordination.k8s.io
          kind: Lease
  chart:
    spec:
      chart: kyverno
      version: "3.9.1"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  values:
    backgroundController:
      enabled: false
    reportsController:
      enabled: false
    features:
      admissionReports:
        enabled: false
      logging:
        format: json
        verbosity: 0
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: monitoring
    entity: cluster
    env: main
    capability: observability
spec:
  releaseName: prometheus
  install:
    createNamespace: true
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "91.8.2"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  interval: 5m
  values:
    prometheus:
      prometheusSpec:
        podMetadata:
          annotations:
            resiliency.simplesalt.company/storage-tier: blips-are-ok
        serviceMonitorSelectorNilUsesHelmValues: false
        honorLabels: true
        scrapeInterval: 120s
        evaluationInterval: 120s
        retention: 3d
        retentionSize: 5GB
        resources:
          requests:
            cpu: 100m
            memory: 2Gi
          limits:
            memory: 3Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 8Gi
        query:
          maxConcurrency: 8
          maxSamples: 25000000
    kubeApiServer:
      serviceMonitor:
        metricRelabelings:
        - action: drop
          sourceLabels: [__name__]
          regex: apiserver_request_duration_seconds_bucket|etcd_request_duration_seconds_bucket|apiserver_request_sli_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket|workqueue_queue_duration_seconds_bucket|workqueue_work_duration_seconds_bucket|apiserver_watch_cache_read_wait_seconds_bucket
    kubelet:
      serviceMonitor:
        cAdvisorMetricRelabelings:
        - action: drop
          sourceLabels: [__name__]
          regex: container_tasks_state|container_memory_failures_total|container_network_tcp_usage_total|container_network_udp_usage_total|container_blkio_device_usage_total|container_network_.*_errors_total|container_network_.*_dropped_total|container_spec_.*|container_file_descriptors|container_threads.*|container_processes|container_sockets|container_last_seen|container_start_time_seconds
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
    grafana:
      enabled: false
    defaultRules:
      disabled:
        NodeDiskIOSaturation: true
        NodeMemoryHighUtilization: true
        NodeMemoryMajorPagesFaults: true
        NodeSystemSaturation: true
        NodeCPUHighUsage: true
        NodeSystemdServiceFailed: true
        NodeSystemdServiceCrashlooping: true
    customRules:
      KubeNodePressure:
        severity: warning
      KubeNodeEviction:
        severity: warning
    prometheus-node-exporter:
      prometheus:
        monitor:
          interval: 30s
    alertmanager:
      alertmanagerSpec:
        podMetadata:
          annotations:
            resiliency.simplesalt.company/storage-tier: blips-are-ok
        storage:
          emptyDir: {}
      # Log every firing and resolved alert (platform/alert-logger.yaml
      # prints one JSON line per alert; fluent-bit ships it to the logs
      # database). Only route and receivers are set here: Helm deep-merges
      # maps, so the chart's default global, inhibit_rules and templates keep
      # applying unchanged. The chart's route.routes list is replaced by the
      # one below, which carries its Watchdog entry forward.
      config:
        route:
          receiver: alert-logger
          # One group per alert (every label), so each alert is logged once
          # when it fires, once when it resolves, and again every
          # repeat_interval while it keeps firing -- never re-logged just
          # because a different alert joined or left a shared group.
          group_by: ["..."]
          group_wait: 30s
          group_interval: 2m
          repeat_interval: 4h
          routes:
            - receiver: "null"
              matchers:
                - alertname =~ "Watchdog|InfoInhibitor"
        receivers:
          - name: "null"
          - name: alert-logger
            webhook_configs:
              - url: http://alert-logger.cluster-main-observability.svc.cluster.local:8080/alerts
                send_resolved: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: cnpg-system
  labels:
    app.kubernetes.io/name: cnpg
    app.kubernetes.io/part-of: database
    app.kubernetes.io/component: operator
    entity: cluster
    env: main
    capability: data
spec:
  releaseName: cnpg
  install:
    createNamespace: true
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.29.1"
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: flux-system
  interval: 5m
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-operator
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: fluent-operator
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: logging
    entity: cluster
    env: main
    capability: observability
spec:
  releaseName: fluent-operator
  install:
    createNamespace: true
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: fluent-operator
      version: "4.3.0"
      sourceRef:
        kind: HelmRepository
        name: fluent
        namespace: flux-system
  interval: 5m
  values:
    containerRuntime: containerd
    fluentbit:
      enable: false
    fluentd:
      enable: false
    operator:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 192Mi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kured
  namespace: kured
  labels:
    app.kubernetes.io/name: kured
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: node-lifecycle
    entity: cluster
    capability: lifecycle
spec:
  releaseName: kured
  chart:
    spec:
      chart: kured
      version: "6.1.0"
      sourceRef:
        kind: HelmRepository
        name: kured
        namespace: flux-system
  interval: 5m
  values:
    configuration:
      rebootSentinel: /var/run/reboot-required
      useRebootSentinelHostPath: true
      period: 1m
      lockTtl: 30m
      rebootDays: [mo, tu, we, th, fr, sa, su]
      startTime: "00:00"
      endTime: "23:59"
      timeZone: UTC
      drainTimeout: 15m
      prometheusUrl: http://prometheus-operated.cluster-main-observability.svc.cluster.local:9090
      alertFilterRegexp: "^RebootGateClosed$"
      alertFilterMatchOnly: true
      alertFiringOnly: true
    tolerations:
      - operator: Exists
