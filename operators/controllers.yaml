---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: certificates
    entity: cluster
    capability: certs
spec:
  releaseName: cert-manager
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux-system
  interval: 5m
  values:
    crds:
      enabled: true
    namespace: cert-manager
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crossplane
  namespace: crossplane-system
  labels:
    app.kubernetes.io/name: crossplane
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: iac
    entity: cluster
    capability: iac
spec:
  interval: 5m
  releaseName: crossplane
  chart:
    spec:
      chart: crossplane
      sourceRef:
        kind: HelmRepository
        name: crossplane-stable
        namespace: flux-system
  values:
    provider:
      packages: []
    configuration:
      packages: []
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
  labels:
    app.kubernetes.io/name: kyverno
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: policy
    entity: cluster
    capability: governance
spec:
  interval: 5m
  releaseName: kyverno-controller
  chart:
    spec:
      chart: kyverno
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: monitoring
    entity: cluster
    env: main
    capability: observability
spec:
  releaseName: prometheus
  install:
    createNamespace: true
  chart:
    spec:
      chart: kube-prometheus-stack
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  interval: 5m
  values:
    prometheus:
      prometheusSpec:
        serviceMonitorSelectorNilUsesHelmValues: false
        honorLabels: true
        scrapeInterval: 120s
        evaluationInterval: 120s
        retention: 3d
        retentionSize: 5GB
        resources:
          requests:
            cpu: 100m
            memory: 2Gi
          limits:
            memory: 3Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 8Gi
        query:
          maxConcurrency: 8
          maxSamples: 25000000
    kubeApiServer:
      serviceMonitor:
        metricRelabelings:
        - action: drop
          sourceLabels: [__name__]
          regex: apiserver_request_duration_seconds_bucket|etcd_request_duration_seconds_bucket|apiserver_request_sli_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket|workqueue_queue_duration_seconds_bucket|workqueue_work_duration_seconds_bucket|apiserver_watch_cache_read_wait_seconds_bucket
    kubelet:
      serviceMonitor:
        cAdvisorMetricRelabelings:
        - action: drop
          sourceLabels: [__name__]
          regex: container_tasks_state|container_memory_failures_total|container_network_tcp_usage_total|container_network_udp_usage_total|container_blkio_device_usage_total|container_network_.*_errors_total|container_network_.*_dropped_total|container_spec_.*|container_file_descriptors|container_threads.*|container_processes|container_sockets|container_last_seen|container_start_time_seconds
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
    grafana:
      adminPassword: admin
      persistence:
        enabled: false
      ingress:
        enabled: false
    alertmanager:
      alertmanagerSpec:
        storage:
          emptyDir: {}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: cnpg-system
  labels:
    app.kubernetes.io/name: cnpg
    app.kubernetes.io/part-of: database
    app.kubernetes.io/component: operator
    entity: cluster
    env: main
    capability: data
spec:
  releaseName: cnpg
  install:
    createNamespace: true
  chart:
    spec:
      chart: cloudnative-pg
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: flux-system
  interval: 5m
---
# fluent-operator, not the fluent-bit chart. The chart can only express one
# central pipeline, so every filter rule for a misbehaving workload had to be
# written here, in a file that workload's owner does not touch. The operator
# turns the pipeline into CRs, and adds a namespaced Filter kind: a workload
# ships its own noise rule alongside its own Deployment.
#
# The DaemonSet is still fluent-bit and the sink is still out_pgsql. The
# operator's image is FROM fluent/fluent-bit and only swaps the entrypoint for
# a config watcher, so the plugin set -- including pgsql, which is not in the
# CMake defaults and only exists because Fluent's own Dockerfile turns it on --
# is the same binary we run today.
#
# The pipeline itself lives in platform/fluent-bit.yaml, next to logs-pg, and
# is applied by the platform Kustomization, which dependsOn this one so the
# CRDs exist before the CRs referencing them.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-operator
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: fluent-operator
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: logging
    entity: cluster
    env: main
    capability: observability
spec:
  releaseName: fluent-operator
  install:
    createNamespace: true
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: fluent-operator
      sourceRef:
        kind: HelmRepository
        name: fluent
        namespace: flux-system
  interval: 5m
  values:
    # containerd, so the operator mounts /var/log/containers rather than the
    # docker path; the tail input's Path is resolved against the host either
    # way, but the wrong value gives fluent-bit an empty directory.
    containerRuntime: containerd
    # The chart ships a starter Kubernetes pipeline -- its own ClusterInput,
    # ClusterFilter and stdout ClusterOutput -- which would sit alongside ours
    # and duplicate every record. Ours is checked in as CRs; the chart is asked
    # for the operator and the CRDs only.
    fluentbit:
      enable: false
    fluentd:
      enable: false
