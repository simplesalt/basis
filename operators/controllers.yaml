---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: certificates
    entity: cluster
    capability: certs
spec:
  releaseName: cert-manager
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux-system
  interval: 5m
  values:
    crds:
      enabled: true
    namespace: cert-manager
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crossplane
  namespace: crossplane-system
  labels:
    app.kubernetes.io/name: crossplane
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: iac
    entity: cluster
    capability: iac
spec:
  interval: 5m
  releaseName: crossplane
  chart:
    spec:
      chart: crossplane
      sourceRef:
        kind: HelmRepository
        name: crossplane-stable
        namespace: flux-system
  values:
    provider:
      packages: []
    configuration:
      packages: []
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
  labels:
    app.kubernetes.io/name: kyverno
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: policy
    entity: cluster
    capability: governance
spec:
  interval: 5m
  releaseName: kyverno-controller
  chart:
    spec:
      chart: kyverno
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: monitoring
    entity: cluster
    env: main
    capability: observability
spec:
  releaseName: prometheus
  install:
    createNamespace: true
  chart:
    spec:
      chart: kube-prometheus-stack
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  interval: 5m
  values:
    prometheus:
      prometheusSpec:
        serviceMonitorSelectorNilUsesHelmValues: false
        honorLabels: true
        scrapeInterval: 120s
        evaluationInterval: 120s
        retention: 3d
        retentionSize: 5GB
        resources:
          requests:
            cpu: 100m
            memory: 2Gi
          limits:
            memory: 3Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 8Gi
        query:
          maxConcurrency: 8
          maxSamples: 25000000
    kubeApiServer:
      serviceMonitor:
        metricRelabelings:
        - action: drop
          sourceLabels: [__name__]
          regex: apiserver_request_duration_seconds_bucket|etcd_request_duration_seconds_bucket|apiserver_request_sli_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket|workqueue_queue_duration_seconds_bucket|workqueue_work_duration_seconds_bucket|apiserver_watch_cache_read_wait_seconds_bucket
    kubelet:
      serviceMonitor:
        cAdvisorMetricRelabelings:
        - action: drop
          sourceLabels: [__name__]
          regex: container_tasks_state|container_memory_failures_total|container_network_tcp_usage_total|container_network_udp_usage_total|container_blkio_device_usage_total|container_network_.*_errors_total|container_network_.*_dropped_total|container_spec_.*|container_file_descriptors|container_threads.*|container_processes|container_sockets|container_last_seen|container_start_time_seconds
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
    grafana:
      adminPassword: admin
      persistence:
        enabled: false
      ingress:
        enabled: false
    alertmanager:
      alertmanagerSpec:
        storage:
          emptyDir: {}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: cnpg-system
  labels:
    app.kubernetes.io/name: cnpg
    app.kubernetes.io/part-of: database
    app.kubernetes.io/component: operator
    entity: cluster
    env: main
    capability: data
spec:
  releaseName: cnpg
  install:
    createNamespace: true
  chart:
    spec:
      chart: cloudnative-pg
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: flux-system
  interval: 5m
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: logging
    entity: cluster
    env: main
    capability: observability
spec:
  releaseName: fluent-bit
  install:
    createNamespace: true
  chart:
    spec:
      chart: fluent-bit
      sourceRef:
        kind: HelmRepository
        name: fluent
        namespace: flux-system
  interval: 5m
  values:
    kind: DaemonSet
    # Credentials for the pgsql output below. fluent-bit interpolates ${VAR}
    # from the process environment, so the CNPG-managed Secret never appears in
    # git or in the rendered config. logs-pg-app lives in this namespace and is
    # created by the logs-pg Cluster in platform/logs-pg.yaml.
    env:
      - name: LOGS_PG_HOST
        valueFrom:
          secretKeyRef:
            name: logs-pg-app
            key: host
      - name: LOGS_PG_USER
        valueFrom:
          secretKeyRef:
            name: logs-pg-app
            key: username
      - name: LOGS_PG_PASSWORD
        valueFrom:
          secretKeyRef:
            name: logs-pg-app
            key: password
      - name: LOGS_PG_DATABASE
        valueFrom:
          secretKeyRef:
            name: logs-pg-app
            key: dbname
    config:
      service: |
        [SERVICE]
            Daemon Off
            Flush 1
            Log_Level info
            Parsers_File /fluent-bit/etc/parsers.conf
            Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
            HTTP_Server On
            HTTP_Listen 0.0.0.0
            HTTP_Port 2020
            Health_Check On
            storage.path /var/lib/fluent-bit/storage/
            storage.sync normal
            storage.checksum off
            storage.backlog.mem_limit 64M
      inputs: |
        [INPUT]
            Name systemd
            Tag host.*
            Read_From_Tail On
            Strip_Underscores On
        # The log pipeline must not tail its own components. Without this
        # exclusion a logs-pg wobble makes PostgREST emit error lines at several
        # per second, which are tailed, which load logs-pg further — a spiral
        # that gets worse exactly when the database is least able to absorb it.
        # Container log filenames are <pod>_<namespace>_<container>-<id>.log.
        [INPUT]
            Name tail
            Tag kube.*
            Path /var/log/containers/*.log
            Exclude_Path /var/log/containers/fluent-bit-*_cluster-main-observability_*.log,/var/log/containers/logs-pg-*_cluster-main-observability_*.log,/var/log/containers/logs-postgrest-*_cluster-main-observability_*.log,/var/log/containers/logs-mcp-*_cluster-main-observability_*.log
            multiline.parser cri
            Skip_Long_Lines On
            Refresh_Interval 10
            Mem_Buf_Limit 32M
            DB /var/lib/fluent-bit/tail-containers.db
            storage.type filesystem
      filters: |
        [FILTER]
            Name kubernetes
            Match kube.*
            Kube_Tag_Prefix kube.var.log.containers.
            Merge_Log On
            Keep_Log On
            K8S-Logging.Parser On
            K8S-Logging.Exclude On
            Labels Off
            Annotations Off
      outputs: |
        [OUTPUT]
            Name stdout
            Match host.*
            Format json_lines
        [OUTPUT]
            Name pgsql
            Match kube.*
            Host ${LOGS_PG_HOST}
            Port 5432
            User ${LOGS_PG_USER}
            Password ${LOGS_PG_PASSWORD}
            Database ${LOGS_PG_DATABASE}
            Table logs
            Timestamp_Key time
            Retry_Limit no_limits
            storage.total_limit_size 5G
    tolerations:
      - effect: NoSchedule
        operator: Exists
    volumeMounts:
      - name: varlog
        mountPath: /var/log
        readOnly: true
      - name: varlibdockercontainers
        mountPath: /var/lib/docker/containers
        readOnly: true
      - name: etcmachineid
        mountPath: /etc/machine-id
        readOnly: true
      - name: systemd
        mountPath: /run/systemd
        readOnly: true
      - name: flbstate
        mountPath: /var/lib/fluent-bit
    daemonSetVolumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: etcmachineid
        hostPath:
          path: /etc/machine-id
          type: File
      - name: systemd
        hostPath:
          path: /run/systemd
      # The tail input's position DB and the output's filesystem buffer both
      # need a writable, node-local, restart-surviving path. /var/log is mounted
      # read-only above and must stay that way, hence a separate volume.
      #
      # This buffer, not kubelet's 200Mi-per-container rotation, is the real
      # replay mechanism: it is what makes a multi-hour logs-pg outage a delay
      # rather than a hole in the record.
      - name: flbstate
        hostPath:
          path: /var/lib/fluent-bit
          type: DirectoryOrCreate
