---
# One-shot check that alerts reach the logs: posts a warning-level test alert
# to Alertmanager that ends 3 minutes later, so alert-logger should print one
# "alert firing" and one "alert resolved" line for AlertLoggerTest. Remove
# this file and its kustomization entry after reading.
apiVersion: batch/v1
kind: Job
metadata:
  name: probe-alert-logger-test
  namespace: cluster-main-observability
  labels:
    app.kubernetes.io/name: probe-alert-logger-test
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: diagnostic
    entity: cluster
    env: main
    capability: observability
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: probe-alert-logger-test
        app.kubernetes.io/part-of: observability
        app.kubernetes.io/component: diagnostic
        entity: cluster
        env: main
        capability: observability
        scheduling.simplesalt.company/class: work
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: python:3.13-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: ALERTMANAGER_URL
              value: http://alertmanager-operated.cluster-main-observability.svc.cluster.local:9093
          command:
            - python3
            - -c
            - |
              import datetime, json, os, urllib.request
              now = datetime.datetime.now(datetime.timezone.utc)
              fmt = lambda d: d.strftime("%Y-%m-%dT%H:%M:%S.000Z")
              body = [{
                  "labels": {"alertname": "AlertLoggerTest", "severity": "warning",
                             "namespace": "cluster-main-observability"},
                  "annotations": {"summary": "Test alert: confirms firing and resolved alerts reach the logs"},
                  "startsAt": fmt(now),
                  "endsAt": fmt(now + datetime.timedelta(minutes=3)),
              }]
              req = urllib.request.Request(
                  os.environ["ALERTMANAGER_URL"] + "/api/v2/alerts",
                  data=json.dumps(body).encode(),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=15) as resp:
                  print("posted AlertLoggerTest", fmt(now), "->", fmt(now + datetime.timedelta(minutes=3)), "status", resp.status)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
