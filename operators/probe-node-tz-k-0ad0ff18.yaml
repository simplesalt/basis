---
apiVersion: batch/v1
kind: Job
metadata:
  name: probe-node-tz-k-0ad0ff18
  namespace: kured
  labels:
    app.kubernetes.io/name: probe-node-tz
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: node-lifecycle
    entity: cluster
    capability: lifecycle
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: probe-node-tz
        app.kubernetes.io/part-of: basis
        app.kubernetes.io/component: node-lifecycle
    spec:
      restartPolicy: Never
      hostPID: true
      nodeSelector:
        kubernetes.io/hostname: k-0ad0ff18
      tolerations:
        - operator: Exists
      containers:
        - name: probe-node-tz
          image: ghcr.io/simplesalt/oci/cluster:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - nsenter
            - --target=1
            - --mount
            - --uts
            - --ipc
            - --net
            - --pid
            - --
            - bash
            - -c
            - |
              set -u
              echo "=== NODE ==="
              hostname
              echo "=== DATE (local vs UTC) ==="
              date
              date -u
              echo "=== TIMEDATECTL ==="
              timedatectl status 2>&1 || echo "timedatectl unavailable"
              echo "=== /etc/localtime ==="
              readlink -f /etc/localtime 2>&1 || echo "no /etc/localtime symlink"
              echo "=== BOOTC-UPDATE TIMER ==="
              systemctl list-timers bootc-update.timer --all --no-pager 2>&1
              systemctl show bootc-update.timer -p OnCalendar,LastTriggerUSec,NextElapseUSecRealtime,TimersCalendar 2>&1
              echo "=== KURED SENTINEL ==="
              stat -c '%n exists, size=%s mtime=%y' /var/run/reboot-required 2>&1 || echo "ABSENT /var/run/reboot-required"
              echo "=== BOOTC STAGED ==="
              bootc status --format=yaml 2>&1 | grep -A5 '^  staged:'
              echo "=== END ==="
