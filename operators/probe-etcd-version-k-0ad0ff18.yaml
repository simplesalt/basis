---
apiVersion: batch/v1
kind: Job
metadata:
  name: probe-etcd-version-k-0ad0ff18
  namespace: kured
  labels:
    app.kubernetes.io/name: probe-etcd-version
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: node-lifecycle
    entity: cluster
    capability: lifecycle
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: probe-etcd-version
        app.kubernetes.io/part-of: basis
        app.kubernetes.io/component: node-lifecycle
    spec:
      restartPolicy: Never
      hostPID: true
      nodeSelector:
        kubernetes.io/hostname: k-0ad0ff18
      tolerations:
        - operator: Exists
      containers:
        - name: probe-etcd-version
          image: ghcr.io/simplesalt/oci/cluster:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - nsenter
            - --target=1
            - --mount
            - --uts
            - --ipc
            - --net
            - --pid
            - --
            - bash
            - -c
            - |
              set -u
              C=/var/lib/rancher/k3s/server/tls/etcd
              E="--cacert $C/server-ca.crt --cert $C/client.crt --key $C/client.key"
              echo "=== NODE ==="
              hostname
              date -u +%FT%TZ
              echo "=== BOOTC STATUS ==="
              bootc status --format=yaml 2>&1 | head -50
              echo "=== K3S ETCD SNAPSHOTS ==="
              k3s etcd-snapshot ls 2>&1 | tail -8
              echo "=== ETCD MEMBER LIST ==="
              curl -s --max-time 10 $E -X POST https://127.0.0.1:2379/v3/cluster/member/list -H "Content-Type: application/json" -d "{}" 2>&1
              echo
              echo "=== ETCD VERSIONS ==="
              for ip in 192.168.1.186 192.168.1.105 192.168.1.106; do
                printf "%s " "$ip"
                curl -s --max-time 10 $E "https://$ip:2379/version" 2>&1 || printf "unreachable"
                echo
              done
              printf "local "
              curl -s --max-time 10 $E https://127.0.0.1:2379/version 2>&1 || printf "failed"
              echo
              echo "=== END ==="
