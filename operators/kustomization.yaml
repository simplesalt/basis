apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux-instance.yaml
  - ns.yaml
  - helmrepos.yaml
  - controllers.yaml
configMapGenerator:
  - name: kyverno-webhook-scope
    namespace: kyverno
    files:
      - values.yaml=kyverno-webhook-scope.generated.yaml
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/name: kyverno
        app.kubernetes.io/part-of: basis
        app.kubernetes.io/component: policy
        entity: cluster
        capability: governance
