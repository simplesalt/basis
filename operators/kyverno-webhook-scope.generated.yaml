config:
  matchConditions:
    - name: kyverno-resource-filters
      expression: '!(((has(request.subResource) ? request.subResource : '''') == '''' && request.kind.kind in ["Event", "Node", "APIService", "TokenReview", "SubjectAccessReview", "SelfSubjectAccessReview", "Binding", "ReplicaSet", "EphemeralReport", "ClusterEphemeralReport"]) || ((has(request.namespace) ? request.namespace : '''') in ["kyverno", "kube-system", "kube-public", "kube-node-lease"] || (request.resource.group == '''' && request.resource.version == ''v1'' && request.resource.resource == ''namespaces'' && (has(request.name) ? request.name : '''') in ["kyverno", "kube-system", "kube-public", "kube-node-lease"])) || ((((has(request.subResource) ? request.subResource : '''') != '''') && (request.resource.resource == "nodes")) && ((has(request.subResource) ? request.subResource : '''') != '''')) || ((((has(request.subResource) ? request.subResource : '''') != '''') && (request.resource.resource == "apiservices")) && ((has(request.subResource) ? request.subResource : '''') != '''')) || (((((has(request.subResource) ? request.subResource : '''') == '''') && (request.kind.kind == "Pod")) || (((has(request.subResource) ? request.subResource : '''') != '''') && (request.resource.resource == "pods"))) && ((has(request.subResource) ? request.subResource : '''') == "binding")) || ((((has(request.subResource) ? request.subResource : '''') != '''') && (request.resource.resource == "replicasets")) && ((has(request.subResource) ? request.subResource : '''') != '''')))'
    - name: kyverno-excluded-users
      expression: '!((has(request.userInfo.groups) && request.userInfo.groups.exists(g, (g == "system:nodes"))))'
