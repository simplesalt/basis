apiVersion: batch/v1
kind: Job
metadata:
  name: reboot-sentinel-clear-k-95509ca9
  namespace: kured
  labels:
    app.kubernetes.io/name: reboot-sentinel-clear
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: node-lifecycle
    entity: cluster
    capability: lifecycle
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reboot-sentinel-clear
        app.kubernetes.io/part-of: basis
        app.kubernetes.io/component: node-lifecycle
    spec:
      restartPolicy: Never
      hostPID: true
      nodeSelector:
        kubernetes.io/hostname: k-95509ca9
      tolerations:
        - operator: Exists
      containers:
        - name: reboot-sentinel-clear
          image: ghcr.io/simplesalt/oci/cluster:latest
          securityContext:
            privileged: true
          command:
            - nsenter
            - --target=1
            - --mount
            - --uts
            - --ipc
            - --net
            - --pid
            - --
            - rm
            - -f
            - /var/run/reboot-required
