apiVersion: batch/v1
kind: Job
metadata:
  name: probe-node-state-k-e7488b70
  namespace: kured
  labels:
    app.kubernetes.io/name: probe-node-state
    app.kubernetes.io/part-of: basis
    app.kubernetes.io/component: node-lifecycle
    entity: cluster
    capability: lifecycle
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: probe-node-state
        app.kubernetes.io/part-of: basis
        app.kubernetes.io/component: node-lifecycle
    spec:
      restartPolicy: Never
      hostPID: true
      nodeSelector:
        kubernetes.io/hostname: k-e7488b70
      tolerations:
        - operator: Exists
      containers:
        - name: probe-node-state
          image: ghcr.io/simplesalt/oci/cluster:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - nsenter
            - --target=1
            - --mount
            - --uts
            - --ipc
            - --net
            - --pid
            - --
            - bash
            - -c
            - |
              echo "=== NODE ==="
              hostname
              date -u +%FT%TZ
              echo "=== SENTINEL /run ==="
              stat -c '%n size=%s mtime=%y' /run/reboot-required 2>&1 || echo "ABSENT /run/reboot-required"
              echo "=== SENTINEL /var/run ==="
              stat -c '%n size=%s mtime=%y' /var/run/reboot-required 2>&1 || echo "ABSENT /var/run/reboot-required"
              echo "=== BOOTC STATUS YAML ==="
              bootc status --format=yaml 2>&1 || echo "bootc --format=yaml unavailable"
              echo "=== BOOTC STATUS PLAIN ==="
              bootc status 2>&1 || echo "bootc unavailable"
              echo "=== RPM-OSTREE STATUS ==="
              rpm-ostree status 2>&1 || echo "rpm-ostree unavailable"
              echo "=== TIMERS ==="
              systemctl list-timers --all --no-pager 2>&1 || echo "list-timers failed"
              echo "=== PATH UNITS ==="
              systemctl list-units --type=path --all --no-pager 2>&1 || echo "list path units failed"
              echo "=== UPDATE RELATED UNITS ==="
              systemctl list-units --all --no-pager 2>&1 | grep -iE 'bootc|zincati|rpm-ostree|greenboot|update|reboot' || echo "no matching units"
              echo "=== UNIT FILES REFERENCING SENTINEL ==="
              grep -rl 'reboot-required' /etc/systemd /usr/lib/systemd /usr/local/bin /usr/local/sbin /etc/cron.d /etc/cron.daily /etc/cron.hourly /var/lib/bootc 2>/dev/null || echo "no references found"
              echo "=== AUTO UPDATE UNIT STATE ==="
              for u in zincati.service bootc-fetch-apply-updates.timer bootc-fetch-apply-updates.service rpm-ostreed-automatic.timer; do
                printf '%s enabled=' "$u"
                systemctl is-enabled "$u" 2>&1 | head -1
                printf '%s active=' "$u"
                systemctl is-active "$u" 2>&1 | head -1
              done
              echo "=== END ==="
