---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ss-basis-operators
  namespace: flux-system
  labels:
    kyverno-relabel: "2026-11-12"
spec:
  interval: 1m
  path: ./operators
  prune: true
  sourceRef:
    kind: GitRepository
    name: ss-basis
  timeout: 10m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: cert-manager
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kyverno
      namespace: kyverno
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cnpg
      namespace: cnpg-system
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: fluent-operator
      namespace: cluster-main-observability
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ss-basis-platform
  namespace: flux-system
  labels:
    kyverno-relabel: "2026-11-12"
spec:
  dependsOn:
    - name: ss-basis-operators
  interval: 1m
  path: ./platform
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ss-basis
  timeout: 10m
