---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ss-basis-operators
  namespace: flux-system
spec:
  interval: 1m
  path: ./operators
  prune: true
  sourceRef:
    kind: GitRepository
    name: ss-basis
  timeout: 10m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: crossplane
      namespace: crossplane-system
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: cert-manager
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kyverno
      namespace: kyverno
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cnpg
      namespace: cnpg-system
    # Gates the platform Kustomization on the fluent-bit CRDs existing, since
    # platform/fluent-bit.yaml is nothing but CRs against them.
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: fluent-operator
      namespace: cluster-main-observability
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ss-basis-platform
  namespace: flux-system
spec:
  dependsOn:
    - name: ss-basis-operators
  interval: 1m
  path: ./platform
  prune: true
  sourceRef:
    kind: GitRepository
    name: ss-basis
  timeout: 10m
  healthChecks:
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      name: provider-cloudflare-r2
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      name: provider-gcp-cloudplatform
